<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🕺 街舞音乐教学 · 多轨分析器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
:root{
  --bg:#05050e;--border:rgba(255,255,255,.07);--dim:#3a3a55;--txt:#e8e8f2;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif}
body{display:flex;flex-direction:column}

/* ═══ HEADER ═══ */
.hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 14px;border-bottom:1px solid var(--border);
  background:rgba(5,5,14,.92);backdrop-filter:blur(20px);flex-shrink:0;z-index:20;height:40px;
}
.logo{width:28px;height:28px;border-radius:7px;
  background:linear-gradient(135deg,#ff3b30,#bf5af2);
  display:flex;align-items:center;justify-content:center;font-size:.8rem;
  box-shadow:0 0 12px rgba(255,59,48,.4);margin-right:7px}
.ttl{font-size:.82rem;font-weight:700}
.sbt{font-size:.52rem;color:var(--dim);margin-top:1px}
.chips{display:flex;align-items:center;gap:6px}
.chip{padding:3px 10px;border-radius:12px;font-size:.62rem;font-weight:600;
  border:1px solid rgba(255,255,255,.15)}
.chip-song{background:rgba(255,110,199,.08);border-color:rgba(255,110,199,.25);color:#ff6ec7}
.chip-bpm{background:rgba(255,59,48,.1);border-color:rgba(255,59,48,.25);color:#ff3b30}
.chip-key{background:rgba(10,132,255,.1);border-color:rgba(10,132,255,.25);color:#0a84ff}

/* ═══ MAIN LAYOUT ═══ */
.main{flex:1;display:grid;grid-template-columns:1fr 260px;overflow:hidden}

/* ═══ LEFT: 频谱 + 多轨 ═══ */
.left{display:flex;flex-direction:column;border-right:1px solid var(--border);overflow:hidden}

/* 实时频谱（紧凑） */
.spec-row{height:140px;flex-shrink:0;position:relative;background:#03030a;border-bottom:1px solid var(--border)}
#spec-cv{width:100%;height:100%;display:block}
.cue{position:absolute;top:6px;left:50%;transform:translateX(-50%);
  padding:5px 14px;border-radius:8px;font-size:.78rem;font-weight:700;
  pointer-events:none;display:flex;align-items:center;gap:6px;
  background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.08);
  color:rgba(255,255,255,.3);white-space:nowrap;backdrop-filter:blur(10px)}

/* ═══ 多轨 DAW 视图（核心改造） ═══ */
.stems-area{flex:1;overflow-y:auto;overflow-x:hidden;background:#020208;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.08) transparent}
.stems-area::-webkit-scrollbar{width:3px}
.stems-area::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}

.stem-row{
  display:flex;align-items:stretch;height:38px;
  border-bottom:1px solid rgba(255,255,255,.04);
  transition:background .1s;
}
.stem-row:hover{background:rgba(255,255,255,.02)}
.stem-row.flash{background:rgba(255,255,255,.06)}

/* 轨道标签（左侧固定） */
.stem-label{
  width:100px;flex-shrink:0;display:flex;align-items:center;gap:4px;
  padding:0 8px;border-right:1px solid rgba(255,255,255,.05);
  background:rgba(5,5,14,.5);
}
.stem-icon{font-size:.75rem;width:16px;text-align:center}
.stem-name{font-size:.58rem;font-weight:600;line-height:1.1;flex:1}
.stem-hz{font-size:.46rem;color:rgba(255,255,255,.2);font-family:monospace}

/* 轨道内容（能量条 + 事件标记） */
.stem-track{flex:1;position:relative;overflow:hidden}
.stem-track canvas{width:100%;height:100%;display:block}

/* ═══ 波形进度条 ═══ */
.wf-row{height:50px;background:#020208;border-top:1px solid var(--border);
  position:relative;flex-shrink:0}
#wf-cv{width:100%;height:100%;display:block;cursor:pointer}
.ph{position:absolute;top:0;bottom:0;width:2px;left:0;
  background:rgba(255,255,255,.9);box-shadow:0 0 8px #fff;pointer-events:none;z-index:5}
.trow{position:absolute;bottom:2px;left:0;right:0;display:flex;justify-content:space-between;
  padding:0 6px;pointer-events:none}
.tlbl{font-size:.55rem;font-family:monospace;color:rgba(255,255,255,.2)}

/* ═══ 控制栏 ═══ */
.ctrl{height:44px;background:rgba(3,3,10,.95);border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 10px;flex-shrink:0}
.cc{display:flex;align-items:center;gap:6px}
.cr{display:flex;align-items:center;gap:6px}
.pbtn{width:36px;height:36px;border-radius:50%;border:none;
  background:linear-gradient(135deg,#ff3b30,#bf5af2);color:#fff;
  font-size:.82rem;cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 16px rgba(255,59,48,.35);transition:all .12s}
.pbtn:hover{transform:scale(1.07)}.pbtn:active{transform:scale(.93)}
.sk{width:26px;height:26px;border-radius:50%;border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.04);color:rgba(255,255,255,.4);
  font-size:.62rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s}
.sk:hover{background:rgba(255,255,255,.1);color:#fff}
.spds{display:flex;gap:2px}
.spd{padding:2px 7px;border-radius:5px;border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.03);color:rgba(255,255,255,.28);
  font-size:.6rem;font-weight:600;cursor:pointer;transition:all .1s}
.spd.on{background:rgba(10,132,255,.15);border-color:#0a84ff;color:#0a84ff}
.vol-w{display:flex;align-items:center;gap:4px;font-size:.58rem;color:var(--dim)}
.vol{-webkit-appearance:none;width:55px;height:3px;border-radius:2px;
  background:rgba(255,255,255,.1);cursor:pointer;outline:none}
.vol::-webkit-slider-thumb{-webkit-appearance:none;width:8px;height:8px;border-radius:50%;background:#fff}
.ctxt{font-size:.65rem;font-family:monospace;color:rgba(255,255,255,.3);width:34px;text-align:center}

/* ═══ RIGHT PANEL ═══ */
.right{display:flex;flex-direction:column;overflow:hidden;background:rgba(3,3,10,.6)}

/* 8拍 */
.beat-sec{padding:8px 10px 6px;border-bottom:1px solid var(--border);flex-shrink:0}
.sec-lbl{font-size:.52rem;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;
  margin-bottom:5px;display:flex;justify-content:space-between}
.barc{font-size:.62rem;color:#ff6ec7;font-weight:700}
.bgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.bx{aspect-ratio:1;border-radius:5px;display:flex;align-items:center;justify-content:center;
  font-size:.7rem;font-weight:800;background:rgba(255,255,255,.03);
  border:1.5px solid rgba(255,255,255,.06);color:rgba(255,255,255,.12);transition:all .06s}
.bx.on{color:#fff;transform:scale(1.1)}
.bx.kick.on{background:rgba(255,59,48,.35);border-color:#ff3b30;box-shadow:0 0 12px rgba(255,59,48,.6)}
.bx.snare.on{background:rgba(255,159,10,.3);border-color:#ff9f0a;box-shadow:0 0 10px rgba(255,159,10,.5)}
.bx.hihat.on{background:rgba(255,214,10,.2);border-color:#ffd60a;box-shadow:0 0 8px rgba(255,214,10,.4)}
.bx.bar1.on{background:rgba(255,110,199,.28);border-color:#ff6ec7;box-shadow:0 0 12px rgba(255,110,199,.55)}

/* 活跃轨道指示器 */
.active-stems{padding:8px 10px;border-bottom:1px solid var(--border);flex-shrink:0}
.as-title{font-size:.52rem;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.as-grid{display:flex;flex-wrap:wrap;gap:4px}
.as-item{
  display:flex;align-items:center;gap:3px;padding:3px 8px;border-radius:6px;
  font-size:.58rem;font-weight:600;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);
  color:rgba(255,255,255,.2);transition:all .08s;
}
.as-item.on{color:#fff}

/* 事件日志 */
.ev-sec{flex:1;overflow-y:auto;padding:6px 8px 8px;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.08) transparent}
.ev-sec::-webkit-scrollbar{width:2px}
.ev-sec::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:1px}
.ev-ttl{font-size:.52rem;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
.ev-item{display:flex;align-items:center;gap:5px;padding:4px 6px;border-radius:6px;
  margin-bottom:2px;opacity:.3;transition:all .2s;border:1px solid transparent}
.ev-item.passed{opacity:.45}
.ev-item.active{opacity:1;background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.1)}
.ev-t{font-size:.55rem;font-family:monospace;color:var(--dim);width:30px;flex-shrink:0}
.ev-i{font-size:.78rem;width:14px;text-align:center}
.ev-tx{font-size:.65rem;flex:1;line-height:1.2}
.ev-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}

/* glow */
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 40% 40% at 20% 55%,rgba(255,45,85,.03),transparent),
    radial-gradient(ellipse 30% 30% at 80% 25%,rgba(10,132,255,.03),transparent)}
</style>
</head>
<body>
<div class="glow"></div>
<audio id="aud" src="songs_audio/watercolor.mp3" preload="auto" crossorigin="anonymous"></audio>

<!-- HEADER -->
<div class="hdr">
  <div style="display:flex;align-items:center">
    <div class="logo">🕺</div>
    <div><div class="ttl">街舞音乐教学 · 多轨分析器</div><div class="sbt">10轨分离 · 每种声音独立可见</div></div>
  </div>
  <div class="chips">
    <div class="chip chip-song" id="chip-song">🎵 Katuchat · Watercolor</div>
    <div class="chip chip-bpm" id="chip-bpm">— BPM</div>
    <div class="chip chip-key" id="chip-key">—</div>
  </div>
</div>

<!-- MAIN -->
<div class="main">
<div class="left">

  <!-- 实时频谱（紧凑版） -->
  <div class="spec-row" id="spec-wrap">
    <canvas id="spec-cv"></canvas>
    <div class="cue" id="cue"><span id="cue-icon">🎯</span><span id="cue-txt">点击 ▶ 开始</span></div>
  </div>

  <!-- ★★★ 多轨 DAW 视图 ★★★ -->
  <div class="stems-area" id="stems-area">
    <!-- JS 动态生成 -->
  </div>

  <!-- 波形进度 -->
  <div class="wf-row">
    <canvas id="wf-cv" onclick="seekClick(event,this)"></canvas>
    <div class="ph" id="ph"></div>
    <div class="trow"><span class="tlbl" id="tc">0:00</span><span class="tlbl" id="tt">3:33</span></div>
  </div>

  <!-- 控制栏 -->
  <div class="ctrl">
    <span class="ctxt" id="ctxt">0:00</span>
    <div class="cc">
      <button class="sk" onclick="skipB(-8)">⏮</button>
      <button class="sk" onclick="skipB(-4)">⏪</button>
      <button class="pbtn" id="pb" onclick="tp()">▶</button>
      <button class="sk" onclick="skipB(4)">⏩</button>
      <button class="sk" onclick="skipB(8)">⏭</button>
    </div>
    <div class="cr">
      <div class="vol-w">🔊<input class="vol" type="range" min="0" max="1" step=".01" value="1" oninput="AUD.volume=+this.value"></div>
      <div class="spds">
        <div class="spd" onclick="ss(.5,this)">½x</div>
        <div class="spd" onclick="ss(.75,this)">¾x</div>
        <div class="spd on" onclick="ss(1,this)">1x</div>
      </div>
    </div>
  </div>
</div><!-- /left -->

<!-- RIGHT -->
<div class="right">
  <div class="beat-sec">
    <div class="sec-lbl">8 BEAT COUNTER <span class="barc">第<span id="bnum">—</span>组</span></div>
    <div class="bgrid" id="bgrid">
      <div class="bx" id="bx0">1</div><div class="bx" id="bx1">2</div>
      <div class="bx" id="bx2">3</div><div class="bx" id="bx3">4</div>
      <div class="bx" id="bx4">5</div><div class="bx" id="bx5">6</div>
      <div class="bx" id="bx6">7</div><div class="bx" id="bx7">8</div>
    </div>
  </div>

  <!-- 活跃轨道指示器 -->
  <div class="active-stems">
    <div class="as-title">当前活跃音效 · ACTIVE STEMS</div>
    <div class="as-grid" id="as-grid"><!-- JS --></div>
  </div>

  <!-- 事件日志 -->
  <div class="ev-sec">
    <div class="ev-ttl">教学事件 · TIMELINE</div>
    <div id="evlist"></div>
  </div>
</div>
</div><!-- /main -->

<script>
// ══════════════════════════════════════════════════════════════
// Web Audio API
// ══════════════════════════════════════════════════════════════
const AUD = document.getElementById('aud');
let actx, analyser, src, freqData, timeData;
const FFT = 4096;
let _ready = false;

function initA(){
  if(_ready)return;
  try{
    actx=new(window.AudioContext||window.webkitAudioContext)();
    analyser=actx.createAnalyser();
    analyser.fftSize=FFT;
    analyser.smoothingTimeConstant=0.72;
    analyser.minDecibels=-95;
    analyser.maxDecibels=-5;
    src=actx.createMediaElementSource(AUD);
    src.connect(analyser);
    analyser.connect(actx.destination);
    freqData=new Uint8Array(analyser.frequencyBinCount);
    timeData=new Uint8Array(FFT);
    _ready=true;
  }catch(e){console.error(e)}
}

// ══════════════════════════════════════════════════════════════
// 数据
// ══════════════════════════════════════════════════════════════
let BEATS=[],BAR_STARTS=[],EVENTS=[],KICK=[],SNARE=[],HIHAT=[];
let STEMS_CFG=[],STEMS={};
let BPM=129.2,TOTAL=213,MSTART=0.05;
const DPR=devicePixelRatio||1;

async function loadJSON(){
  try{
    const d=await(await fetch('beats/watercolor.json')).json();
    BPM=d.bpm||129.2; TOTAL=d.duration||213; MSTART=d.music_start||0.05;
    BEATS=d.beats||[]; BAR_STARTS=d.bar_starts||[];
    KICK=(d.drum_events||{}).kick||[];
    SNARE=(d.drum_events||{}).snare||[];
    HIHAT=(d.drum_events||{}).hihat||[];
    EVENTS=(d.events||[]).filter(e=>e.is_cue!==false).map((e,i)=>({...e,idx:i,el:null}));
    STEMS_CFG=d.stems_config||[];
    STEMS=d.stems||{};
    document.getElementById('chip-bpm').textContent=BPM+' BPM';
    document.getElementById('chip-key').textContent=d.key||'—';
    if(d.artist)document.getElementById('chip-song').textContent=`🎵 ${d.artist} · ${d.song}`;
    document.getElementById('tt').textContent=fmt(TOTAL);
    buildStemRows();
    buildActiveStems();
    buildLog();
    drawStaticWF();
  }catch(e){console.warn('JSON:',e.message);buildLog();}
}

// ══════════════════════════════════════════════════════════════
// ★ 多轨 DAW 视图：每种声音独立一行
// ══════════════════════════════════════════════════════════════
let stemCanvases = [];
let stemRows = [];

function buildStemRows(){
  const area = document.getElementById('stems-area');
  area.innerHTML = '';
  stemCanvases = [];
  stemRows = [];

  STEMS_CFG.forEach((cfg, idx) => {
    const name = cfg.name;
    const data = STEMS[name] || {};
    const row = document.createElement('div');
    row.className = 'stem-row';
    row.id = 'sr-'+idx;

    // 标签
    const label = document.createElement('div');
    label.className = 'stem-label';
    label.innerHTML = `
      <span class="stem-icon">${cfg.icon}</span>
      <div>
        <div class="stem-name" style="color:${cfg.color}">${cfg.label.split('/')[0].split(' ').slice(0,2).join(' ')}</div>
        <div class="stem-hz">${cfg.freq}</div>
      </div>
    `;

    // 轨道画布
    const track = document.createElement('div');
    track.className = 'stem-track';
    const cv = document.createElement('canvas');
    track.appendChild(cv);

    row.appendChild(label);
    row.appendChild(track);
    area.appendChild(row);

    stemCanvases.push({ cv, track, cfg, name, data, idx });
    stemRows.push(row);
  });

  // 初始尺寸
  resizeStems();
}

function resizeStems(){
  stemCanvases.forEach(s => {
    const w = s.track.offsetWidth;
    const h = s.track.offsetHeight;
    s.cv.width = w * DPR;
    s.cv.height = h * DPR;
    s.cv.style.width = w + 'px';
    s.cv.style.height = h + 'px';
    s.w = w; s.h = h;
  });
}

// ── 绘制每条轨道 ──
function drawStems(){
  const ct = AUD.currentTime;
  const dur = AUD.duration || TOTAL;
  if (!dur) return;

  stemCanvases.forEach(s => {
    const ctx = s.cv.getContext('2d');
    const W = s.w * DPR;
    const H = s.h * DPR;
    if (!W || !H) return;

    ctx.clearRect(0,0,W,H);

    const col = s.cfg.color;
    const data = s.data;
    const hits = data.hits || [];
    const curve = data.energy_curve || [];

    // ── 背景能量曲线（半透明填充） ──
    if (curve.length > 0) {
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(0, H);
      for (let i = 0; i < curve.length; i++) {
        const x = (i / curve.length) * W;
        const v = curve[i];
        const y = H - v * H * 0.85;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(W, H);
      ctx.closePath();

      // 渐变填充
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, col + '30');
      grad.addColorStop(1, col + '08');
      ctx.fillStyle = grad;
      ctx.fill();

      // 顶部边线
      ctx.beginPath();
      for (let i = 0; i < curve.length; i++) {
        const x = (i / curve.length) * W;
        const v = curve[i];
        const y = H - v * H * 0.85;
        i === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
      }
      ctx.strokeStyle = col + '55';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();
    }

    // ── 事件竖线（hits） ──
    hits.forEach(t => {
      const x = (t / dur) * W;
      const isCurrent = Math.abs(t - ct) < 0.15;

      ctx.strokeStyle = isCurrent ? col : col + '55';
      ctx.lineWidth = isCurrent ? 2.5 : 1;
      if (isCurrent) {
        ctx.shadowColor = col;
        ctx.shadowBlur = 8;
      }
      ctx.beginPath();
      ctx.moveTo(x, H * 0.1);
      ctx.lineTo(x, H * 0.9);
      ctx.stroke();
      ctx.shadowBlur = 0;

      // 当前事件圆点
      if (isCurrent) {
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.arc(x, H/2, 3.5, 0, Math.PI*2);
        ctx.fill();
      }
    });

    // ── 播放头 ──
    const phX = (ct / dur) * W;
    ctx.strokeStyle = 'rgba(255,255,255,.35)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(phX, 0);
    ctx.lineTo(phX, H);
    ctx.stroke();

    // ── 实时能量条（右侧） ──
    if (_ready && analyser) {
      const SR = actx.sampleRate;
      const binHz = SR / FFT;
      const bins = analyser.frequencyBinCount;
      const loBin = Math.max(0, Math.round(parseInt(s.cfg.freq) / binHz));
      const hiBin = Math.min(bins-1, Math.round(parseInt(s.cfg.freq.split('-')[1]) / binHz));

      let sum = 0, cnt = 0;
      for (let b = loBin; b <= hiBin; b++) {
        sum += freqData[b]; cnt++;
      }
      const energy = cnt > 0 ? sum / (cnt * 255) : 0;

      // 右侧实时能量条
      const barW = 6 * DPR;
      const barH = energy * H * 0.9;
      const bx = W - barW - 2;
      const by = H - barH;

      ctx.fillStyle = col + '99';
      ctx.fillRect(bx, by, barW, barH);

      // 闪光效果
      if (energy > 0.5) {
        s.flashTimer = 6;
      }
    }

    // 行闪光
    if (s.flashTimer && s.flashTimer > 0) {
      stemRows[s.idx].classList.add('flash');
      s.flashTimer--;
    } else {
      stemRows[s.idx].classList.remove('flash');
    }
  });
}

// ── 活跃轨道指示器 ──
function buildActiveStems(){
  const grid = document.getElementById('as-grid');
  grid.innerHTML = '';
  STEMS_CFG.forEach((cfg, i) => {
    const el = document.createElement('div');
    el.className = 'as-item';
    el.id = 'as-'+i;
    el.innerHTML = `${cfg.icon} ${cfg.label.split('/')[0].split(' ').slice(0,2).join(' ')}`;
    el.style.borderColor = cfg.color + '33';
    el.dataset.color = cfg.color;
    grid.appendChild(el);
  });
}

function updateActiveStems(){
  if (!_ready || !analyser) return;
  const SR = actx.sampleRate;
  const binHz = SR / FFT;
  const bins = analyser.frequencyBinCount;

  STEMS_CFG.forEach((cfg, i) => {
    const loBin = Math.max(0, Math.round(parseInt(cfg.freq) / binHz));
    const hiBin = Math.min(bins-1, Math.round(parseInt(cfg.freq.split('-')[1]) / binHz));
    let sum=0,cnt=0;
    for(let b=loBin;b<=hiBin;b++){sum+=freqData[b];cnt++;}
    const e = cnt>0?sum/(cnt*255):0;

    const el = document.getElementById('as-'+i);
    if (!el) return;
    if (e > 0.3) {
      el.classList.add('on');
      el.style.background = cfg.color + '25';
      el.style.borderColor = cfg.color + '88';
      el.style.color = cfg.color;
    } else {
      el.classList.remove('on');
      el.style.background = 'rgba(255,255,255,.03)';
      el.style.borderColor = cfg.color + '15';
      el.style.color = 'rgba(255,255,255,.2)';
    }
  });
}

// ══════════════════════════════════════════════════════════════
// 实时频谱（紧凑版）
// ══════════════════════════════════════════════════════════════
const specCv=document.getElementById('spec-cv');
let SW,SH;

function drawSpec(){
  if(!SW||!SH)return;
  const ctx=specCv.getContext('2d'),W=SW*DPR,H=SH*DPR;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#03030a';ctx.fillRect(0,0,W,H);

  if(!_ready||!analyser){
    ctx.fillStyle='rgba(255,255,255,.02)';
    for(let i=0;i<60;i++){
      const h=(Math.sin(i*.4+Date.now()*.0008)*.3+.35)*H*.25;
      ctx.fillRect(i*(W/60)+1,H-h,W/60-2,h);
    }
    return;
  }

  analyser.getByteFrequencyData(freqData);
  analyser.getByteTimeDomainData(timeData);
  const SR=actx.sampleRate,bins=analyser.frequencyBinCount,binHz=SR/FFT;

  // 频谱柱（100根，紧凑）
  const N=100,gap=1,barW=W/N-gap;
  for(let i=0;i<N;i++){
    const hz=20*Math.pow(1000,i/N);
    const bi=Math.min(Math.round(hz/binHz),bins-1);
    let mx=0;
    for(let d=-2;d<=2;d++){const b=Math.max(0,Math.min(bins-1,bi+d));mx=Math.max(mx,freqData[b]);}
    const v=mx/255,barH=v*H*.88;
    if(barH<.5)continue;
    const x=i*(W/N);

    // 颜色
    let c='#888';
    for(const cfg of STEMS_CFG){
      const lo=parseInt(cfg.freq),hi=parseInt(cfg.freq.split('-')[1]);
      if(hz>=lo&&hz<hi){c=cfg.color;break;}
    }

    if(v>.5){ctx.shadowColor=c;ctx.shadowBlur=v*12;}
    const g=ctx.createLinearGradient(0,H-barH,0,H);
    g.addColorStop(0,c);g.addColorStop(1,c+'44');
    ctx.fillStyle=g;
    ctx.beginPath();
    if(ctx.roundRect)ctx.roundRect(x,H-barH,barW,barH,1.5);
    else ctx.rect(x,H-barH,barW,barH);
    ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle=c+'aa';ctx.fillRect(x,H-barH,barW,1.5);
  }

  // 波形叠加
  ctx.save();ctx.globalAlpha=.4;
  ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1;
  ctx.beginPath();
  const sl=W/timeData.length;
  for(let i=0;i<timeData.length;i++){
    const v=(timeData[i]/128-1)*.25;
    const x=i*sl,y=H/2+v*H*.35;
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }
  ctx.stroke();ctx.restore();
}

// ══════════════════════════════════════════════════════════════
// 静态波形
// ══════════════════════════════════════════════════════════════
const wfCv=document.getElementById('wf-cv');
let WW,WH;

function drawStaticWF(){
  if(!WW)return;
  const ctx=wfCv.getContext('2d'),W=WW*DPR,H=WH*DPR;
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#020208';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,H/2);ctx.lineTo(W,H/2);ctx.stroke();

  // 每轨的 hits 用不同颜色
  STEMS_CFG.forEach(cfg=>{
    const hits=(STEMS[cfg.name]||{}).hits||[];
    ctx.strokeStyle=cfg.color+'44';ctx.lineWidth=.8;
    hits.forEach(t=>{
      const x=(t/TOTAL)*W;
      ctx.beginPath();ctx.moveTo(x,H*.15);ctx.lineTo(x,H*.85);ctx.stroke();
    });
  });

  // 8拍虚线
  ctx.strokeStyle='rgba(255,110,199,.18)';ctx.lineWidth=1;ctx.setLineDash([2,4]);
  BAR_STARTS.forEach(t=>{const x=(t/TOTAL)*W;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();});
  ctx.setLineDash([]);

  // 事件菱形
  EVENTS.forEach(e=>{
    if(!e.is_cue)return;
    const x=(e.time/TOTAL)*W,c=e.color||'#fff';
    ctx.fillStyle=c;ctx.shadowColor=c;ctx.shadowBlur=4;
    ctx.beginPath();ctx.moveTo(x,2);ctx.lineTo(x+3,H/2);ctx.lineTo(x,H-2);ctx.lineTo(x-3,H/2);
    ctx.closePath();ctx.fill();ctx.shadowBlur=0;
  });
}

// ══════════════════════════════════════════════════════════════
// 事件日志
// ══════════════════════════════════════════════════════════════
function buildLog(){
  const l=document.getElementById('evlist');l.innerHTML='';
  EVENTS.forEach((e,i)=>{
    const el=document.createElement('div');el.className='ev-item';el.id='ei'+i;
    el.innerHTML=`<span class="ev-t">${e.time.toFixed(1)}s</span><span class="ev-i">${e.icon||'🎵'}</span><span class="ev-tx">${e.desc||e.label||''}</span><div class="ev-dot" style="background:${e.color||'#888'}"></div>`;
    l.appendChild(el);e.el=el;
  });
}

let lastEv=-1;
function updateCue(){
  const ct=AUD.currentTime;
  let best=null,bd=9999;
  EVENTS.forEach(e=>{const d=ct-e.time;if(d>=0&&d<4&&d<bd){bd=d;best=e;}});
  const cue=document.getElementById('cue');
  if(best){
    cue.style.background=best.color+'30';cue.style.borderColor=best.color+'88';cue.style.color=best.color;
    document.getElementById('cue-icon').textContent=best.icon||'🎵';
    document.getElementById('cue-txt').textContent=best.desc||best.label||'';
    if(best.idx!==lastEv){
      lastEv=best.idx;
      document.querySelectorAll('.ev-item').forEach(el=>{
        el.classList.remove('active');
        if(parseFloat(el.querySelector('.ev-t').textContent)<ct)el.classList.add('passed');
      });
      best.el?.classList.add('active');
      best.el?.scrollIntoView({behavior:'smooth',block:'nearest'});
    }
  }else if(!AUD.paused){
    cue.style.background='rgba(0,0,0,.6)';cue.style.borderColor='rgba(255,255,255,.08)';
    cue.style.color='rgba(255,255,255,.3)';
    document.getElementById('cue-icon').textContent='🎯';
    document.getElementById('cue-txt').textContent=ct<MSTART?'等待音乐...':'感受节拍';
  }
}

// ══════════════════════════════════════════════════════════════
// 8拍
// ══════════════════════════════════════════════════════════════
let curBeat=-1,curBar=-1;
function updateBeat(){
  const ct=AUD.currentTime;
  if(!BEATS.length||ct<MSTART){
    if(curBeat>=0){document.getElementById('bx'+curBeat)?.classList.remove('on','kick','snare','hihat','bar1');curBeat=-1;}
    document.getElementById('bnum').textContent='—';return;
  }
  let lo=0,hi=BEATS.length-1;
  while(lo<=hi){const m=(lo+hi)>>1;BEATS[m]<=ct?lo=m+1:hi=m-1;}
  const bi=hi;if(bi<0)return;
  const nb=bi%8,nbar=Math.floor(bi/8);
  if(nb!==curBeat){
    if(curBeat>=0)document.getElementById('bx'+curBeat)?.classList.remove('on','kick','snare','hihat','bar1');
    curBeat=nb;
    const el=document.getElementById('bx'+curBeat);if(!el)return;
    el.classList.add('on');
    const bt=BEATS[bi];
    if(nb===0)el.classList.add('bar1');
    else if(KICK.some(t=>Math.abs(t-bt)<.1))el.classList.add('kick');
    else if(SNARE.some(t=>Math.abs(t-bt)<.1))el.classList.add('snare');
    else if(HIHAT.some(t=>Math.abs(t-bt)<.1))el.classList.add('hihat');
  }
  if(nbar!==curBar){curBar=nbar;document.getElementById('bnum').textContent=curBar+1;}
}

// ══════════════════════════════════════════════════════════════
// 播放头
// ══════════════════════════════════════════════════════════════
function updateHead(){
  const ct=AUD.currentTime,dur=AUD.duration||TOTAL;
  document.getElementById('ph').style.left=(dur>0?ct/dur*100:0)+'%';
  const f=fmt(ct);
  document.getElementById('tc').textContent=f;
  document.getElementById('ctxt').textContent=f;
}

// ══════════════════════════════════════════════════════════════
// 主循环
// ══════════════════════════════════════════════════════════════
function loop(){
  drawSpec();
  drawStems();
  updateActiveStems();
  updateHead();
  updateBeat();
  updateCue();
  requestAnimationFrame(loop);
}

// ══════════════════════════════════════════════════════════════
// 控制
// ══════════════════════════════════════════════════════════════
let _p=false;
function tp(){_p?pa():pl()}
function pl(){initA();if(actx?.state==='suspended')actx.resume();AUD.play().catch(e=>console.error(e));_p=true;document.getElementById('pb').textContent='⏸';}
function pa(){AUD.pause();_p=false;document.getElementById('pb').textContent='▶';}
AUD.addEventListener('ended',()=>{_p=false;document.getElementById('pb').textContent='▶';});
function skipB(n){const bd=BEATS.length>1?(BEATS[1]-BEATS[0]):(60/BPM);AUD.currentTime=Math.max(0,Math.min(AUD.duration||TOTAL,AUD.currentTime+n*bd));}
function seekClick(e,el){const r=el.getBoundingClientRect();AUD.currentTime=((e.clientX-r.left)/r.width)*(AUD.duration||TOTAL);}
function ss(v,btn){AUD.playbackRate=v;document.querySelectorAll('.spd').forEach(b=>b.classList.remove('on'));btn.classList.add('on');}
function fmt(s){if(!isFinite(s))return'0:00';return Math.floor(s/60)+':'+(Math.floor(s%60)+'').padStart(2,'0');}
AUD.addEventListener('loadedmetadata',()=>{TOTAL=AUD.duration;document.getElementById('tt').textContent=fmt(AUD.duration);});

// ══════════════════════════════════════════════════════════════
// 尺寸
// ══════════════════════════════════════════════════════════════
function resize(){
  const sw=document.getElementById('spec-wrap');
  SW=sw.offsetWidth;SH=sw.offsetHeight;
  specCv.width=SW*DPR;specCv.height=SH*DPR;
  specCv.style.width=SW+'px';specCv.style.height=SH+'px';

  WW=wfCv.offsetWidth;WH=wfCv.offsetHeight;
  wfCv.width=WW*DPR;wfCv.height=WH*DPR;
  wfCv.style.width=WW+'px';wfCv.style.height=WH+'px';

  resizeStems();
  drawStaticWF();
}
window.addEventListener('resize',resize);

// ══════════════════════════════════════════════════════════════
// 初始化
// ══════════════════════════════════════════════════════════════
window.addEventListener('load',async()=>{
  resize();
  await loadJSON();
  loop();
});
</script>
