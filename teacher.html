<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rhythm Scope · AI 多轨观察台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
:root{
  --bg:#06070b;
  --bg-elev:#0b0d12;
  --bg-panel:rgba(12,14,20,.78);
  --bg-panel-strong:rgba(14,16,24,.92);
  --bg-soft:rgba(255,255,255,.035);
  --bg-softer:rgba(255,255,255,.02);
  --border:rgba(255,255,255,.075);
  --border-strong:rgba(255,255,255,.12);
  --dim:#68707f;
  --txt:#edf1f7;
  --txt-soft:rgba(237,241,247,.72);
  --txt-faint:rgba(237,241,247,.42);
  --shadow-soft:0 10px 30px rgba(0,0,0,.22);
  --shadow-float:0 18px 45px rgba(0,0,0,.28);
}
html,body{height:100%;overflow:hidden;background:radial-gradient(circle at top left,rgba(255,255,255,.03),transparent 28%),linear-gradient(180deg,#090b10 0%,#06070b 48%,#040509 100%);color:var(--txt);
  font-family:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif}
body{display:flex;flex-direction:column}

/* ═══ 全屏 HIT 闪光叠层 ═══ */
.hit-flash{position:fixed;inset:0;z-index:100;pointer-events:none;opacity:0}
.hit-flash.fire{animation:hitPulse .3s ease-out forwards}
@keyframes hitPulse{0%{opacity:1}100%{opacity:0}}
.edge-glow{position:fixed;inset:0;z-index:99;pointer-events:none;opacity:0}
.edge-glow.fire{animation:edgeFade .45s ease-out forwards}
@keyframes edgeFade{0%{opacity:1}100%{opacity:0}}

/* ═══ 时间线横幅通知 ═══ */
.banner-layer{position:absolute;inset:0;pointer-events:none;z-index:10;overflow:hidden}
.banner{
  position:absolute;left:130px;right:0;
  display:flex;align-items:center;gap:8px;
  padding:0 14px;height:100%;
  border-left:1px solid rgba(255,255,255,.08);
  background:linear-gradient(90deg,rgba(255,255,255,.035),rgba(255,255,255,.015));
  opacity:0;pointer-events:none;
}
.banner.show{animation:bannerFly .46s cubic-bezier(.22,1,.36,1) forwards}
.banner.hide{animation:bannerFade .24s ease-in forwards}
@keyframes bannerFly{
  0%{opacity:0;transform:translateX(-26px)}
  100%{opacity:1;transform:translateX(0)}
}
@keyframes bannerFade{
  0%{opacity:1}100%{opacity:0;transform:translateX(10px)}
}
.banner-icon{font-size:1.02rem;flex-shrink:0;opacity:.92}
.banner-text{font-size:.74rem;font-weight:700;white-space:nowrap;letter-spacing:.08px}
.banner-sub{font-size:.52rem;opacity:.56;margin-left:4px;white-space:nowrap}

/* 浮动气泡（重大事件专用） */
.bubble-layer{position:absolute;left:130px;right:0;top:0;bottom:0;pointer-events:none;z-index:15;overflow:hidden}
.bubble{
  position:absolute;
  display:flex;align-items:center;gap:6px;
  padding:5px 12px 5px 8px;border-radius:999px;
  font-size:.72rem;font-weight:700;white-space:nowrap;
  border:1px solid rgba(255,255,255,.13);
  background:linear-gradient(180deg,rgba(24,28,38,.82),rgba(18,21,30,.72));
  box-shadow:0 14px 30px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.05);
  backdrop-filter:blur(12px) saturate(118%);
  opacity:0;
}
.bubble.pop{animation:bubblePop .52s cubic-bezier(.22,1,.36,1) forwards}
.bubble.fade{animation:bubbleFade .24s ease-in forwards}
@keyframes bubblePop{
  0%{opacity:0;transform:translateY(8px) scale(.94)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes bubbleFade{
  0%{opacity:1}100%{opacity:0;transform:translateY(-5px) scale(.985)}
}

/* ═══ 选歌抽屉 ═══ */
.song-drawer{
  position:fixed;inset:0;z-index:200;
  background:rgba(4,6,10,.58);backdrop-filter:blur(18px) saturate(125%);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .22s ease}
.song-drawer.open{opacity:1;pointer-events:auto}
.song-box{
  width:400px;max-height:70vh;overflow-y:auto;
  background:linear-gradient(180deg,rgba(18,20,28,.96),rgba(11,13,20,.96));border:1px solid rgba(255,255,255,.1);
  box-shadow:var(--shadow-float);border-radius:20px;padding:20px;
  transform:translateY(20px) scale(.985);transition:transform .22s ease, box-shadow .22s ease}
.song-drawer.open .song-box{transform:translateY(0) scale(1)}
.song-box-title{font-size:.78rem;font-weight:800;letter-spacing:.18px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;text-transform:uppercase;color:rgba(237,241,247,.84)}
.song-close{cursor:pointer;font-size:.76rem;color:var(--dim);padding:5px 10px;border-radius:999px;
  border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);transition:.12s}
.song-close:hover{color:#fff;border-color:rgba(255,255,255,.2)}
.song-item{
  display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;
  cursor:pointer;border:1px solid transparent;transition:all .14s ease;margin-bottom:6px}
.song-item:hover{background:rgba(255,255,255,.045);border-color:rgba(255,255,255,.08);transform:translateY(-1px)}
.song-item.active{background:rgba(212,162,255,.08);border-color:rgba(212,162,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.song-art{width:40px;height:40px;border-radius:12px;
  background:linear-gradient(135deg,#f48a6c,#9f8dff);
  display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800;letter-spacing:.3px;color:#fff;flex-shrink:0}
.song-info .song-name{font-size:.74rem;font-weight:700;letter-spacing:.08px}
.song-info .song-meta{font-size:.56rem;color:var(--dim);margin-top:3px}
.song-play-btn{margin-left:auto;padding:5px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.05);font-size:.54rem;font-weight:700;cursor:pointer;color:rgba(237,241,247,.46);letter-spacing:.1px}
.song-item.active .song-play-btn{background:rgba(212,162,255,.1);border-color:rgba(212,162,255,.28);color:#d4a2ff}

/* ═══ HUD 顶栏 ═══ */
.hud{
  display:flex;align-items:stretch;justify-content:space-between;
  background:linear-gradient(180deg,rgba(17,19,26,.82),rgba(10,12,18,.76));backdrop-filter:blur(22px) saturate(125%);
  border-bottom:1px solid rgba(255,255,255,.06);box-shadow:0 10px 28px rgba(0,0,0,.18);flex-shrink:0;z-index:20;height:68px;
}
/* HUD 右侧工具区 */
.hud-right{
  width:250px;display:flex;flex-direction:column;align-items:stretch;justify-content:center;
  padding:0 16px;border-left:1px solid rgba(255,255,255,.055);flex-shrink:0;gap:10px
}
.hud-switch{
  display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;
  cursor:pointer;border:1px solid rgba(255,255,255,.07);
  background:rgba(255,255,255,.03);transition:.15s;user-select:none;align-self:flex-end
}
.hud-switch:hover{border-color:rgba(255,255,255,.15);background:rgba(255,255,255,.06)}
.hud-switch.on{border-color:rgba(247,215,116,.28);background:rgba(247,215,116,.08)}
.hud-switch-icon{font-size:.85rem}
.hud-switch-label{font-size:.48rem;color:rgba(255,255,255,.4);font-weight:600;letter-spacing:.5px}
.hud-switch.on .hud-switch-label{color:#f7d774}
.hud-switch-dot{
  width:22px;height:12px;border-radius:6px;background:rgba(255,255,255,.12);
  position:relative;transition:.2s;flex-shrink:0
}
.hud-switch-dot::after{
  content:'';position:absolute;width:8px;height:8px;border-radius:50%;
  background:rgba(255,255,255,.35);top:2px;left:2px;transition:.2s
}
.hud-switch.on .hud-switch-dot{background:rgba(247,215,116,.26)}
.hud-switch.on .hud-switch-dot::after{background:#f7d774;left:12px;box-shadow:0 0 4px rgba(247,215,116,.5)}

/* 节奏信息卡 */
.rhythm-panel{
  width:auto;display:flex;flex-direction:column;justify-content:center;gap:6px;
  margin-top:2px;padding:6px 0 0 0;min-width:0;max-width:none;height:auto;min-height:0;
  background:none;border:none;border-top:1px solid rgba(255,255,255,.06);border-radius:0;box-shadow:none
}
.rhythm-title{display:none}
.rhythm-summary{font-size:.54rem;color:#f7d774;font-weight:700;line-height:1.35;margin-bottom:4px;padding-left:46px;text-align:left;width:376px}
.rhythm-details{display:none} /* 彻底废弃旧文本条 */
.rhythm-grid{display:none} /* 废弃旧单行点阵 */
.rhythm-beat{
  width:12px;height:17px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:.35rem;color:rgba(255,255,255,.2);line-height:1
}
.rhythm-beat-num{font-size:.3rem;color:rgba(255,255,255,.14)}
.rhythm-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.06)}
.rhythm-dot.kick{background:#ff3b30}
.rhythm-dot.snare{background:#ff9f0a}
/* 节奏音序器矩阵 */
.seq-matrix{display:flex;flex-direction:column;gap:5px;margin-top:0}
.seq-row{display:grid;grid-template-columns:40px repeat(8,36px);column-gap:6px;align-items:center}
.seq-label{font-size:.42rem;color:rgba(237,241,247,.58);font-weight:800;text-align:right;letter-spacing:0;padding-right:4px}
.seq-step{width:36px;height:20px;border-radius:5px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.04)}
.seq-step.active.kick{background:rgba(241,123,98,.85);border-color:#f17b62;box-shadow:0 0 6px rgba(241,123,98,.3)}
.seq-step.active.snare{background:rgba(165,144,255,.85);border-color:#a590ff;box-shadow:0 0 6px rgba(165,144,255,.3)}
.seq-step.active.hihat{background:rgba(237,241,247,.5);border-color:rgba(237,241,247,.7);box-shadow:0 0 4px rgba(237,241,247,.2)}
.seq-step.active.vocal{background:rgba(48,209,88,.85);border-color:#30d158;box-shadow:0 0 6px rgba(48,209,88,.3)}
.seq-step.active.synth{background:rgba(167,139,250,.85);border-color:#a78bfa;box-shadow:0 0 6px rgba(167,139,250,.3)}
.seq-step.weak{opacity:.4}
.seq-nums{display:none}
.seq-num{display:none}

.stem-hdr{cursor:default}

.hud-info{width:214px;display:flex;flex-direction:column;justify-content:center;
  padding:0 14px 0 16px;border-right:1px solid rgba(255,255,255,.055);flex-shrink:0;gap:6px}
.hud-song-row{display:flex;align-items:center;gap:9px}
.hud-logo{width:28px;height:28px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(135deg,#fc6f57,#b382ff);
  display:flex;align-items:center;justify-content:center;font-size:.64rem;font-weight:800;letter-spacing:.22px;
  box-shadow:0 8px 18px rgba(252,111,87,.22)}
.hud-song-name{font-size:.73rem;font-weight:800;letter-spacing:.32px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:116px}
.song-btn{margin-left:auto;padding:4px 10px;border-radius:999px;font-size:.47rem;font-weight:700;letter-spacing:.18px;
  border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.035);
  color:rgba(237,241,247,.48);cursor:pointer;transition:.14s;flex-shrink:0}
.song-btn:hover{color:#fff;border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.07)}
.hud-meta{display:flex;gap:6px;flex-wrap:wrap}
.hud-chip{padding:2px 6px;border-radius:999px;font-size:.52rem;font-weight:700;
  border:1px solid rgba(255,255,255,.08)}
.hud-chip-b{background:rgba(255,140,95,.08);border-color:rgba(255,140,95,.16);color:#ff9b6f}
.hud-chip-k{background:rgba(120,173,255,.08);border-color:rgba(120,173,255,.16);color:#84b5ff}
.hud-chip-g{background:rgba(212,162,255,.08);border-color:rgba(212,162,255,.16);color:#d4a2ff}

.hud-center{display:none}

.workbench{
  display:flex;align-items:flex-start;justify-content:center;gap:18px;
  padding:12px 20px 14px;flex-shrink:0;
  background:linear-gradient(180deg,rgba(11,13,19,.96),rgba(8,10,15,.92));
  border-bottom:1px solid rgba(255,255,255,.05);
  box-shadow:0 12px 28px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.03)
}
.workbench .beat-panel{
  width:auto;max-width:none;margin:0;
  padding:14px 18px 12px;border-radius:18px;
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.018));
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 16px 36px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.04)
}
.workbench .rhythm-panel{
  margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.06)
}

/* 8 BEAT + and 拍内嵌 */
.workbench{
  background:linear-gradient(180deg,rgba(15,17,24,.9),rgba(11,13,19,.95));
  border-bottom:1px solid rgba(255,255,255,.05);
  box-shadow:0 12px 30px rgba(0,0,0,.2);
  flex-shrink:0;z-index:19;position:relative;
  display:flex;justify-content:center;padding:16px 0;
}
.beat-panel{width:100%;max-width:800px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:8px;flex-shrink:0;padding:12px 20px;}
.beat-title{width:auto;font-size:.46rem;color:rgba(237,241,247,.48);text-transform:uppercase;letter-spacing:1.42px;
  display:flex;align-items:center;justify-content:center;gap:12px;padding-left:0;margin-bottom:2px}
.bar-num{color:#d7b768;font-weight:700;font-size:.51rem}
.bgrid{display:grid;grid-template-columns:repeat(8,36px);gap:6px;width:auto;margin-left:0;}
/* bx 内部分上下两层：数字区 + 子拍条 */
.bx{
  width:36px;height:44px;border-radius:9px;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.018));
  border:1px solid rgba(255,255,255,.065);transition:all .14s cubic-bezier(.22,1,.36,1);
  overflow:hidden;position:relative;cursor:default;gap:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.035)}
.bx-num{
  flex:1;display:flex;align-items:center;justify-content:center;
  font-size:.82rem;font-weight:800;color:rgba(237,241,247,.18);transition:color .1s ease;
  line-height:1;padding-top:2px}
/* and拍条区（默认隐藏，开启后展开） */
.bx-subs{width:100%;display:none;grid-template-columns:repeat(4,1fr);gap:0;height:10px;flex-shrink:0}
.bx-subs.visible{display:grid}
.bx-sub{height:10px;transition:background .05s,box-shadow .05s;
  background:rgba(255,255,255,.07)}
/* 重要：激活状态 */
.bx-sub.s0.lit{background:#ff3b30;box-shadow:0 0 6px #ff3b30}
.bx-sub.s1.lit{background:#ff9f0a;box-shadow:0 0 6px #ff9f0a}
.bx-sub.s2.lit{background:#30d158;box-shadow:0 0 6px #30d158}
.bx-sub.s3.lit{background:#bf5af2;box-shadow:0 0 6px #bf5af2}

.bx.on .bx-num{color:#fff}
.bx.kick.on{border-color:#ff3b30;box-shadow:0 0 14px rgba(255,59,48,.6);background:rgba(255,59,48,.3)}
.bx.snare.on{border-color:#ff9f0a;box-shadow:0 0 10px rgba(255,159,10,.5);background:rgba(255,159,10,.25)}
.bx.hihat.on{border-color:#ffd60a;box-shadow:0 0 8px rgba(255,214,10,.4);background:rgba(255,214,10,.15)}
.bx.bar1.on{border-color:#ff6ec7;box-shadow:0 0 14px rgba(255,110,199,.6);background:rgba(255,110,199,.3)}
.beat-mode-btn{font-size:.44rem;cursor:pointer;color:var(--dim);padding:1px 5px;border-radius:4px;
  border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.03);transition:.1s;margin-left:3px}
.beat-mode-btn:hover{color:#fff;border-color:rgba(255,255,255,.15)}
.beat-mode-btn.active{color:#d4a2ff;border-color:rgba(212,162,255,.35);background:rgba(212,162,255,.1)}

/* 焦点提示卡 */
.cue-panel{
  flex:0 1 auto;max-width:none;width:100%;padding:11px 18px;border-radius:18px;
  background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.035));border:1px solid rgba(255,255,255,.08);
  box-shadow:0 14px 38px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.055);
  backdrop-filter:blur(16px) saturate(120%);
  display:flex;align-items:center;gap:12px;transition:transform .22s cubic-bezier(.22,1,.36,1), box-shadow .22s ease, border-color .22s ease, background .22s ease;min-width:0
}
.cue-icon{font-size:1rem;flex-shrink:0;opacity:.86}
.cue-text{font-size:.84rem;font-weight:800;line-height:1.18;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.15px}
.cue-sub{font-size:.52rem;color:rgba(237,241,247,.44);margin-top:3px;font-weight:500}

/* 舞种卡 - 隐藏 */
.dance-panel{display:none!important}

/* ═══ HIT 指示器条 ═══ */
.hit-bar{height:3px;display:flex;flex-shrink:0;background:rgba(0,0,0,.6)}
.hit-seg{flex:1;opacity:0}
.hit-seg.active{animation:hitSegPulse .35s ease-out forwards}
@keyframes hitSegPulse{0%{opacity:1}60%{opacity:.7}100%{opacity:0}}

/* ═══ Stem 混音控制条 ═══ */
.mixer{display:flex;align-items:center;gap:4px;padding:5px 8px;flex-wrap:wrap;
  border-bottom:1px solid rgba(255,255,255,.05);flex-shrink:0;background:linear-gradient(180deg,rgba(11,13,18,.88),rgba(8,10,15,.92))}
.mx-btn{
  padding:3px 7px;border-radius:999px;font-size:.5rem;font-weight:700;cursor:pointer;
  border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);
  color:rgba(237,241,247,.48);transition:all .14s ease;display:flex;align-items:center;gap:4px;
  user-select:none;white-space:nowrap;letter-spacing:.08px}
.mx-btn.on{color:#f5f7fb;background:rgba(255,255,255,.055)}
.mx-btn.muted{opacity:.28;text-decoration:line-through}
.mx-btn.solo{border-color:rgba(247,215,116,.34);color:#f7d774;background:rgba(247,215,116,.1);
  box-shadow:0 6px 18px rgba(247,215,116,.12)}
.mx-tool{font-size:.48rem;padding:3px 7px;background:rgba(255,255,255,.025)}
.mx-sep{font-size:.4rem;color:rgba(255,255,255,.12);user-select:none;margin:0 2px}
.mx-name{max-width:52px;overflow:hidden;text-overflow:ellipsis}
.mx-label{font-size:.48rem;color:rgba(237,241,247,.38);font-weight:700}
.mx-analysis{opacity:.78;border-style:dashed;background:rgba(255,255,255,.025);cursor:default}
.mx-analysis.on{color:rgba(237,241,247,.58)}
.mx-analysis .mx-tag{font-size:.4rem;padding:1px 4px;border-radius:999px;background:rgba(255,255,255,.07);color:rgba(237,241,247,.36)}
.mx-label{display:inline-flex;align-items:center;gap:4px}
.mx-helper{
  padding:3px 8px;border-radius:999px;font-size:.46rem;font-weight:700;
  border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:rgba(237,241,247,.42)
}
.mx-helper.train{color:#8edfb1;border-color:rgba(142,223,177,.2);background:rgba(142,223,177,.06)}
.mx-helper.analysis{color:rgba(237,241,247,.5);border-style:dashed}
.mix-guide{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px 9px 12px;
  border-bottom:1px solid rgba(255,255,255,.045);background:linear-gradient(180deg,rgba(255,255,255,.024),rgba(255,255,255,.014))
}
.mix-guide-title{font-size:.48rem;font-weight:800;color:rgba(237,241,247,.74);letter-spacing:.28px;text-transform:uppercase}
.mix-guide-note{font-size:.46rem;color:rgba(237,241,247,.32);letter-spacing:.04px}
.mix-guide-badge{
  padding:2px 8px;border-radius:999px;font-size:.44rem;font-weight:700;border:1px solid rgba(255,255,255,.08)
}
.mix-guide-badge.train{color:#8edfb1;border-color:rgba(142,223,177,.22);background:rgba(142,223,177,.055)}
.mix-guide-badge.analysis{color:rgba(237,241,247,.52);border-style:dashed;background:rgba(255,255,255,.025)}
.tr-role{margin-top:2px;font-size:.4rem;font-weight:700;letter-spacing:.24px}
.tr-role.role-train{color:#8edfb1}
.tr-role.role-analysis{color:rgba(237,241,247,.28)}
.tr.analysis-track{opacity:.84}
.tr.analysis-track .tr-label{background:rgba(10,12,18,.62)}
.tr.analysis-track .tr-cv canvas{filter:grayscale(.12) opacity(.8)}
.tr.train-track .tr-label{box-shadow:inset 2px 0 0 rgba(142,223,177,.16)}
.role-divider{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:9px 12px;border-top:1px solid rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.04);
  background:linear-gradient(90deg,rgba(255,255,255,.028),rgba(255,255,255,.012));position:sticky;top:0;z-index:6;backdrop-filter:blur(10px)
}
.role-divider-main{display:flex;align-items:center;gap:8px}
.role-divider-title{font-size:.56rem;font-weight:800;letter-spacing:.42px;text-transform:uppercase}
.role-divider-sub{font-size:.45rem;color:rgba(237,241,247,.34);letter-spacing:.04px}
.role-divider.train .role-divider-title{color:#8edfb1}
.role-divider.analysis .role-divider-title{color:rgba(237,241,247,.58)}
.role-divider-chip{
  padding:2px 8px;border-radius:999px;font-size:.44rem;font-weight:700;border:1px solid rgba(255,255,255,.08)
}
.role-divider.train .role-divider-chip{color:#8edfb1;border-color:rgba(142,223,177,.22);background:rgba(142,223,177,.055)}
.role-divider.analysis .role-divider-chip{color:rgba(237,241,247,.5);border-style:dashed;background:rgba(255,255,255,.025)}
.tr.train-track{cursor:pointer}
.tr.train-track:hover .tr-label{background:rgba(22,29,25,.78)}
.tr.train-track.active-audio .tr-label{background:rgba(26,43,34,.84);box-shadow:inset 0 0 0 1px rgba(142,223,177,.18), inset 2px 0 0 rgba(142,223,177,.55)}
.tr.train-track.muted-audio .tr-label{background:rgba(36,21,21,.62);box-shadow:inset 2px 0 0 rgba(255,136,136,.24)}
.tr-click-tip{margin-left:6px;font-size:.4rem;color:rgba(237,241,247,.22)}
.cue-panel.urgent{box-shadow:0 18px 40px rgba(0,0,0,.26),0 0 0 1px rgba(255,255,255,.12),0 0 36px rgba(255,255,255,.08);transform:translateY(-2px) scale(1.01)}
.segment-banner.urgent{box-shadow:0 16px 44px rgba(0,0,0,.28),0 0 0 1px rgba(255,255,255,.16),0 0 34px rgba(255,255,255,.08)}
.rhythm-double{margin-top:7px;padding-top:7px;border-top:1px dashed rgba(255,255,255,.07);display:flex;flex-direction:column;gap:4px}
.rhythm-double-title{font-size:.46rem;color:rgba(237,241,247,.34);font-weight:700;letter-spacing:.22px}
.rhythm-double-row{font-size:.47rem;line-height:1.5;color:rgba(237,241,247,.6)}
.rhythm-strong{color:#fff;font-weight:700}

/* ═══ 多轨 DAW ═══ */
.daw-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.daw{flex:1;overflow-y:auto;overflow-x:hidden;background:linear-gradient(180deg,#07090e 0%,#05070c 100%);
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.06) transparent;position:relative}
.daw::-webkit-scrollbar{width:3px}
.daw::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px}

/* ═══ 轨道 Hit 粒子叠加层 ═══ */
.tr-ripple-canvas{
  position:absolute;left:130px;right:0;top:0;bottom:0;
  pointer-events:none;z-index:6;width:calc(100% - 130px);height:100%
}

/* Stem 分组标题 */
.stem-hdr{
  display:flex;align-items:center;gap:6px;padding:4px 10px;
  background:linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,.018));border-bottom:1px solid rgba(255,255,255,.04);
  position:sticky;top:0;z-index:5;backdrop-filter:blur(8px)}
.stem-hdr-icon{font-size:.68rem;opacity:.85}
.stem-hdr-name{font-size:.52rem;font-weight:800;text-transform:uppercase;letter-spacing:.9px}

/* 单轨道行 */
.tr{display:flex;align-items:stretch;height:32px;border-bottom:1px solid rgba(255,255,255,.028);
  transition:background .14s ease;position:relative;overflow:hidden}
.tr.sub-track{padding-left:14px}
.tr.sub-track .tr-label{border-left:2px solid rgba(255,255,255,.05);margin-left:0;padding-left:4px}
.tr:hover{background:rgba(255,255,255,.012)}
.tr.flash{background:rgba(255,255,255,.04)}
.tr.hit-glow{animation:trackHit .4s ease-out}
@keyframes trackHit{0%{background:rgba(255,255,255,.1)}100%{background:transparent}}

/* 轨道标签 */
.tr-label{width:128px;flex-shrink:0;display:flex;align-items:center;gap:6px;
  padding:0 8px 0 10px;border-right:1px solid rgba(255,255,255,.045);background:linear-gradient(180deg,rgba(14,16,23,.82),rgba(10,12,18,.74));
  z-index:3}
.tr-icon{font-size:.76rem;width:15px;text-align:center;flex-shrink:0;opacity:.86}
.tr-name{font-size:.58rem;font-weight:800;line-height:1.2;white-space:nowrap;letter-spacing:.12px}
.tr-hz{font-size:.4rem;color:rgba(255,255,255,.28);font-family:'SF Mono',monospace}

.tr-cv{flex:1;position:relative;overflow:hidden}
.tr-cv canvas{width:100%;height:100%;display:block}

/* 气泡叠加层（每行独立） */
.tr-overlay{position:absolute;left:120px;right:0;top:0;bottom:0;pointer-events:none;z-index:8;overflow:hidden}
.tr-bubble{
  position:absolute;top:50%;transform:translateY(-50%);
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 11px 4px 8px;border-radius:999px;
  font-size:.64rem;font-weight:700;white-space:nowrap;
  border:1px solid rgba(255,255,255,.14);
  background:linear-gradient(180deg,rgba(24,28,38,.76),rgba(18,21,30,.68));backdrop-filter:blur(14px) saturate(120%);
  box-shadow:0 14px 28px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.05);
  opacity:0;pointer-events:none;left:8px;
}
.tr-bubble.pop{animation:trBubblePop .58s cubic-bezier(.22,1,.36,1) forwards}
.tr-bubble.dismiss{animation:trBubbleDismiss .34s ease-in forwards}
@keyframes trBubblePop{
  0%{opacity:0;transform:translateY(calc(-50% + 7px)) scale(.94)}
  100%{opacity:1;transform:translateY(-50%) scale(1)}
}
@keyframes trBubbleDismiss{
  0%{opacity:1;transform:translateY(-50%) scale(1)}
  100%{opacity:0;transform:translateY(calc(-50% - 6px)) scale(.98)}
}

/* 大横幅（段落切换） */
.segment-banner{
  position:fixed;top:86px;right:22px;
  padding:11px 18px;border-radius:18px;
  font-size:.88rem;font-weight:800;letter-spacing:.08px;
  border:1px solid rgba(255,255,255,.13);
  background:linear-gradient(180deg,rgba(26,29,38,.8),rgba(18,21,30,.72));backdrop-filter:blur(18px) saturate(125%);
  box-shadow:0 18px 40px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.05);
  z-index:50;pointer-events:none;
  opacity:0;white-space:normal;max-width:220px;line-height:1.32;text-align:left;
}
.segment-banner.show{animation:segBannerShow .46s cubic-bezier(.22,1,.36,1) forwards}
.segment-banner.hide{animation:segBannerHide .28s ease-in forwards}
@keyframes segBannerShow{
  0%{opacity:0;transform:translateY(-10px) scale(.97)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes segBannerHide{
  0%{opacity:1;transform:translateY(0) scale(1)}
  100%{opacity:0;transform:translateY(-6px) scale(.985)}
}

.ctrl{height:36px;background:linear-gradient(180deg,rgba(9,11,16,.94),rgba(7,9,14,.98));border-top:1px solid rgba(255,255,255,.055);

.cc{display:flex;align-items:center;gap:5px}
.cr{display:flex;align-items:center;gap:5px}
.pbtn{width:30px;height:30px;border-radius:50%;border:none;
  background:linear-gradient(135deg,#e9876d,#a590ff);color:#fff;

  box-shadow:0 8px 18px rgba(233,135,109,.2);transition:all .16s ease}

.sk{width:21px;height:21px;border-radius:50%;border:1px solid rgba(255,255,255,.08);

  font-size:.5rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.12s}
.sk:hover{background:rgba(255,255,255,.08);color:#fff}
.spds{display:flex;gap:3px}
.spd{padding:2px 7px;border-radius:999px;border:1px solid rgba(255,255,255,.06);
  background:rgba(255,255,255,.02);color:rgba(237,241,247,.24);font-size:.46rem;font-weight:700;cursor:pointer;letter-spacing:.12px}
.spd.on{background:rgba(132,181,255,.12);border-color:rgba(132,181,255,.32);color:#84b5ff}
.vol-w{display:flex;align-items:center;gap:4px;font-size:.48rem;color:var(--dim);letter-spacing:.1px}
.vol{appearance:none;-webkit-appearance:none;width:48px;height:2px;border-radius:1px;background:rgba(255,255,255,.08);cursor:pointer;outline:none}
.vol::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:7px;height:7px;border-radius:50%;background:#fff}
.ctxt{font-size:.53rem;font-family:monospace;color:rgba(255,255,255,.24);width:30px;text-align:center}

.glow{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 40% 34% at 14% 12%,rgba(255,170,125,.04),transparent 58%),
    radial-gradient(ellipse 30% 28% at 82% 18%,rgba(142,174,255,.04),transparent 60%),
    radial-gradient(ellipse 32% 30% at 50% 100%,rgba(255,255,255,.025),transparent 65%)}
</style>
</head>

<script>
// ══════════════════════════════════════════════════════════════
// Audio
// ══════════════════════════════════════════════════════════════
const AUD = document.getElementById('aud');
const STEM_AUDS = {
  drums:  document.getElementById('aud-drums'),
  bass:   document.getElementById('aud-bass'),
  guitar: document.getElementById('aud-guitar'),
  piano:  document.getElementById('aud-piano'),
  vocals: document.getElementById('aud-vocals'),
  other:  document.getElementById('aud-other'),
  kick:     document.getElementById('aud-kick'),
  snare:    document.getElementById('aud-snare'),
  toms:     document.getElementById('aud-toms'),
  hh:       document.getElementById('aud-hh'),
  cymbals:  document.getElementById('aud-cymbals'),
};
const stemMuted = {drums:false,bass:false,guitar:false,piano:false,vocals:false,other:false,kick:false,snare:false,toms:false,hh:false,cymbals:false};
// 按轨道 mute（映射到 stem 级别的实际 mute）
const trackMuted = {};
let actx,stemAnalysers={},stemSrcs={};
const FFT=4096;
let _ready=false;
const DPR=devicePixelRatio||1;

// ── 双架构音频路由 ──
// DrumSep 型（kick/snare/toms/hh/cymbals）：独立 <audio>，独立 GainNode，可单独 mute
// Full 独立型（guitar/piano）：独立 <audio>，独立 GainNode，可单独 mute
// Band 型（bass_sub/bass_mid, vocal_lo/mid/hi, other_low/synth/fx）：
//   共享父 stem 完整音频输出（不做频段切割，切割会丢失音频内容）
//   mute 控制父 stem audio.muted；同 stem 内所有子轨同进退
let trackGains = {};    // trackName → GainNode（每轨专属）
let trackFilters = {};  // 保留空对象，兼容诊断代码

// 判断轨道是否有独立 <audio> 元素（DrumSep 型 + guitar/piano）
function isIndepAudio(tc){
  return !!(STEM_AUDS[tc.stem] && tc.stem === tc.name);
}

// 获取 band 型轨道对应的父 stem 名称
function parentStem(tc){
  return tc.stem; // bass_sub → 'bass', vocal_lo → 'vocals', etc.
}

// 主监听 / 辅助线索 分层
const TRAINING_TRACK_NAMES = new Set(['kick','snare','toms','hh','cymbals','bass_mid','vocal_mid']);
function isTrainingTrack(tcOrName){
  const name = typeof tcOrName === 'string' ? tcOrName : tcOrName?.name;
  return TRAINING_TRACK_NAMES.has(name);
}
function isAnalysisTrack(tcOrName){
  return !isTrainingTrack(tcOrName);
}
function getTrainingTracks(){
  return TRACKS_CFG.filter(tc => isTrainingTrack(tc));
}
function getAnalysisTracks(){
  return TRACKS_CFG.filter(tc => isAnalysisTrack(tc));
}
function getTrackRoleLabel(tc){
  return isTrainingTrack(tc) ? 'Main Focus' : 'Aux Guide';
}
function getDisplayTrackName(tc){
  const labelMap = {
    bass_mid: 'Bass 贝斯',
    vocal_mid: 'Vocals 人声',
  };
  return labelMap[tc.name] || tc.label;
}
function getFreqDisplay(tc){
  const freqMap = {
    bass_mid: 'Main Focus（代表整条贝斯）',
    vocal_mid: 'Main Focus（代表整条人声）',
  };
  return freqMap[tc.name] || (tc.freq || 'AI全频');
}
function getMixerTrackShortName(tc){
  const nameMap = {
    bass_mid: '贝斯',
    vocal_mid: '人声',
  };
  return nameMap[tc.name] || tc.label.split(' ').pop();
}

function initAudio(){
  if(_ready) return;
  try{
    actx = new(window.AudioContext||window.webkitAudioContext)();
    AUD.volume=0; AUD.muted=true;

    const hasDrumSep = !!(STEM_AUDS.kick?.src && STEM_AUDS.kick.src !== '');

    // ── Step 1：为每个有效 stem <audio> 建 MediaElementSource + Analyser + GainNode ──
    const stemNames = ['drums','bass','guitar','piano','vocals','other'];
    if(hasDrumSep) stemNames.push('kick','snare','toms','hh','cymbals');

    const stemGains = {}; // stemName → GainNode（stem 级别，band 型子轨共享）

    stemNames.forEach(stemName => {
      const aud = STEM_AUDS[stemName];
      if(!aud || !aud.src) return;

      const src = actx.createMediaElementSource(aud);
      stemSrcs[stemName] = src;

      const analyser = actx.createAnalyser();
      analyser.fftSize=FFT; analyser.smoothingTimeConstant=0.72;
      analyser.minDecibels=-95; analyser.maxDecibels=-5;
      stemAnalysers[stemName] = analyser;

      const gain = actx.createGain();
      // drums 主轨在有 DrumSep 时静音
      gain.gain.value = (hasDrumSep && stemName === 'drums') ? 0 : 1;

      src.connect(analyser);
      analyser.connect(gain);
      gain.connect(actx.destination);

      stemGains[stemName] = gain;
    });

    // ── Step 2：将 trackGains 映射到对应的 stem GainNode ──
    // DrumSep/full 独立型：每轨对应自己 stem 的 GainNode（一对一）
    // Band 型：多个子轨共享父 stem 的 GainNode
    TRACKS_CFG.forEach(tc => {
      const g = stemGains[tc.stem];
      if(g) trackGains[tc.name] = g;
    });

    // drums 主轨本身也注册（但 TRACKS_CFG 里没有 name='drums' 的轨道）
    if(stemGains['drums']) trackGains['drums'] = stemGains['drums'];

    _ready = true;
    console.log('🎛 Audio: 双架构初始化完成 —',
      Object.keys(trackGains).length, '轨 trackGains |',
      hasDrumSep ? 'DrumSep模式' : '标准模式');
  } catch(e){ console.warn('AudioCtx:', e); }
}

async function loadSongList(){
  try{
    const d=await(await fetch('beats/index.json')).json();
    ALL_SONGS=Array.isArray(d)?d:(d.songs||[]);
    buildSongList();
  }catch(e){ALL_SONGS=[{file:'watercolor.json',song:'Watercolor',artist:'Katuchat'}];}
}

async function loadSong(idx){
  CUR_SONG_IDX=idx;
  const meta=ALL_SONGS[idx];
  if(!meta)return;
  try{
    const d=await(await fetch('beats/'+meta.file)).json();
    BPM=d.bpm||129.2;TOTAL=d.duration||213;MSTART=d.music_start||0.05;
    BEATS=d.beats||[];BAR_STARTS=d.bar_starts||[];
    EVENTS=(d.events||[]).filter(e=>e.is_cue!==false).map((e,i)=>({...e,idx:i,el:null}));
    TRACKS_CFG=d.tracks_config||[];STEMS=d.stems||{};
    // 为每个 tc 注入 _loHz/_hiHz 数值（修复 '3k-8kHz' parseInt bug）
    TRACKS_CFG.forEach(tc=>{
      const f=tc.freq||'';
      const m=f.match(/^([\d.]+)(k?).*?-\s*([\d.]+)(k?)/i);
      if(m){
        tc._loHz=parseFloat(m[1])*(m[2]?1000:1);
        tc._hiHz=parseFloat(m[3])*(m[4]?1000:1);
      } else { tc._loHz=null; tc._hiHz=null; }
    });
    GENRE_INFO=d.genre||null;
    window._CURRENT_SONG_DATA = d; // buildRhythmPanel 需要

    document.getElementById('cb').textContent=BPM+' BPM';
    document.getElementById('ck').textContent=d.key||'—';
    const artist=d.artist||meta.artist||'';
    const song=d.song||meta.song||'';
    document.getElementById('cs').textContent=`${artist} · ${song}`;
    document.getElementById('tt').textContent=fmt(TOTAL);

    // 更新曲风 chip
    if(GENRE_INFO){
      document.getElementById('cgenre').textContent=GENRE_INFO.short||GENRE_INFO.name||'—';
    }

    // 更新音频 src
    if(d.audio_files){
      AUD.src=d.audio_files.main||'';
      Object.keys(STEM_AUDS).forEach(k=>{
        if(d.audio_files[k]) STEM_AUDS[k].src=d.audio_files[k];
        else STEM_AUDS[k].src=''; // 清空不存在的轨道
      });
      Object.values(STEM_AUDS).forEach(a=>{if(a.src)a.load();});
    }

    buildDAW();buildLog();drawStaticWF();
    buildDanceMoves();
    buildRhythmPanel();
    updateSongListActive();
  }catch(e){console.warn('loadSong:',e);}
}

async function loadJSON(){
  await loadSongList();
  await loadSong(0);
}

    {move:'Groove Step',tip:'重心左右移动，跟 bass 的节奏呼吸'},

    {move:'Hand Wave',tip:'手臂慢 wave，配合 piano/synth 旋律走向'},
    {move:'Chill Rock',tip:'身体前后轻摇，感受低频温暖'},
  ],
  'hiphop':[
    {move:'Bounce 弹跳',tip:'跟 kick 做身体弹跳，snare 打到时停顿'},
    {move:'Running Man',tip:'4 拍一个循环，踩稳每个 kick'},
    {move:'Two Step',tip:'左右踏步，kick 踩实'},
    {move:'Body Rock',tip:'身体整体律动，重心跟随节拍'},
    {move:'Pop & Lock',tip:'snare 来了时做 pop 定格'},
  ],
  'default':[
    {move:'自由律动',tip:'跟随节拍感受音乐'},
    {move:'踏步移位',tip:'踩稳 kick，感受地板的力量'},
    {move:'手臂律动',tip:'配合旋律做流动手臂动作'},
  ]
};

function buildDanceMoves(){
  DANCE_MOVES=[];
  const genreKey=GENRE_INFO?.type||'default';
  const moves=GENRE_MOVES[genreKey]||GENRE_MOVES.default;

  const kickH=STEMS.kick?.hits||[];
  const bassH=STEMS.bass?.hits||[];
  const vocalH=STEMS.vocals?.hits||[];

  BAR_STARTS.forEach((t,i)=>{
    const end=BAR_STARTS[i+1]||TOTAL;
    const kicks=kickH.filter(h=>h>=t&&h<end).length;
    const bass=bassH.filter(h=>h>=t&&h<end).length;
    const voc=vocalH.filter(h=>h>=t&&h<end).length;

    // 根据段落特征选最合适的动作
    let moveIdx;
    if(voc>=3) moveIdx=3%moves.length;       // 人声多 → 手部动作
    else if(kicks>=6) moveIdx=0;             // 密集 kick → 律动
    else if(bass>=4) moveIdx=1%moves.length; // Bass 重 → 重心
    else moveIdx=i%moves.length;             // 轮转

    DANCE_MOVES.push({time:t,end,move:moves[moveIdx].move,tip:moves[moveIdx].tip,barIdx:i});
  });
}

// ══════════════════════════════════════════════════════════════
// 节奏信息卡（右上角）
// ══════════════════════════════════════════════════════════════
let _rhythmData = null;
let _lastBlockIdx = -1;

function buildRhythmPanel(){
  _rhythmData = null;
  _lastBlockIdx = -1; // Reset block index
  const panel = document.getElementById('rhythmPanel');
  if(!panel) return;
  const rp = window._CURRENT_SONG_DATA?.rhythm_pattern;
  if(!rp || !rp.summary){
    document.getElementById('rhythmSummary').textContent = 'No pattern data';
    document.getElementById('seqMatrix').innerHTML = '';
    return;
  }
  _rhythmData = rp;
  document.getElementById('rhythmSummary').textContent = 'Block 1 • ' + rp.summary;
  updatePulseMap(true); // Initial render
}

function updatePulseMap(force = false) {
  const ct = getTime();
  const rp = window._CURRENT_SONG_DATA?.rhythm_pattern;
  if (!rp || !BEATS.length || (ct < MSTART && !force)) return;

  // find bi (current beat index)
  let lo = 0, hi = BEATS.length - 1;
  const searchTime = Math.max(ct, MSTART);
  while (lo <= hi) { const m = (lo + hi) >> 1; BEATS[m] <= searchTime ? lo = m + 1 : hi = m - 1; }
  let bi = hi;
  if (bi < 0) bi = 0; // fallback

  const nbar = Math.floor(bi / 8); 
  if (nbar === _lastBlockIdx && !force) return; 
  _lastBlockIdx = nbar;

  const blockStart = nbar * 8;
  const blockBeats = [];
  const bpm = window._CURRENT_SONG_DATA.bpm || 120;
  const beatPeriod = 60 / bpm;
  
  for(let i = 0; i < 8; i++) {
    const idx = blockStart + i;
    if(idx < BEATS.length) blockBeats.push(BEATS[idx]);
    else blockBeats.push(BEATS[BEATS.length-1] + ((idx - BEATS.length + 1) * beatPeriod));
  }

  const CATEGORIES = [
    { id: 'vocal', label: '人声', stems: ['vocals', 'vocal_lo', 'vocal_mid', 'vocal_hi', 'piano', 'guitar'] },
    { id: 'synth', label: '音效', stems: ['synth', 'fx', 'other_low', 'other'] },
    { id: 'hihat', label: '镲片', stems: ['hh', 'cymbals'] },
    { id: 'snare', label: '军鼓', stems: ['snare', 'toms'] },
    { id: 'kick',  label: '底鼓', stems: ['kick', 'bass', 'bass_sub', 'bass_mid'] }
  ];

  const threshold = beatPeriod * 0.4;
  const matrix = document.getElementById('seqMatrix');
  if(!matrix) return;

  let html = '';

  CATEGORIES.forEach(cat => {
    html += `<div class="seq-row"><div class="seq-label" title="${cat.stems.join(', ')}">${cat.label}</div>`;
    
    for(let i = 0; i < 8; i++) {
      const beatTime = blockBeats[i];
      let hasHit = false;
      
      for(const stemName of cat.stems) {
        const hits = (STEMS[stemName] || {}).hits || [];
        if (!hits.length) continue;
        
        let l = 0, r = hits.length - 1;
        while(l <= r) {
          const m = (l + r) >> 1;
          if (Math.abs(hits[m] - beatTime) <= threshold) {
            hasHit = true; break;
          }
          if (hits[m] < beatTime) l = m + 1;
          else r = m - 1;
        }
        if(hasHit) break;
      }

      const activeClass = hasHit ? ` active ${cat.id}` : '';
      html += `<div class="seq-step${activeClass}"></div>`;
    }
    html += '</div>';
  });

  matrix.innerHTML = html;
  
  const sumEl = document.getElementById('rhythmSummary');
  if(sumEl) {
    sumEl.textContent = `Block ${nbar + 1} • ${rp.summary || '动态段落'}`;
  }
}

// ══════════════════════════════════════════════════════════════
// DAW — 所有轨道始终展开，单轨 stem 不显示分组标题
// ══════════════════════════════════════════════════════════════
let trackRows=[];

function buildDAW(){
  const daw=document.getElementById('daw');
  daw.innerHTML='';trackRows=[];

  const DRUM_STEMS = new Set(['kick','snare','toms','hh','cymbals']);
  const grouped={};
  TRACKS_CFG.forEach(tc=>{
    const groupKey = DRUM_STEMS.has(tc.stem) ? 'drums' : tc.stem;
    if(!grouped[groupKey])grouped[groupKey]=[];
    grouped[groupKey].push(tc);
  });

  function appendRoleDivider(role){
    const div = document.createElement('div');
    div.className = 'role-divider ' + role;
    if(role === 'train'){
      div.innerHTML = `<div class="role-divider-main"><span class="role-divider-title">MAIN FOCUS</span><span class="role-divider-sub">聚焦鼓点、律动骨架与关键进入点</span></div><span class="role-divider-chip">Direct</span>`;
    } else {
      div.innerHTML = `<div class="role-divider-main"><span class="role-divider-title">AUX LAYERS</span><span class="role-divider-sub">观察层次、进入时机与氛围，不作为独立监听</span></div><span class="role-divider-chip">Guide</span>`;
    }
    daw.appendChild(div);
  }

  function appendGroupedTracks(role){
    ['drums','bass','guitar','piano','vocals','other'].forEach(stemName=>{
      const allTracks=grouped[stemName];
      if(!allTracks||!allTracks.length)return;
      const tracks = allTracks.filter(tc => role === 'train' ? isTrainingTrack(tc) : isAnalysisTrack(tc));
      if(!tracks.length) return;

      if(tracks.length > 1){
        const hdr=document.createElement('div');
        hdr.className='stem-hdr';
        hdr.style.borderLeft=`3px solid ${STEM_COLORS[stemName]}`;
        hdr.innerHTML=`<span class="stem-hdr-icon">${STEM_ICONS[stemName]}</span>
          <span class="stem-hdr-name" style="color:${STEM_COLORS[stemName]}">${STEM_NAMES[stemName]}</span>`;
        daw.appendChild(hdr);
      }

      tracks.forEach(tc=>{
        const subData=STEMS[tc.name]||{};
        const row=document.createElement('div');
        const isSubTrack = tracks.length > 1;
        const roleCls = isTrainingTrack(tc) ? ' train-track' : ' analysis-track';
        row.className='tr'+(isSubTrack?' sub-track':'')+roleCls;row.id='tr-'+tc.name;
        const label=document.createElement('div');
        label.className='tr-label';
        label.innerHTML=`<span class="tr-icon">${tc.icon}</span>
          <div><div class="tr-name" style="color:${tc.color}">${getDisplayTrackName(tc)}</div>
          <div class="tr-hz">${getFreqDisplay(tc)}${isTrainingTrack(tc)?'<span class="tr-click-tip">· 点击开关</span>':''}</div>
          <div class="tr-role ${isTrainingTrack(tc)?'role-train':'role-analysis'}">${getTrackRoleLabel(tc)}</div></div>`;
        const cvWrap=document.createElement('div');
        cvWrap.className='tr-cv';
        const cv=document.createElement('canvas');
        cvWrap.appendChild(cv);
        const overlay=document.createElement('div');
        overlay.className='tr-overlay';
        const bubble=document.createElement('div');
        bubble.className='tr-bubble';
        overlay.appendChild(bubble);
        row.appendChild(label);row.appendChild(cvWrap);row.appendChild(overlay);
        if(isTrainingTrack(tc)){
          row.onclick = (e)=>{
            if(e.target.closest('.tr-bubble')) return;
            const btn = document.getElementById('mx-'+tc.name);
            if(btn) toggleTrack(btn);
          };
          row.oncontextmenu = (e)=>{
            e.preventDefault();
            soloTrack(tc.name);
          };
        }
        daw.appendChild(row);
        trackRows.push({cv,wrap:cvWrap,row,tc,stemName:tc.stem,subData,w:0,h:0,flashTimer:0,hitFlash:0,bubble});
      });
    });
  }

  appendRoleDivider('train');
  appendGroupedTracks('train');
  appendRoleDivider('analysis');
  appendGroupedTracks('analysis');

  buildMixerBar();
  resizeTracks();
}

function resizeTracks(){
  trackRows.forEach(t=>{
    // display:none 的展开行不 resize（避免宽高=0 覆盖已有数据）
    if(t.row.style.display==='none') return;
    const w=t.wrap.offsetWidth;
    const h=t.mergedH||t.wrap.offsetHeight;
    if(!w||!h) return;
    t.cv.width=w*DPR;t.cv.height=h*DPR;
    t.cv.style.width=w+'px';t.cv.style.height=h+'px';
    t.w=w;t.h=h;
  });
}

// ── 绘制轨道 ──
function drawTracks(){
  const ct=getTime(),dur=TOTAL;
  trackRows.forEach(t=>{
    // 跳过隐藏的行（不绘制）
    if(t.row.style.display==='none') return;
    const ctx=t.cv.getContext('2d');
    const W=t.w*DPR,H=t.h*DPR;
    if(!W||!H)return;
    ctx.clearRect(0,0,W,H);
    const col=t.tc.color;
    const hits=t.subData.hits||[];
    const curve=t.subData.energy_curve||[];
    const isMuted=trackMuted[t.tc.name]||false;
    const alpha=isMuted?0.1:1;

    if(curve.length>0){
      ctx.save();ctx.globalAlpha=alpha;
      ctx.beginPath();ctx.moveTo(0,H);
      for(let i=0;i<curve.length;i++){
        const x=(i/curve.length)*W;
        ctx.lineTo(x,H-curve[i]*H*0.85);
      }
      ctx.lineTo(W,H);ctx.closePath();
      const g=ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0,col+'28');g.addColorStop(1,col+'05');
      ctx.fillStyle=g;ctx.fill();
      ctx.beginPath();
      for(let i=0;i<curve.length;i++){
        const x=(i/curve.length)*W;
        i===0?ctx.moveTo(x,H-curve[i]*H*.85):ctx.lineTo(x,H-curve[i]*H*.85);
      }
      ctx.strokeStyle=col+'44';ctx.lineWidth=1;ctx.stroke();
      ctx.restore();
    }

    ctx.save();ctx.globalAlpha=alpha;
    let hasActiveHit=false;
    hits.forEach(ht=>{
      const x=(ht/dur)*W;
      const isCur=Math.abs(ht-ct)<0.18;
      ctx.strokeStyle=isCur?col:col+'44';
      ctx.lineWidth=isCur?3:0.8;
      if(isCur){ctx.shadowColor=col;ctx.shadowBlur=8;hasActiveHit=true;}
      ctx.beginPath();ctx.moveTo(x,H*.05);ctx.lineTo(x,H*.95);ctx.stroke();
      ctx.shadowBlur=0;
      if(isCur){
        ctx.fillStyle=col;
        ctx.beginPath();ctx.arc(x,H/2,3.5,0,Math.PI*2);ctx.fill();
      }
    });
    ctx.restore();

    // 播放头
    const phX=(ct/dur)*W;
    ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(phX,0);ctx.lineTo(phX,H);ctx.stroke();

    // 实时能量条
    if(_ready&&stemAnalysers[t.stemName]){
      const a=stemAnalysers[t.stemName];
      const fd=new Uint8Array(a.frequencyBinCount);
      a.getByteFrequencyData(fd);
      const SR=actx.sampleRate,binHz=SR/FFT,bins=a.frequencyBinCount;
      let lo=0,hi=bins-1;
      // 从 tracks_config 的 freq 字段精确解析频率范围
      const tc=t.tc;
      if(tc._loHz!=null && tc._hiHz!=null){
        lo=Math.max(0,Math.round(tc._loHz/binHz));
        hi=Math.min(bins-1,Math.round(tc._hiHz/binHz));
      }
      let sum=0,cnt=0;
      for(let b=lo;b<=hi;b++){sum+=fd[b];cnt++;}
      const e=cnt>0?sum/(cnt*255):0;
      const bW=6*DPR,bH=e*H*.88,bx=W-bW-2;
      ctx.globalAlpha=isMuted?.06:1;
      ctx.fillStyle=col+'99';
      ctx.fillRect(bx,H-bH,bW,bH);
      ctx.globalAlpha=1;
      if(e>0.15&&!isMuted)t.flashTimer=4;
    }

    if(hasActiveHit&&!isMuted){
      t.flashTimer=5;
      triggerHitVFX(t.tc.name,col);
    }
    if(t.flashTimer>0){t.row.classList.add('flash');t.flashTimer--;}
    else t.row.classList.remove('flash');

    // 内嵌 VFX 叠加
    const xPlay=(ct/dur)*W;
    drawInlineVFX(t.tc.name,ctx,W,H,xPlay);
  });
}

// ══════════════════════════════════════════════════════════════
// 轨道内嵌式 VFX 系统（DAW 风格，不出轨道边框）
// ══════════════════════════════════════════════════════════════
let trackVFX = {}; // key=trackName, val=[] particles

function pushVFX(name, p){ if(!trackVFX[name]) trackVFX[name]=[]; trackVFX[name].push(p); }

function spawnVFX(trackName, color, intensity){
  const tc = TRACKS_CFG.find(t=>t.name===trackName);
  const stem = tc?.stem||trackName;
  const now  = performance.now()/1000;
  const I = intensity;
  if(stem==='drums'){
    // 鼓：从播放头向左冲出亮条 + 小火花
    pushVFX(trackName,{type:'bar',t0:now,dur:0.3,color,I});
    for(let i=0;i<2;i++) pushVFX(trackName,{type:'spark',t0:now,dur:0.28+i*0.05,color,
      vx:-(18+Math.random()*28)*I, vy:(Math.random()-0.5)*10*I});
  } else if(stem==='vocals'){
    // 人声：轨道内水平扩散波纹
    pushVFX(trackName,{type:'ripple_h',t0:now,dur:0.5,color,I});
  } else if(stem==='bass'){
    // 贝斯：纵向能量柱上下弹动
    pushVFX(trackName,{type:'vbar',t0:now,dur:0.4,color,I});
  } else if(stem==='guitar'||stem==='piano'){
    // 弦乐：正弦波扩散后消退
    pushVFX(trackName,{type:'sine',t0:now,dur:0.6,color,I});
  } else {
    // synth/fx/other：小点散射
    for(let i=0;i<3+Math.round(I*3);i++)
      pushVFX(trackName,{type:'dot',t0:now,dur:0.45,color,
        vx:(Math.random()-0.5)*28*I, vy:(Math.random()-0.5)*12*I});
  }
}

function drawInlineVFX(trackName, ctx, W, H, xPlay){
  const list = trackVFX[trackName];
  if(!list||!list.length) return;
  const now = performance.now()/1000;
  trackVFX[trackName] = list.filter(p=>{
    const age = now - p.t0;
    if(age < 0) return true;
    const prog = Math.min(1, age/p.dur);
    if(prog >= 1) return false;
    const fade = (1-prog)*(1-prog);
    ctx.save();
    ctx.globalAlpha = fade * 0.72; // 最多 72% 透明度，不遮挡波形

    if(p.type==='bar'){
      // 亮条：从播放头左侧短暂出现
      const bw = Math.min(W*0.08, 14) * (1-prog*0.6);
      const bx = xPlay - bw*(1+prog*1.5);
      const bh = H * (0.6 + 0.35*Math.sin(prog*Math.PI));
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color; ctx.shadowBlur = 4;
      ctx.fillRect(Math.max(0,bx), (H-bh)/2, bw, bh);
    }
    else if(p.type==='spark'){
      const sx = xPlay + p.vx*age;
      const sy = H/2  + p.vy*age;
      if(sx>=0 && sx<=W && sy>=0 && sy<=H){
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(sx, sy, 1.5, 0, Math.PI*2); ctx.fill();
      }
    }
    else if(p.type==='ripple_h'){
      const ext = W * 0.12 * prog; // 最多轨道宽 12%
      const amp = H * 0.28 * (1-prog);
      ctx.strokeStyle = p.color; ctx.lineWidth = 1;
      ctx.shadowColor = p.color; ctx.shadowBlur = 3;
      ctx.beginPath();
      for(let i=0;i<=20;i++){
        const ix = xPlay - ext + i/20*ext*2;
        const iy = H/2 + Math.sin(i/20*Math.PI*5 - prog*Math.PI*3)*amp;
        i===0?ctx.moveTo(ix,iy):ctx.lineTo(ix,iy);
      }
      ctx.stroke();
    }
    else if(p.type==='vbar'){
      const bh = H * (0.3+0.6*p.I) * Math.sin(prog*Math.PI);
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color; ctx.shadowBlur = 5;
      ctx.fillRect(xPlay-2, (H-bh)/2, 4, bh);
    }
    else if(p.type==='sine'){
      const len = W * 0.09 * (1+p.I);
      const amp = H * 0.3 * Math.exp(-prog*3.5);
      ctx.strokeStyle = p.color; ctx.lineWidth = 1.2;
      ctx.shadowColor = p.color; ctx.shadowBlur = 3;
      ctx.beginPath();
      for(let i=0;i<=24;i++){
        const ix = xPlay - len/2 + i/24*len;
        const iy = H/2 + Math.sin(i/24*Math.PI*4)*amp;
        i===0?ctx.moveTo(ix,iy):ctx.lineTo(ix,iy);
      }
      ctx.stroke();
    }
    else if(p.type==='dot'){
      const sx = xPlay + p.vx*age, sy = H/2 + p.vy*age;
      if(sx>=0&&sx<=W&&sy>=0&&sy<=H){
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(sx, sy, 1.5, 0, Math.PI*2); ctx.fill();
      }
    }
    ctx.restore();
    return true;
  });
}

// ══════════════════════════════════════════════════════════════
// 乐器音效合成（Web Audio API — 轻量合成，无需音频文件）
// ══════════════════════════════════════════════════════════════
let _sfxCtx = null;
function getSfxCtx(){
  if(!_sfxCtx) _sfxCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(_sfxCtx.state==='suspended') _sfxCtx.resume();
  return _sfxCtx;
}

function sfxKick(vol=0.5){
  // 底鼓：低频正弦快速衰减 + 噪声冲击
  const ctx=getSfxCtx(),t=ctx.currentTime;
  const osc=ctx.createOscillator(),g=ctx.createGain();
  osc.type='sine'; osc.frequency.setValueAtTime(120,t); osc.frequency.exponentialRampToValueAtTime(40,t+0.08);
  g.gain.setValueAtTime(vol*1.2,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.22);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(t); osc.stop(t+0.22);
}

function sfxSnare(vol=0.4){
  // 军鼓：噪声 + 高频正弦混合
  const ctx=getSfxCtx(),t=ctx.currentTime;
  const buf=ctx.createBuffer(1,ctx.sampleRate*0.12,ctx.sampleRate);
  const data=buf.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i]=(Math.random()*2-1);
  const src=ctx.createBufferSource(),g=ctx.createGain();
  const hpf=ctx.createBiquadFilter(); hpf.type='highpass'; hpf.frequency.value=2000;
  src.buffer=buf; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.12);
  src.connect(hpf); hpf.connect(g); g.connect(ctx.destination); src.start(t);
}

function sfxHihat(vol=0.18){
  // 踩镲：短促金属声，快攻快衰（“踏踏”）
  const ctx=getSfxCtx(),t=ctx.currentTime;
  const buf=ctx.createBuffer(1,ctx.sampleRate*0.06,ctx.sampleRate);
  const data=buf.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i]=(Math.random()*2-1);
  const src=ctx.createBufferSource(),g=ctx.createGain();
  const bpf=ctx.createBiquadFilter(); bpf.type='bandpass'; bpf.frequency.value=7000; bpf.Q.value=1.2;
  src.buffer=buf;
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.05);
  src.connect(bpf); bpf.connect(g); g.connect(ctx.destination); src.start(t);
}

function sfxCrash(vol=0.2){
  // 亮镲：高频噪声，长尾衰减（“次次”）
  const ctx=getSfxCtx(),t=ctx.currentTime;
  const buf=ctx.createBuffer(1,ctx.sampleRate*0.35,ctx.sampleRate);
  const data=buf.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i]=(Math.random()*2-1);
  const src=ctx.createBufferSource(),g=ctx.createGain();
  const hpf=ctx.createBiquadFilter(); hpf.type='highpass'; hpf.frequency.value=9000;
  src.buffer=buf;
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.32);
  src.connect(hpf); hpf.connect(g); g.connect(ctx.destination); src.start(t);
}

function sfxBass(vol=0.35){
  // 贝斯：超低频正弦，慢衰减
  const ctx=getSfxCtx(),t=ctx.currentTime;
  const osc=ctx.createOscillator(),g=ctx.createGain();
  osc.type='triangle'; osc.frequency.setValueAtTime(60,t);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.35);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(t); osc.stop(t+0.35);
}

function sfxVocal(vol=0.2){
  // 人声：中频正弦 + 轻微颤音
  const ctx=getSfxCtx(),t=ctx.currentTime;
  const osc=ctx.createOscillator(),lfo=ctx.createOscillator(),lfoG=ctx.createGain(),g=ctx.createGain();
  osc.type='sine'; osc.frequency.setValueAtTime(440,t);
  lfo.frequency.value=5; lfoG.gain.value=8;
  lfo.connect(lfoG); lfoG.connect(osc.frequency);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.25);
  osc.connect(g); g.connect(ctx.destination);
  lfo.start(t); osc.start(t); osc.stop(t+0.25); lfo.stop(t+0.25);
}

function sfxString(vol=0.25){
  // 弦乐：中高频正弦快速弹拨
  const ctx=getSfxCtx(),t=ctx.currentTime;
  const osc=ctx.createOscillator(),g=ctx.createGain();
  osc.type='sawtooth'; osc.frequency.setValueAtTime(330,t);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(t); osc.stop(t+0.18);
}

// ── Other 系列：叮咚(synth)、哒哒(fx)、环境铺底(other) ──
function sfxDingDong(vol=0.22){
  // 叮咚：两个纯音相差小三度，快攻慢衰（像三角铁 / 钟声）
  const ctx=getSfxCtx(),t=ctx.currentTime;
  const notes=[523, 659]; // C5, E5
  notes.forEach((freq,i)=>{
    const osc=ctx.createOscillator(),g=ctx.createGain();
    osc.type='sine'; osc.frequency.value=freq;
    g.gain.setValueAtTime(0,t+i*0.04);
    g.gain.linearRampToValueAtTime(vol,t+i*0.04+0.005);
    g.gain.exponentialRampToValueAtTime(0.001,t+i*0.04+0.55);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t+i*0.04); osc.stop(t+i*0.04+0.6);
  });
}

function sfxClick(vol=0.28){
  // 哒哒：短促噪声冲击，带高通（像机械键盘/鼓机 click）
  const ctx=getSfxCtx(),t=ctx.currentTime;
  const buf=ctx.createBuffer(1,ctx.sampleRate*0.025,ctx.sampleRate);
  const data=buf.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i]=(Math.random()*2-1)*Math.exp(-i/data.length*12);
  const src=ctx.createBufferSource(),g=ctx.createGain();
  const hpf=ctx.createBiquadFilter(); hpf.type='bandpass'; hpf.frequency.value=3500; hpf.Q.value=1.5;
  src.buffer=buf; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.05);
  src.connect(hpf); hpf.connect(g); g.connect(ctx.destination); src.start(t);
}

function sfxAmbient(vol=0.12){
  // 环境铺底：短促宽频噪声 + 柔和低通（沙沙声）
  const ctx=getSfxCtx(),t=ctx.currentTime;
  const buf=ctx.createBuffer(1,ctx.sampleRate*0.08,ctx.sampleRate);
  const data=buf.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i]=(Math.random()*2-1);
  const src=ctx.createBufferSource(),g=ctx.createGain();
  const lpf=ctx.createBiquadFilter(); lpf.type='lowpass'; lpf.frequency.value=1200;
  src.buffer=buf; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.1);
  src.connect(lpf); lpf.connect(g); g.connect(ctx.destination); src.start(t);
}

// 分发音效
let _sfxEnabled = false; // 默认关闭，右上角开关控制
let _lastSfxT = {};

function toggleSFX(){
  _sfxEnabled = !_sfxEnabled;
  const sw = document.getElementById('sfxSwitch');
  if(sw) sw.classList.toggle('on', _sfxEnabled);
  // 首次开启时解锁 AudioContext（需用户手势）
  if(_sfxEnabled){ try{ getSfxCtx(); }catch(e){} }
}
function playSFX(trackName, stemName){
  if(!_sfxEnabled) return;
  const now = performance.now();
  if(now - (_lastSfxT[trackName]||0) < 80) return; // 防止同轨过频
  _lastSfxT[trackName] = now;
  try{
    if(trackName==='kick')          sfxKick();
    else if(trackName==='snare')    sfxSnare();
    else if(trackName==='hihat')    sfxHihat();
    else if(trackName==='crash')     sfxCrash();
    else if(stemName==='bass')      sfxBass();
    else if(stemName==='vocals')    sfxVocal();
    else if(stemName==='guitar')    sfxString();
    else if(stemName==='piano')     sfxString(0.2);
    else if(trackName==='synth')    sfxDingDong();  // 合成器 → 叮咚钟声
    else if(trackName==='fx')       sfxClick();     // FX/效果 → 哒哒机械声
    else if(trackName==='other_low') sfxAmbient();  // Pad 低频铺底 → 沙沙声
    else                            sfxAmbient();   // 兜底
  }catch(e){}
}

// ══════════════════════════════════════════════════════════════
// HIT VFX
// ══════════════════════════════════════════════════════════════
let lastFlashT=0;
let trackLastHit={},trackHitCount={};

function triggerHitVFX(name,color){
  const seg=document.getElementById('hs-'+name);
  if(seg){seg.classList.remove('active');void seg.offsetWidth;seg.classList.add('active');}
  // 分乐器 VFX + 音效
  const ct=getTime();
  const tc=TRACKS_CFG.find(t=>t.name===name);
  const stemName=tc?.stem||name;
  const gap=ct-(trackLastHit[name]||0);
  trackLastHit[name]=ct;
  trackHitCount[name]=gap<0.55?(trackHitCount[name]||0)+1:1;
  const intensity=Math.min(1,0.3+trackHitCount[name]*0.22);
  spawnVFX(name,color,intensity);
  playSFX(name,stemName);  // 乐器音效
  if(trackHitCount[name]>=3){
    setTimeout(()=>spawnVFX(name,color,intensity*0.5),60);
  }
  if(ct-lastFlashT<0.12)return;
  const kickHit=isHitting('kick',ct);
  const snareHit=isHitting('snare',ct);
  if(kickHit&&snareHit){fireFlash('#ff3b30',0.25);lastFlashT=ct;}
  else if(kickHit){fireEdge('#ff3b30');}
  else if(snareHit){fireEdge('#ff9f0a');}
}

function isHitting(n,ct){
  return (STEMS[n]?.hits||[]).some(t=>Math.abs(t-ct)<0.12);
}

function fireFlash(color,intensity){
  const el=document.getElementById('hitFlash');
  const hex=Math.round(intensity*80).toString(16).padStart(2,'0');
  el.style.background=`radial-gradient(circle at center,${color}${hex},transparent 70%)`;
  el.classList.remove('fire');void el.offsetWidth;el.classList.add('fire');
}
function fireEdge(color){
  const el=document.getElementById('edgeGlow');
  el.style.boxShadow=`inset 0 0 60px 10px ${color}33,inset 0 0 120px 20px ${color}15`;
  el.classList.remove('fire');void el.offsetWidth;el.classList.add('fire');
}

// 静态波形
// ══════════════════════════════════════════════════════════════
const wfCv=document.getElementById('wf-cv');
let WW,WH;
function drawStaticWF(){
  if(!WW)return;
  const ctx=wfCv.getContext('2d'),W=WW*DPR,H=WH*DPR;
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#020208';ctx.fillRect(0,0,W,H);
  TRACKS_CFG.forEach(tc=>{
    const hits=(STEMS[tc.name]||{}).hits||[];
    ctx.strokeStyle=tc.color+'33';ctx.lineWidth=.6;
    hits.forEach(t=>{const x=(t/TOTAL)*W;ctx.beginPath();ctx.moveTo(x,H*.1);ctx.lineTo(x,H*.9);ctx.stroke();});
  });
  ctx.strokeStyle='rgba(255,110,199,.15)';ctx.lineWidth=.8;ctx.setLineDash([2,4]);
  BAR_STARTS.forEach(t=>{const x=(t/TOTAL)*W;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();});
  ctx.setLineDash([]);
  EVENTS.forEach(e=>{
    if(!e.is_cue)return;
    const x=(e.time/TOTAL)*W,c=e.color||'#fff';
    ctx.fillStyle=c;ctx.shadowColor=c;ctx.shadowBlur=3;
    ctx.beginPath();ctx.moveTo(x,2);ctx.lineTo(x+3,H/2);ctx.lineTo(x,H-2);ctx.lineTo(x-3,H/2);
    ctx.closePath();ctx.fill();ctx.shadowBlur=0;
  });
}

let lastEv=-1;
function updateCue(){
  const ct=getTime();
  let best=null,bd=9999;
  EVENTS.forEach(e=>{const d=ct-e.time;if(d>=0&&d<4&&d<bd){bd=d;best=e;}});
  const cue=document.getElementById('cue');
  if(best){
    cue.style.background=best.color+'1a';cue.style.borderColor=best.color+'55';cue.style.color=best.color;
    document.getElementById('ci').textContent=best.icon||'•';
    document.getElementById('ct').textContent=best.label||best.desc||'';
    document.getElementById('csub').textContent=best.desc||'';
    if(best.idx!==lastEv){
      lastEv=best.idx;
      // ev-item 只在 right-col 存在时才操作
      document.querySelectorAll('.ev-item').forEach(el=>{
        el.classList.remove('active');
        if(parseFloat(el.querySelector('.ev-t')?.textContent)<ct)el.classList.add('passed');
      });
      best.el?.classList.add('active');
      best.el?.scrollIntoView({behavior:'smooth',block:'nearest'});

      // ★ 触发轨道气泡/大横幅
      const k=`${best.idx}`;
      if(!evShownAt[k]){
        evShownAt[k]=ct;
        triggerEventVisual(best);
      }
    }
  }else if(_playing){
    cue.style.background='linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.03))';
    cue.style.borderColor='rgba(255,255,255,.08)';
    cue.style.color='rgba(237,241,247,.34)';
    document.getElementById('ci').textContent='•';
    document.getElementById('ct').textContent=ct<MSTART?'等待进入...':'跟住律动';
    document.getElementById('csub').textContent='';
  }
}

// 根据事件类型触发不同视觉反馈
function triggerEventVisual(ev){
  const type=ev.type||'';
  if(type==='bar1'||type==='peak'){
    showSegmentBanner(ev.icon||'🔁',ev.label||ev.desc||'',ev.color||'#fff');
    const el=document.getElementById('segBanner');
    el?.classList.add('urgent');
    setTimeout(()=>el?.classList.remove('urgent'),760);
    return;
  }
  const trackMap={
    kick:'kick',snare:'snare',hihat:'hh',crash:'cymbals',
    bass_in:'bass_mid',vocal:'vocal_mid',guitar:'guitar',piano:'piano',bass:'bass_mid',synth:'synth',fx:'fx'
  };
  const trackName=trackMap[type]||type;
  showTrackBubble(trackName,ev.icon||'✨',ev.label||ev.desc||'',ev.color||'#fff');
  const cue=document.getElementById('cue');
  cue?.classList.add('urgent');
  setTimeout(()=>cue?.classList.remove('urgent'),720);
}

// ══════════════════════════════════════════════════════════════
// 8拍 + and拍（内嵌格子版）
// ══════════════════════════════════════════════════════════════
let curBeat=-1,curBar=-1;
let andMode=false;
let curSub=-1,curSubBeat=-1;

function toggleAndMode(){
  andMode=!andMode;
  document.getElementById('andModeBtn').classList.toggle('active',andMode);
  for(let b=0;b<8;b++){
    document.getElementById('bs'+b)?.classList.toggle('visible',andMode);
  }
  if(!andMode){
    for(let b=0;b<8;b++)for(let s=0;s<4;s++){
      document.getElementById(`bs${b}-${s}`)?.classList.remove('lit');
    }
    curSub=-1;curSubBeat=-1;
  }
}

function updateBeat(){
  const ct=getTime();
  if(!BEATS.length||ct<MSTART){
    if(curBeat>=0){
      const old=document.getElementById('bx'+curBeat);
      if(old) old.className='bx';
      curBeat=-1;
    }
    document.getElementById('bnum').textContent='—';return;
  }
  let lo=0,hi=BEATS.length-1;
  while(lo<=hi){const m=(lo+hi)>>1;BEATS[m]<=ct?lo=m+1:hi=m-1;}
  const bi=hi;if(bi<0)return;
  const nb=bi%8,nbar=Math.floor(bi/8);
  if(nb!==curBeat){
    if(curBeat>=0){
      const old=document.getElementById('bx'+curBeat);
      if(old) old.className='bx';
    }
    curBeat=nb;
    const el=document.getElementById('bx'+curBeat);if(!el)return;
    el.classList.add('on');
    const bt=BEATS[bi];
    if(nb===0) el.classList.add('bar1');
    else if(isHitting('kick',bt)) el.classList.add('kick');
    else if(isHitting('snare',bt)) el.classList.add('snare');
  }
  if(nbar!==curBar){curBar=nbar;document.getElementById('bnum').textContent=curBar+1;}
  // and 拍细分（内嵌底部色条）
  if(andMode&&BEATS.length>1){
    const nextBeat=BEATS[Math.min(bi+1,BEATS.length-1)];
    const subDur=Math.max(0.01,(nextBeat-BEATS[bi])/4);
    const elapsed=ct-BEATS[bi];
    const ns=Math.max(0,Math.min(3,Math.floor(elapsed/subDur)));
    if(ns!==curSub||nb!==curSubBeat){
      if(curSubBeat>=0&&curSub>=0){
        document.getElementById(`bs${curSubBeat}-${curSub}`)?.classList.remove('lit');
      }
      curSub=ns;curSubBeat=nb;
      document.getElementById(`bs${nb}-${ns}`)?.classList.add('lit');
    }
  }
}

// ══════════════════════════════════════════════════════════════
// 舞步更新
// ══════════════════════════════════════════════════════════════
function updateDance(){
  const ct=getTime();
  let cur=null;
  for(let i=DANCE_MOVES.length-1;i>=0;i--){
    if(ct>=DANCE_MOVES[i].time&&ct<DANCE_MOVES[i].end){cur=DANCE_MOVES[i];break;}
  }
  if(cur&&_playing){
    const genreLabel=GENRE_INFO?.short||GENRE_INFO?.name||'跳舞建议';
    document.getElementById('danceStyle').textContent=`💃 ${genreLabel}`;
    document.getElementById('danceMoveName').textContent=cur.move;
    document.getElementById('danceMoveTip').textContent=cur.tip;
  }
}

// ══════════════════════════════════════════════════════════════
// 播放头
// ══════════════════════════════════════════════════════════════
function getTime(){return (STEM_AUDS.kick?.currentTime || STEM_AUDS.drums.currentTime)||0;}
function updateHead(){
  const ct=getTime(),dur=TOTAL;
  document.getElementById('ph').style.left=(dur>0?ct/dur*100:0)+'%';
  const f=fmt(ct);
  document.getElementById('tc').textContent=f;
  document.getElementById('ctxt').textContent=f;
}

// ══════════════════════════════════════════════════════════════
// 主循环
// ══════════════════════════════════════════════════════════════
function loop(nowMs){
  drawTracks();updateHead();updateBeat();updatePulseMap();updateCue();updateDance();
  drawRipples(nowMs||performance.now());
  requestAnimationFrame(loop);
}

// ══════════════════════════════════════════════════════════════
// 控制
// ══════════════════════════════════════════════════════════════
let _playing=false;
function tp(){_playing?pa():pl();}
function pl(){
  initAudio();
  if(actx?.state==='suspended') actx.resume();
  const t = getTime();
  Object.values(STEM_AUDS).forEach(a=>{
    if(!a.src) return;
    // 如果某个 audio 时间漂移超 0.3s，重新同步（防止 bass 等静默暂停后跑偏）
    if(Math.abs(a.currentTime - t) > 0.3) a.currentTime = t;
    a.play().catch(()=>{});
  });
  _playing=true; document.getElementById('pb').textContent='⏸';
}
function pa(){
  _playing=false; document.getElementById('pb').textContent='▶';
  Object.values(STEM_AUDS).forEach(a=>a.pause());
}
function syncTime(t){
  Object.values(STEM_AUDS).forEach(a=>{ a.currentTime=t; });
}

// 任意 stem audio 意外静默暂停时（非用户操作），自动恢复同步
Object.values(STEM_AUDS).forEach(a=>{
  a.addEventListener('pause', ()=>{
    // _playing 为 true 说明用户期望播放，audio 自己暂停了 → 重新 play
    if(_playing && a.src){
      const t = getTime();
      if(Math.abs(a.currentTime - t) > 0.5) a.currentTime = t;
      a.play().catch(()=>{});
    }
  });
});

(STEM_AUDS.kick || STEM_AUDS.drums).addEventListener('ended',()=>{_playing=false;document.getElementById('pb').textContent='▶';});
function skipB(n){
  const bd=BEATS.length>1?(BEATS[1]-BEATS[0]):(60/BPM);
  syncTime(Math.max(0,Math.min(TOTAL,getTime()+n*bd)));
}
function seekClick(e,el){
  const r=el.getBoundingClientRect();
  syncTime(((e.clientX-r.left)/r.width)*TOTAL);
}
function ss(v,btn){
  Object.values(STEM_AUDS).forEach(a=>a.playbackRate=v);
  document.querySelectorAll('.spd').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
}
// ── Mute 控制（双架构：DrumSep 型控制 audio.muted，Band 型只控制 gain）──
let _soloTrack = null; // 当前 solo 的轨道名

// 设置单个轨道的 gain（ramp 防爆音）
function setTrackGain(name, value){
  const g = trackGains[name];
  if(!g) return;
  const ct = actx ? actx.currentTime : 0;
  g.gain.cancelScheduledValues(ct);
  g.gain.setTargetAtTime(value, ct, 0.015);
}

// 更新父 stem 的 audio.muted 状态（只看主监听，不让辅助线索参与真实播放控制）
function syncParentAudioMute(stem){
  const aud = STEM_AUDS[stem];
  if(!aud) return;
  const tracksOfStem = TRACKS_CFG.filter(t => t.stem === stem && isTrainingTrack(t));
  if(tracksOfStem.length === 0) return;
  const anyActive = tracksOfStem.some(t => !trackMuted[t.name]);
  aud.muted = !anyActive;
}

function restoreFullMixAudioMute(){
  Object.keys(STEM_AUDS).forEach(k=>{
    if(k === 'drums' && STEM_AUDS.kick?.src){ STEM_AUDS[k].muted = true; return; }
    STEM_AUDS[k].muted = false;
  });
}

function buildMixerBar(){
  const bar = document.getElementById('mixerBar');
  if(!bar) return;
  bar.innerHTML = '';
  _soloTrack = null;

  const trainingTracks = getTrainingTracks();
  const analysisTracks = getAnalysisTracks();

  trainingTracks.forEach(tc=>{ trackMuted[tc.name] = false; });
  analysisTracks.forEach(tc=>{ trackMuted[tc.name] = false; });

  const allBtn = document.createElement('div');
  allBtn.className = 'mx-btn mx-tool on';
  allBtn.innerHTML = 'All Main';
  allBtn.onclick = ()=> muteAll(false);
  bar.appendChild(allBtn);

  const noneBtn = document.createElement('div');
  noneBtn.className = 'mx-btn mx-tool';
  noneBtn.innerHTML = 'Mute Main';
  noneBtn.onclick = ()=> muteAll(true);
  bar.appendChild(noneBtn);

  const sep = document.createElement('span');
  sep.className = 'mx-sep';
  sep.textContent = '│';
  bar.appendChild(sep);

  const trainLabel = document.createElement('span');
  trainLabel.className = 'mx-label';
  trainLabel.innerHTML = 'Main <span class="mx-helper train">Direct</span>';
  bar.appendChild(trainLabel);

  trainingTracks.forEach(tc=>{
    const btn = document.createElement('div');
    btn.className = 'mx-btn on';
    btn.id = 'mx-'+tc.name;
    btn.dataset.track = tc.name;
    btn.dataset.stem = tc.stem;
    btn.title = '左键静音 / 右键独听';
    btn.onclick = ()=>{
      if(_soloTrack) { exitSolo(); return; }
      toggleTrack(btn);
    };
    btn.oncontextmenu = (e)=>{ e.preventDefault(); soloTrack(tc.name); };
    btn.innerHTML = `<div class="dot" style="background:${tc.color}"></div><span class="mx-name">${getMixerTrackShortName(tc)}</span>`;
    bar.appendChild(btn);
  });

  if(analysisTracks.length){
    const sep2 = document.createElement('span');
    sep2.className = 'mx-sep';
    sep2.textContent = '│';
    bar.appendChild(sep2);

    const analysisLabel = document.createElement('span');
    analysisLabel.className = 'mx-label';
    analysisLabel.innerHTML = 'Aux <span class="mx-helper analysis">Guide</span>';
    bar.appendChild(analysisLabel);

    analysisTracks.forEach(tc=>{
      const btn = document.createElement('div');
      btn.className = 'mx-btn mx-analysis on';
      btn.id = 'mx-'+tc.name;
      btn.dataset.track = tc.name;
      btn.dataset.stem = tc.stem;
      btn.title = '用于观察进入点与能量变化';
      btn.innerHTML = `<div class="dot" style="background:${tc.color}"></div><span class="mx-name">${getMixerTrackShortName(tc)}</span><span class="mx-tag">Aux</span>`;
      bar.appendChild(btn);
    });
  }
}

function toggleTrack(btn){
  const name = btn.dataset.track;
  const tc = TRACKS_CFG.find(t => t.name === name);
  if(!tc || !isTrainingTrack(tc)) return;
  const stem = tc.stem;

  trackMuted[name] = !trackMuted[name];
  btn.classList.toggle('muted', trackMuted[name]);
  btn.classList.toggle('on', !trackMuted[name]);
  const row = document.getElementById('tr-'+name);
  row?.classList.toggle('muted-audio', trackMuted[name]);
  row?.classList.toggle('active-audio', !trackMuted[name]);

  if(isIndepAudio(tc)){
    const aud = STEM_AUDS[tc.stem];
    if(aud) aud.muted = trackMuted[name];
    setTrackGain(name, trackMuted[name] ? 0 : 1);
  } else {
    syncParentAudioMute(stem);
    const anyActive = TRACKS_CFG.filter(t => t.stem === stem && isTrainingTrack(t)).some(t => !trackMuted[t.name]);
    setTrackGain(name, anyActive ? 1 : 0);
  }
}

function syncStemMute(stem){
  const tracks = TRACKS_CFG.filter(t => t.stem === stem);
  tracks.forEach(tc => {
    if(isIndepAudio(tc)){
      const aud = STEM_AUDS[tc.stem];
      if(aud) aud.muted = trackMuted[tc.name];
    }
    setTrackGain(tc.name, trackMuted[tc.name] ? 0 : 1);
  });
  const hasBand = tracks.some(tc => !isIndepAudio(tc));
  if(hasBand) syncParentAudioMute(stem);
}

function muteAll(muted){
  _soloTrack = null;
  getTrainingTracks().forEach(tc=>{
    trackMuted[tc.name] = muted;
    const btn = document.getElementById('mx-'+tc.name);
    if(btn){ btn.classList.toggle('muted', muted); btn.classList.toggle('on', !muted); btn.classList.remove('solo'); }
    setTrackGain(tc.name, muted ? 0 : 1);
  });
  if(!muted){
    restoreFullMixAudioMute();
    return;
  }
  const trainingStems = new Set(getTrainingTracks().map(t => t.stem));
  Object.keys(STEM_AUDS).forEach(k=>{
    if(k === 'drums' && STEM_AUDS.kick?.src){ STEM_AUDS[k].muted = true; return; }
    if(trainingStems.has(k)) STEM_AUDS[k].muted = true;
  });
}

function soloTrack(name){
  const tc = TRACKS_CFG.find(t => t.name === name);
  if(!tc || !isTrainingTrack(tc)) return;
  _soloTrack = name;
  const soloStem = tc.stem;

  getTrainingTracks().forEach(t=>{
    const isSolo = (t.name === name);
    trackMuted[t.name] = !isSolo;
    const btn = document.getElementById('mx-'+t.name);
    if(btn){
      btn.classList.toggle('muted', !isSolo);
      btn.classList.toggle('on', isSolo);
      btn.classList.toggle('solo', isSolo);
    }
    setTrackGain(t.name, isSolo ? 1 : 0);
  });

  Object.keys(STEM_AUDS).forEach(k=>{
    if(k === 'drums' && STEM_AUDS.kick?.src){ STEM_AUDS[k].muted = true; return; }
    STEM_AUDS[k].muted = (k !== soloStem);
  });
}

function exitSolo(){
  _soloTrack = null;
  muteAll(false);
}
function setVol(v){Object.values(STEM_AUDS).forEach(a=>a.volume=v);}
function fmt(s){if(!isFinite(s))return'0:00';return Math.floor(s/60)+':'+(Math.floor(s%60)+'').padStart(2,'0');}

// 用 kick（DrumSep）或 drums（回退）获取时长
(STEM_AUDS.kick || STEM_AUDS.drums).addEventListener('loadedmetadata',()=>{
  TOTAL=(STEM_AUDS.kick?.duration || STEM_AUDS.drums.duration);
  document.getElementById('tt').textContent=fmt(TOTAL);
});
STEM_AUDS.drums.addEventListener('loadedmetadata',()=>{
  if(!TOTAL) { TOTAL=STEM_AUDS.drums.duration; document.getElementById('tt').textContent=fmt(TOTAL); }
});

// 尺寸
// ══════════════════════════════════════════════════════════════
function resize(){
  WW=wfCv.offsetWidth;WH=wfCv.offsetHeight;
  wfCv.width=WW*DPR;wfCv.height=WH*DPR;
  wfCv.style.width=WW+'px';wfCv.style.height=WH+'px';
  resizeTracks();drawStaticWF();
}
window.addEventListener('resize',resize);
window.addEventListener('load',async()=>{resize();await loadJSON();loop();});
</script>
