<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🕺 街舞音乐教学 · Katuchat - Watercolor</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
:root{
  --bg:#06060e;
  --card:rgba(255,255,255,.04);
  --border:rgba(255,255,255,.07);
  --txt:#e8e8f2;
  --dim:#3a3a55;
  --kick:#ff3b30;
  --snare:#ff9f0a;
  --hihat:#ffd60a;
  --vocal:#30d158;
  --bass:#0a84ff;
  --sfx:#bf5af2;
  --pink:#ff6ec7;
}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);
  color:var(--txt);
  font-family:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif;
  display:flex;flex-direction:column;
}

/* ── HEADER ── */
.hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 18px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
  background:rgba(6,6,14,.9);
  backdrop-filter:blur(20px);
  z-index:10;
}
.hdr-left{display:flex;align-items:center;gap:10px}
.logo{
  width:34px;height:34px;border-radius:9px;
  background:linear-gradient(135deg,#ff3b30,#bf5af2);
  display:flex;align-items:center;justify-content:center;
  font-size:1rem;box-shadow:0 0 16px rgba(255,59,48,.4);
}
.title{font-size:.95rem;font-weight:700}
.sub{font-size:.62rem;color:var(--dim);margin-top:1px}
.song-info{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,110,199,.08);border:1px solid rgba(255,110,199,.2);
  border-radius:20px;padding:5px 14px;
}
.song-name{font-size:.78rem;font-weight:600;color:var(--pink)}
.bpm-badge{
  background:rgba(255,59,48,.12);border:1px solid rgba(255,59,48,.2);
  color:var(--kick);font-size:.68rem;font-weight:700;
  padding:2px 8px;border-radius:8px;
}

/* ── MAIN ── */
.main{
  flex:1;display:grid;
  grid-template-columns:1fr 340px;
  grid-template-rows:1fr auto;
  gap:0;overflow:hidden;
}

/* ── LEFT PANEL ── */
.left{
  display:flex;flex-direction:column;
  border-right:1px solid var(--border);
  overflow:hidden;
}

/* 大频谱区 */
.spectrum-wrap{
  flex:1;position:relative;overflow:hidden;
  background:#04040c;
}
#spectrum-cv{width:100%;height:100%;display:block}

/* 教学提示横幅 */
.cue-banner{
  position:absolute;top:14px;left:50%;transform:translateX(-50%);
  padding:8px 22px;border-radius:12px;
  font-size:1rem;font-weight:700;letter-spacing:.3px;
  pointer-events:none;
  transition:all .15s;
  display:flex;align-items:center;gap:8px;
  background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.1);
  color:rgba(255,255,255,.4);
  white-space:nowrap;
  backdrop-filter:blur(10px);
}
.cue-banner.active{
  background:rgba(0,0,0,.85);
}

/* 频率分区标注 */
.freq-labels{
  position:absolute;bottom:8px;left:0;right:0;
  display:flex;justify-content:space-around;
  padding:0 20px;
  pointer-events:none;
}
.freq-lbl{
  font-size:.58rem;font-weight:600;letter-spacing:.5px;
  color:rgba(255,255,255,.2);text-transform:uppercase;
}

/* ── 波形 + 进度区 ── */
.wf-section{
  height:80px;background:#030309;
  border-top:1px solid var(--border);
  position:relative;flex-shrink:0;
}
#wf-cv{width:100%;height:100%;display:block;cursor:pointer}
/* 播放头 */
.playhead{
  position:absolute;top:0;bottom:0;width:2px;left:0;
  background:rgba(255,255,255,.9);
  box-shadow:0 0 8px #fff,0 0 20px rgba(255,255,255,.4);
  pointer-events:none;z-index:5;
}
.time-row{
  position:absolute;top:0;left:0;right:0;bottom:0;
  display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 10px 4px;pointer-events:none;
}
.time-lbl{font-size:.65rem;color:rgba(255,255,255,.25);font-family:monospace}

/* ── 控制栏 ── */
.ctrl-bar{
  height:52px;background:rgba(4,4,12,.95);
  border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;flex-shrink:0;
}
.ctrl-center{display:flex;align-items:center;gap:10px}
.ctrl-right{display:flex;align-items:center;gap:8px}
.pbtn{
  width:44px;height:44px;border-radius:50%;border:none;
  background:linear-gradient(135deg,#ff3b30,#bf5af2);
  color:#fff;font-size:1rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 20px rgba(255,59,48,.3);
  transition:all .15s;
}
.pbtn:hover{transform:scale(1.06)}
.pbtn:active{transform:scale(.94)}
.skip-btn{
  width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.05);color:rgba(255,255,255,.5);
  font-size:.75rem;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.skip-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.spd-group{display:flex;gap:4px}
.spd{
  padding:4px 10px;border-radius:7px;
  border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);
  color:rgba(255,255,255,.35);font-size:.7rem;font-weight:600;cursor:pointer;
  transition:all .12s;
}
.spd.on{background:rgba(10,132,255,.15);border-color:var(--bass);color:var(--bass)}
.vol-wrap{display:flex;align-items:center;gap:6px;font-size:.65rem;color:var(--dim)}
.vol{-webkit-appearance:none;width:70px;height:3px;border-radius:2px;
  background:rgba(255,255,255,.12);cursor:pointer;outline:none}
.vol::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:#fff}
.cur-time{font-size:.72rem;font-family:monospace;color:rgba(255,255,255,.4);width:40px;text-align:center}

/* ── RIGHT PANEL ── */
.right{
  display:flex;flex-direction:column;
  overflow:hidden;
  background:rgba(4,4,12,.6);
}

/* 8拍 */
.beat-section{
  padding:12px 14px 10px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.section-label{
  font-size:.58rem;color:var(--dim);text-transform:uppercase;letter-spacing:1px;
  margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;
}
.bar-counter{font-size:.7rem;color:var(--pink);font-weight:700}
.beats-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.bx{
  aspect-ratio:1;border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  font-size:.8rem;font-weight:800;
  background:rgba(255,255,255,.04);
  border:1.5px solid rgba(255,255,255,.06);
  color:rgba(255,255,255,.15);
  transition:all .06s ease;
  position:relative;overflow:hidden;
}
.bx::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.15),transparent);
  opacity:0;transition:opacity .06s;
}
.bx.on::before{opacity:1}
.bx.on{color:#fff;transform:scale(1.08)}
.bx.kick.on{background:rgba(255,59,48,.35);border-color:var(--kick);box-shadow:0 0 14px rgba(255,59,48,.6)}
.bx.snare.on{background:rgba(255,159,10,.3);border-color:var(--snare);box-shadow:0 0 12px rgba(255,159,10,.5)}
.bx.hihat.on{background:rgba(255,214,10,.2);border-color:var(--hihat);box-shadow:0 0 10px rgba(255,214,10,.4)}
.bx.bar1.on{background:rgba(255,110,199,.28);border-color:var(--pink);box-shadow:0 0 14px rgba(255,110,199,.55)}

/* VU 电平表 */
.vu-section{
  padding:10px 14px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.vu-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.vu-label{font-size:.62rem;color:var(--dim);width:28px;flex-shrink:0;text-align:right}
.vu-bar-wrap{flex:1;height:10px;background:rgba(255,255,255,.05);border-radius:3px;overflow:hidden;position:relative}
.vu-bar{height:100%;border-radius:3px;transition:width .05s linear;width:0}
.vu-peak{position:absolute;top:0;bottom:0;width:2px;background:#fff;border-radius:1px;transition:left .5s ease-out}

/* 事件日志 */
.events-section{
  flex:1;overflow-y:auto;padding:8px 14px 12px;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.1) transparent;
}
.events-section::-webkit-scrollbar{width:3px}
.events-section::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}
.ev-title{font-size:.58rem;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.ev-item{
  display:flex;align-items:center;gap:7px;
  padding:6px 8px;border-radius:8px;
  margin-bottom:3px;
  transition:all .2s;
  border:1px solid transparent;
  opacity:.38;
}
.ev-item.passed{opacity:.55}
.ev-item.active{
  opacity:1;border-color:rgba(255,255,255,.1);
  background:rgba(255,255,255,.05);
}
.ev-time{font-size:.62rem;font-family:monospace;color:var(--dim);width:34px;flex-shrink:0}
.ev-icon{font-size:.9rem;width:16px;text-align:center}
.ev-text{font-size:.75rem;line-height:1.3}
.ev-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-left:auto}

/* 图例 */
.legend{
  padding:8px 14px;border-top:1px solid var(--border);
  display:flex;flex-wrap:wrap;gap:8px;
  flex-shrink:0;
}
.leg{display:flex;align-items:center;gap:4px;font-size:.6rem;color:rgba(255,255,255,.3)}
.ldot{width:7px;height:7px;border-radius:50%}

/* 全局背景光晕 */
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 50% 50% at 25% 60%,rgba(255,45,85,.04),transparent 70%),
             radial-gradient(ellipse 40% 40% at 75% 30%,rgba(10,132,255,.04),transparent 70%);
}
</style>
</head>
<body>
<div class="glow"></div>

<!-- 真实音频（不显示控件） -->
<audio id="aud" src="songs_audio/watercolor.mp3" preload="auto" crossorigin="anonymous"></audio>

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-left">
    <div class="logo">🕺</div>
    <div>
      <div class="title">街舞音乐教学分析器</div>
      <div class="sub">实时频谱 · 鼓点标注 · 8拍计数</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <div class="song-info">
      <span class="song-name" id="song-name-badge">Katuchat · Watercolor</span>
    </div>
    <div class="bpm-badge" id="bpm-badge">— BPM</div>
  </div>
</div>

<!-- MAIN GRID -->
<div class="main">

  <!-- LEFT: 频谱 + 波形 -->
  <div class="left">
    <!-- 大频谱 -->
    <div class="spectrum-wrap" id="spec-wrap">
      <canvas id="spectrum-cv"></canvas>

      <!-- 教学提示 -->
      <div class="cue-banner" id="cue-banner">
        <span id="cue-icon">🎯</span>
        <span id="cue-text">点击 ▶ 开始播放</span>
      </div>

      <!-- 频率分区标注 -->
      <div class="freq-labels">
        <span class="freq-lbl" style="color:rgba(255,59,48,.5)">SUB BASS</span>
        <span class="freq-lbl" style="color:rgba(255,59,48,.5)">BASS / KICK</span>
        <span class="freq-lbl" style="color:rgba(255,159,10,.5)">LOW MID</span>
        <span class="freq-lbl" style="color:rgba(255,159,10,.5)">SNARE / VOCAL</span>
        <span class="freq-lbl" style="color:rgba(255,214,10,.5)">HIGH MID</span>
        <span class="freq-lbl" style="color:rgba(255,214,10,.5)">HI-HAT / AIR</span>
      </div>
    </div>

    <!-- 实时波形 + 进度 -->
    <div class="wf-section">
      <canvas id="wf-cv" onclick="seekByClick(event,this)"></canvas>
      <div class="playhead" id="playhead"></div>
      <div class="time-row">
        <span class="time-lbl" id="t-cur">0:00</span>
        <span class="time-lbl" id="t-total">3:33</span>
      </div>
    </div>

    <!-- 控制栏 -->
    <div class="ctrl-bar">
      <span class="cur-time" id="cur-big">0:00</span>

      <div class="ctrl-center">
        <button class="skip-btn" onclick="skipBeats(-8)" title="前8拍">⏮</button>
        <button class="skip-btn" onclick="skipBeats(-2)" title="前2拍">⏪</button>
        <button class="pbtn" id="pbtn" onclick="togglePlay()">▶</button>
        <button class="skip-btn" onclick="skipBeats(2)" title="后2拍">⏩</button>
        <button class="skip-btn" onclick="skipBeats(8)" title="后8拍">⏭</button>
      </div>

      <div class="ctrl-right">
        <div class="vol-wrap">
          🔊
          <input type="range" class="vol" id="vol-ctrl" min="0" max="1" step=".01" value="1"
            oninput="document.getElementById('aud').volume=this.value">
        </div>
        <div class="spd-group">
          <div class="spd" onclick="setSpd(.5,this)">½x</div>
          <div class="spd" onclick="setSpd(.75,this)">¾x</div>
          <div class="spd on" onclick="setSpd(1,this)">1x</div>
        </div>
      </div>
    </div>
  </div><!-- /left -->

  <!-- RIGHT PANEL -->
  <div class="right">

    <!-- 8拍格子 -->
    <div class="beat-section">
      <div class="section-label">
        <span>8 BEAT COUNTER</span>
        <span class="bar-counter">第 <span id="bar-num">—</span> 组</span>
      </div>
      <div class="beats-grid" id="beats-grid">
        <div class="bx" id="bx0">1</div>
        <div class="bx" id="bx1">2</div>
        <div class="bx" id="bx2">3</div>
        <div class="bx" id="bx3">4</div>
        <div class="bx" id="bx4">5</div>
        <div class="bx" id="bx5">6</div>
        <div class="bx" id="bx6">7</div>
        <div class="bx" id="bx7">8</div>
      </div>
    </div>

    <!-- VU 电平表（低/中/高频） -->
    <div class="vu-section">
      <div class="section-label">FREQUENCY LEVEL</div>
      <div class="vu-row">
        <span class="vu-label" style="color:var(--kick)">SUB</span>
        <div class="vu-bar-wrap">
          <div class="vu-bar" id="vu-sub" style="background:linear-gradient(90deg,#ff3b30,#ff6b30)"></div>
          <div class="vu-peak" id="pk-sub"></div>
        </div>
      </div>
      <div class="vu-row">
        <span class="vu-label" style="color:var(--kick)">KICK</span>
        <div class="vu-bar-wrap">
          <div class="vu-bar" id="vu-kick" style="background:linear-gradient(90deg,#ff3b30,#ff9f0a)"></div>
          <div class="vu-peak" id="pk-kick"></div>
        </div>
      </div>
      <div class="vu-row">
        <span class="vu-label" style="color:var(--snare)">MID</span>
        <div class="vu-bar-wrap">
          <div class="vu-bar" id="vu-mid" style="background:linear-gradient(90deg,#ff9f0a,#ffd60a)"></div>
          <div class="vu-peak" id="pk-mid"></div>
        </div>
      </div>
      <div class="vu-row">
        <span class="vu-label" style="color:var(--vocal)">VOCAL</span>
        <div class="vu-bar-wrap">
          <div class="vu-bar" id="vu-vocal" style="background:linear-gradient(90deg,#30d158,#34c759)"></div>
          <div class="vu-peak" id="pk-vocal"></div>
        </div>
      </div>
      <div class="vu-row">
        <span class="vu-label" style="color:var(--hihat)">HI</span>
        <div class="vu-bar-wrap">
          <div class="vu-bar" id="vu-hi" style="background:linear-gradient(90deg,#ffd60a,#fff)"></div>
          <div class="vu-peak" id="pk-hi"></div>
        </div>
      </div>
    </div>

    <!-- 事件日志 -->
    <div class="events-section">
      <div class="ev-title">教学事件 · TIMELINE</div>
      <div id="ev-list"></div>
    </div>

    <!-- 图例 -->
    <div class="legend">
      <div class="leg"><div class="ldot" style="background:var(--kick)"></div>Kick 底鼓</div>
      <div class="leg"><div class="ldot" style="background:var(--snare)"></div>Snare 打ci</div>
      <div class="leg"><div class="ldot" style="background:var(--hihat)"></div>Hi-Hat 踩镲</div>
      <div class="leg"><div class="ldot" style="background:var(--vocal)"></div>Vocal 人声</div>
      <div class="leg"><div class="ldot" style="background:var(--sfx)"></div>FX 音效</div>
    </div>

  </div><!-- /right -->
</div><!-- /main -->

<script>
// ══════════════════════════════════════════════════════════════
// 核心：Web Audio API 实时频谱分析
// ══════════════════════════════════════════════════════════════

const AUD = document.getElementById('aud');
let audioCtx, analyser, srcNode, freqData, timeData;
let FFT = 2048;           // FFT 大小（越大频率分辨率越高）
let _ctxReady = false;

function initAudioContext() {
  if (_ctxReady) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = FFT;
    analyser.smoothingTimeConstant = 0.75;  // 平滑系数（0=无平滑，1=完全平滑）
    analyser.minDecibels = -90;
    analyser.maxDecibels = -10;

    srcNode = audioCtx.createMediaElementSource(AUD);
    srcNode.connect(analyser);
    analyser.connect(audioCtx.destination);

    freqData = new Uint8Array(analyser.frequencyBinCount);
    timeData  = new Uint8Array(analyser.fftSize);
    _ctxReady = true;
    console.log('✅ AudioContext 初始化成功，FFT bins:', analyser.frequencyBinCount);
  } catch(e) {
    console.error('AudioContext init failed:', e);
  }
}

// ── Canvas 尺寸管理 ──────────────────────────────────────────
const specCv = document.getElementById('spectrum-cv');
const wfCv   = document.getElementById('wf-cv');
let specW, specH, wfW, wfH;

function resizeAll() {
  const dpr = devicePixelRatio || 1;
  const wrap = document.getElementById('spec-wrap');
  specW = wrap.offsetWidth; specH = wrap.offsetHeight;
  specCv.width  = specW * dpr; specCv.height = specH * dpr;
  specCv.style.width  = specW + 'px';
  specCv.style.height = specH + 'px';

  wfW = wfCv.offsetWidth; wfH = wfCv.offsetHeight;
  wfCv.width  = wfW * dpr; wfCv.height = wfH * dpr;
  wfCv.style.width  = wfW + 'px';
  wfCv.style.height = wfH + 'px';
}
window.addEventListener('resize', () => { resizeAll(); drawStaticWaveform(); });

// ── 节拍数据（从 JSON 加载） ─────────────────────────────────
let BEATS = [], BAR_STARTS = [], BIG_EVENTS = [], DRUM_KICK = [], DRUM_SNARE = [], DRUM_HIHAT = [];
let BPM = 129.2, TOTAL = 213, MUSIC_START = 0.05;

async function loadBeatsJSON() {
  try {
    const r = await fetch('beats/watercolor.json');
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    BPM   = d.bpm || 129.2;
    TOTAL = d.duration || 213;
    MUSIC_START = d.music_start || 0.05;
    BEATS      = d.beats || [];
    BAR_STARTS = d.bar_starts || [];
    DRUM_KICK  = (d.drum_events || {}).kick  || [];
    DRUM_SNARE = (d.drum_events || {}).snare || [];
    DRUM_HIHAT = (d.drum_events || {}).hihat || [];

    // 构建 BIG_EVENTS
    BIG_EVENTS = (d.events || []).filter(e => e.is_cue !== false).map((e,i) => ({
      ...e, idx: i, el: null
    }));

    document.getElementById('bpm-badge').textContent = BPM + ' BPM';
    if (d.artist && d.song) {
      document.getElementById('song-name-badge').textContent = `${d.artist} · ${d.song}`;
    }
    const durEl = document.getElementById('t-total');
    if (durEl) durEl.textContent = fmt(TOTAL);

    // 渲染事件日志
    buildEventLog();
    // 渲染静态波形
    drawStaticWaveform();
    console.log('✅ Beats JSON 加载完成，BPM=', BPM);
  } catch(e) {
    console.warn('Beats JSON 加载失败（本地直开正常）:', e.message);
    buildEventLog(); // 用空数据
  }
}

// ── 事件日志 ──────────────────────────────────────────────────
function buildEventLog() {
  const list = document.getElementById('ev-list');
  list.innerHTML = '';
  BIG_EVENTS.forEach((e, i) => {
    const el = document.createElement('div');
    el.className = 'ev-item';
    el.id = 'ev-' + i;
    el.innerHTML = `
      <span class="ev-time">${e.time.toFixed(1)}s</span>
      <span class="ev-icon">${e.icon || '🎵'}</span>
      <span class="ev-text">${e.desc || e.label || ''}</span>
      <div class="ev-dot" style="background:${e.color || '#888'}"></div>
    `;
    list.appendChild(el);
    e.el = el;
  });
}

// ── 静态波形（加载时绘制，播放时叠加实时波形） ──────────────
function drawStaticWaveform() {
  if (!wfW) return;
  const dpr = devicePixelRatio || 1;
  const ctx = wfCv.getContext('2d');
  const W = wfW * dpr, H = wfH * dpr;
  ctx.clearRect(0,0,W,H);

  // 背景
  ctx.fillStyle = '#030309';
  ctx.fillRect(0,0,W,H);

  if (BEATS.length === 0) return;

  // 用节拍数据画一条"密度图"作为静态背景波形
  const TOTAL_DUR = TOTAL || 213;

  // 先画一个基础波形
  ctx.strokeStyle = 'rgba(255,255,255,.06)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, H/2);
  for (let x = 0; x < W; x++) {
    const t = (x/W) * TOTAL_DUR;
    const v = Math.sin(t*40)*.18 + Math.sin(t*73)*.12 + Math.sin(t*17)*.08 + (Math.random()-.5)*.04;
    ctx.lineTo(x, H/2 + v*H*.4);
  }
  ctx.stroke();

  // 在 Kick 位置画竖线
  ctx.strokeStyle = 'rgba(255,59,48,.35)';
  ctx.lineWidth = 1;
  DRUM_KICK.forEach(t => {
    const x = (t / TOTAL_DUR) * W;
    ctx.beginPath(); ctx.moveTo(x, H*.2); ctx.lineTo(x, H*.8); ctx.stroke();
  });

  // Snare
  ctx.strokeStyle = 'rgba(255,159,10,.3)';
  DRUM_SNARE.forEach(t => {
    const x = (t / TOTAL_DUR) * W;
    ctx.beginPath(); ctx.moveTo(x, H*.3); ctx.lineTo(x, H*.7); ctx.stroke();
  });

  // 8拍起始竖线
  ctx.strokeStyle = 'rgba(255,110,199,.25)'; ctx.lineWidth = 1.5;
  ctx.setLineDash([2,4]);
  BAR_STARTS.forEach(t => {
    const x = (t / TOTAL_DUR) * W;
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
  });
  ctx.setLineDash([]);

  // 大事件菱形标记
  BIG_EVENTS.forEach(e => {
    if (!e.is_cue) return;
    const x = (e.time / TOTAL_DUR) * W;
    const col = e.color || '#fff';
    ctx.fillStyle = col;
    ctx.shadowColor = col; ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.moveTo(x, 3); ctx.lineTo(x+4, H/2); ctx.lineTo(x, H-3); ctx.lineTo(x-4, H/2);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
  });
}

// ══════════════════════════════════════════════════════════════
// 实时绘制：频谱 + VU 表
// ══════════════════════════════════════════════════════════════

// 峰值保持
const peaks = { sub:0, kick:0, mid:0, vocal:0, hi:0 };
const peakDecay = 0.015;

// 上一帧的闪光状态
let kickFlash = 0, snareFlash = 0, hihatFlash = 0;

function drawSpectrum() {
  const dpr = devicePixelRatio || 1;
  const ctx = specCv.getContext('2d');
  const W = specW * dpr, H = specH * dpr;

  ctx.clearRect(0,0,W,H);

  // 背景
  ctx.fillStyle = '#04040c';
  ctx.fillRect(0,0,W,H);

  if (!_ctxReady || !analyser) {
    // 未初始化：画静态占位
    ctx.fillStyle = 'rgba(255,255,255,.03)';
    for (let i=0; i<64; i++) {
      const h = (Math.sin(i*.3+Date.now()*.001)*.3+.5) * H*.15;
      const x = i*(W/64);
      ctx.fillRect(x+1, H-h, W/64-2, h);
    }
    return;
  }

  analyser.getByteFrequencyData(freqData);
  analyser.getByteTimeDomainData(timeData);

  const bins = analyser.frequencyBinCount;  // FFT/2
  const sampleRate = audioCtx.sampleRate;
  const binHz = sampleRate / FFT;           // 每个 bin 对应的 Hz

  // ── 频率区段定义（Hz）──
  const zones = [
    { name:'sub',   lo:20,    hi:80,   color:'#ff2d55', glow:'rgba(255,45,85,{a})' },
    { name:'kick',  lo:80,    hi:250,  color:'#ff3b30', glow:'rgba(255,59,48,{a})' },
    { name:'snare', lo:250,   hi:800,  color:'#ff9f0a', glow:'rgba(255,159,10,{a})' },
    { name:'low',   lo:800,   hi:2000, color:'#ffd60a', glow:'rgba(255,214,10,{a})' },
    { name:'mid',   lo:2000,  hi:5000, color:'#34c759', glow:'rgba(52,199,89,{a})' },
    { name:'hi',    lo:5000,  hi:12000,color:'#30d158', glow:'rgba(48,209,88,{a})' },
    { name:'air',   lo:12000, hi:20000,color:'#a8d8ea', glow:'rgba(168,216,234,{a})' },
  ];

  // ── 按区段分组计算平均能量 ──
  function binRange(loHz, hiHz) {
    const loB = Math.floor(loHz / binHz);
    const hiB = Math.min(Math.ceil(hiHz / binHz), bins-1);
    return { lo: loB, hi: hiB };
  }
  function avgEnergy(loHz, hiHz) {
    const { lo, hi } = binRange(loHz, hiHz);
    if (hi <= lo) return 0;
    let sum = 0;
    for (let i=lo; i<=hi; i++) sum += freqData[i];
    return sum / ((hi - lo + 1) * 255);
  }

  // 各区段能量
  const eSub   = avgEnergy(20, 80);
  const eKick  = avgEnergy(80, 250);
  const eSnare = avgEnergy(250, 800);
  const eMid   = avgEnergy(800, 3000);
  const eVocal = avgEnergy(3000, 6000);
  const eHi    = avgEnergy(6000, 16000);

  // Kick/Snare/HiHat 检测（阈值触发闪光）
  const KICK_THRESH  = 0.55;
  const SNARE_THRESH = 0.40;
  const HIHAT_THRESH = 0.30;
  if (eKick > KICK_THRESH)   kickFlash  = 12;
  if (eSnare > SNARE_THRESH) snareFlash = 8;
  if (eHi    > HIHAT_THRESH) hihatFlash = 5;
  if (kickFlash  > 0) kickFlash--;
  if (snareFlash > 0) snareFlash--;
  if (hihatFlash > 0) hihatFlash--;

  // ── 频谱背景闪光（Kick 时整体泛红光） ──
  if (kickFlash > 0) {
    const alpha = kickFlash / 12 * 0.12;
    ctx.fillStyle = `rgba(255,59,48,${alpha})`;
    ctx.fillRect(0,0,W,H);
  }
  if (snareFlash > 0) {
    const alpha = snareFlash / 8 * 0.08;
    ctx.fillStyle = `rgba(255,159,10,${alpha})`;
    ctx.fillRect(0,0,W,H);
  }

  // ── 绘制频谱柱 ──────────────────────────────────────
  // 用对数刻度分布柱子（低频柱宽，高频柱窄，更符合听感）
  const BAR_COUNT = 120;
  const barW = W / BAR_COUNT - 1.5;

  for (let i = 0; i < BAR_COUNT; i++) {
    // 对数映射：让低频占更多空间
    const ratio = i / BAR_COUNT;
    const freqHz = 20 * Math.pow(20000/20, ratio);  // 20Hz ~ 20kHz 对数
    const binIdx = Math.min(Math.round(freqHz / binHz), bins-1);

    // 取该 bin 周围几个的最大值（平滑）
    let maxVal = 0;
    for (let d=-2; d<=2; d++) {
      const b = Math.max(0, Math.min(bins-1, binIdx+d));
      maxVal = Math.max(maxVal, freqData[b]);
    }
    const normVal = maxVal / 255;
    const barH = normVal * H * 0.88;

    const x = i * (W / BAR_COUNT);

    // 颜色：按频率区段着色
    let colTop, colBot;
    if (freqHz < 80) {
      colTop = '#ff2d55'; colBot = '#990011';
    } else if (freqHz < 250) {
      colTop = '#ff3b30'; colBot = '#cc1100';
    } else if (freqHz < 800) {
      colTop = '#ff9f0a'; colBot = '#cc6600';
    } else if (freqHz < 2000) {
      colTop = '#ffd60a'; colBot = '#997700';
    } else if (freqHz < 6000) {
      colTop = '#34c759'; colBot = '#1a6e2e';
    } else if (freqHz < 12000) {
      colTop = '#30d158'; colBot = '#0e6e2e';
    } else {
      colTop = '#a8d8ea'; colBot = '#446677';
    }

    const grad = ctx.createLinearGradient(0, H - barH, 0, H);
    grad.addColorStop(0, colTop);
    grad.addColorStop(1, colBot + '88');

    // 发光效果（能量高时更亮）
    if (normVal > 0.5) {
      ctx.shadowColor = colTop;
      ctx.shadowBlur  = normVal * 18;
    } else {
      ctx.shadowBlur = 0;
    }

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.roundRect(x, H - barH, barW, barH, 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // 顶部亮点
    if (barH > 3) {
      ctx.fillStyle = colTop + 'cc';
      ctx.fillRect(x, H - barH, barW, 2);
    }
  }

  // ── 时域波形叠加（实时波形，叠在频谱上方） ──────────────
  ctx.save();
  ctx.globalAlpha = 0.6;
  const wfGrad = ctx.createLinearGradient(0,0,W,0);
  wfGrad.addColorStop(0,   'rgba(255,255,255,.0)');
  wfGrad.addColorStop(0.15,'rgba(255,255,255,.5)');
  wfGrad.addColorStop(0.85,'rgba(255,255,255,.5)');
  wfGrad.addColorStop(1,   'rgba(255,255,255,.0)');
  ctx.strokeStyle = wfGrad;
  ctx.lineWidth = 1.5;
  ctx.shadowColor = '#fff'; ctx.shadowBlur = 4;
  ctx.beginPath();
  const sliceW = W / timeData.length;
  for (let i=0; i<timeData.length; i++) {
    const v = (timeData[i]/128 - 1) * 0.35;
    const x = i * sliceW;
    const y = H/2 + v * H * 0.4;
    i === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  }
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.restore();

  // ── VU 电平更新 ──────────────────────────────────────────
  updateVU('vu-sub',   'pk-sub',   eSub,   'sub');
  updateVU('vu-kick',  'pk-kick',  eKick,  'kick');
  updateVU('vu-mid',   'pk-mid',   eSnare, 'mid');
  updateVU('vu-vocal', 'pk-vocal', eMid,   'vocal');
  updateVU('vu-hi',    'pk-hi',    eHi,    'hi');

  // ── 8拍计数（用时间戳） ──────────────────────────────────
  updateBeatGrid();
}

function updateVU(barId, peakId, val, key) {
  const bar  = document.getElementById(barId);
  const peak = document.getElementById(peakId);
  if (!bar || !peak) return;

  const pct = Math.min(val * 100 * 1.5, 100);  // 放大 1.5x 让电平表更活跃
  bar.style.width = pct + '%';

  if (pct > peaks[key] * 100) {
    peaks[key] = pct / 100;
    peak.style.left = pct + '%';
  } else {
    peaks[key] = Math.max(0, peaks[key] - peakDecay);
    peak.style.left = (peaks[key] * 100) + '%';
  }
}

// ── 8拍格子 ──────────────────────────────────────────────────
let curBeat = -1, curBar = -1;

function updateBeatGrid() {
  const ct = AUD.currentTime;
  if (BEATS.length === 0 || ct < MUSIC_START) {
    if (curBeat >= 0) {
      document.getElementById('bx'+curBeat)
        ?.classList.remove('on','kick','snare','hihat','bar1');
      curBeat = -1;
    }
    document.getElementById('bar-num').textContent = '—';
    return;
  }

  // 二分查找当前拍
  let lo=0, hi=BEATS.length-1;
  while (lo<=hi) {
    const mid=(lo+hi)>>1;
    if (BEATS[mid]<=ct) lo=mid+1; else hi=mid-1;
  }
  const bi = hi;
  if (bi < 0) return;

  const nb   = bi % 8;
  const nbar = Math.floor(bi / 8);

  if (nb !== curBeat) {
    if (curBeat >= 0) {
      document.getElementById('bx'+curBeat)
        ?.classList.remove('on','kick','snare','hihat','bar1');
    }
    curBeat = nb;
    const el = document.getElementById('bx'+curBeat);
    if (!el) return;
    el.classList.add('on');

    const bt = BEATS[bi];
    const isKick  = DRUM_KICK.some(t  => Math.abs(t-bt) < 0.08);
    const isSnare = DRUM_SNARE.some(t => Math.abs(t-bt) < 0.08);
    const isHH    = DRUM_HIHAT.some(t => Math.abs(t-bt) < 0.08);

    if (nb === 0) el.classList.add('bar1');
    else if (isKick)  el.classList.add('kick');
    else if (isSnare) el.classList.add('snare');
    else if (isHH)    el.classList.add('hihat');
  }

  if (nbar !== curBar) {
    curBar = nbar;
    document.getElementById('bar-num').textContent = curBar + 1;
  }
}

// ── 教学提示 Banner ──────────────────────────────────────────
const BANNER_STYLES = {
  bass:  { bg:'rgba(10,132,255,.18)',  border:'rgba(10,132,255,.5)',  col:'#4fc3f7' },
  snare: { bg:'rgba(255,159,10,.18)', border:'rgba(255,159,10,.5)', col:'#ff9f0a' },
  vocal: { bg:'rgba(48,209,88,.18)',  border:'rgba(48,209,88,.5)',  col:'#30d158' },
  bar1:  { bg:'rgba(255,110,199,.18)',border:'rgba(255,110,199,.5)',col:'#ff6ec7' },
  sfx:   { bg:'rgba(191,90,242,.18)', border:'rgba(191,90,242,.5)', col:'#bf5af2' },
  hihat: { bg:'rgba(255,214,10,.14)', border:'rgba(255,214,10,.4)', col:'#ffd60a' },
  vinyl: { bg:'rgba(255,255,255,.06)',border:'rgba(255,255,255,.2)',col:'#aaa' },
  dflt:  { bg:'rgba(0,0,0,.5)',       border:'rgba(255,255,255,.1)',col:'rgba(255,255,255,.4)' },
};

let lastEvIdx = -1;

function updateCueBanner() {
  const ct = AUD.currentTime;
  let bestEv = null, bestDiff = Infinity;

  BIG_EVENTS.forEach(e => {
    const diff = ct - e.time;
    if (diff >= 0 && diff < 3.5 && diff < bestDiff) {
      bestDiff = diff; bestEv = e;
    }
  });

  const banner = document.getElementById('cue-banner');
  if (bestEv) {
    const s = BANNER_STYLES[bestEv.type] || BANNER_STYLES.dflt;
    banner.style.background  = s.bg;
    banner.style.borderColor = s.border;
    banner.style.color       = s.col;
    banner.classList.add('active');
    document.getElementById('cue-icon').textContent = bestEv.icon || '🎵';
    document.getElementById('cue-text').textContent = bestEv.desc || bestEv.label || '';

    // 日志高亮
    if (bestEv.idx !== lastEvIdx) {
      lastEvIdx = bestEv.idx;
      document.querySelectorAll('.ev-item').forEach(el => {
        el.classList.remove('active');
        const t = parseFloat(el.querySelector('.ev-time').textContent);
        if (t < ct) el.classList.add('passed');
      });
      bestEv.el?.classList.add('active');
      bestEv.el?.scrollIntoView({ behavior:'smooth', block:'nearest' });
    }
  } else if (!AUD.paused) {
    const s = BANNER_STYLES.dflt;
    banner.style.background  = s.bg;
    banner.style.borderColor = s.border;
    banner.style.color       = s.col;
    banner.classList.remove('active');
    document.getElementById('cue-icon').textContent = '🎯';
    document.getElementById('cue-text').textContent = ct < MUSIC_START ? '等待音乐进入...' : '感受节拍 · 准备起动';
  }
}

// ── 播放头 + 时间 ────────────────────────────────────────────
function updatePlayhead() {
  const ct  = AUD.currentTime;
  const dur = AUD.duration || TOTAL;
  const pct = dur > 0 ? ct / dur : 0;
  document.getElementById('playhead').style.left = pct * 100 + '%';
  const fs = fmt(ct);
  document.getElementById('t-cur').textContent  = fs;
  document.getElementById('cur-big').textContent = fs;
}

// ══════════════════════════════════════════════════════════════
// 主渲染循环
// ══════════════════════════════════════════════════════════════
let raf;
function loop() {
  drawSpectrum();
  updatePlayhead();
  updateCueBanner();
  raf = requestAnimationFrame(loop);
}

// ── 播放控制 ──────────────────────────────────────────────────
let _playing = false;

function togglePlay() {
  _playing ? doPause() : doPlay();
}
function doPlay() {
  initAudioContext();  // 首次点击时初始化（浏览器安全策略要求用户交互后）
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  AUD.play().catch(e => console.error('play failed:', e));
  _playing = true;
  document.getElementById('pbtn').textContent = '⏸';
}
function doPause() {
  AUD.pause();
  _playing = false;
  document.getElementById('pbtn').textContent = '▶';
}

AUD.addEventListener('ended', () => {
  _playing = false;
  document.getElementById('pbtn').textContent = '▶';
});

function skipBeats(n) {
  const beatDur = BEATS.length > 1 ? (BEATS[1]-BEATS[0]) : (60/BPM);
  AUD.currentTime = Math.max(0, Math.min(AUD.duration||TOTAL, AUD.currentTime + n*beatDur));
}

function seekByClick(e, el) {
  const r = el.getBoundingClientRect();
  const dpr = devicePixelRatio || 1;
  const pct = (e.clientX - r.left) / r.width;
  AUD.currentTime = pct * (AUD.duration || TOTAL);
}

function setSpd(s, btn) {
  AUD.playbackRate = s;
  document.querySelectorAll('.spd').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
}

function fmt(s) {
  if (!isFinite(s)) return '0:00';
  return Math.floor(s/60) + ':' + (Math.floor(s%60)+'').padStart(2,'0');
}

// ── 初始化 ────────────────────────────────────────────────────
window.addEventListener('load', async () => {
  resizeAll();
  await loadBeatsJSON();
  loop();  // 启动渲染循环
});

// 音频时长加载后更新
AUD.addEventListener('loadedmetadata', () => {
  TOTAL = AUD.duration;
  document.getElementById('t-total').textContent = fmt(AUD.duration);
});
</script>
