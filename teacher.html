<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🕺 街舞音乐教学 · AI 多轨分析</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
:root{--bg:#05050e;--border:rgba(255,255,255,.07);--dim:#555;--txt:#e8e8f2}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif}
body{display:flex;flex-direction:column}

/* ═══ 全屏 HIT 闪光叠层 ═══ */
.hit-flash{position:fixed;inset:0;z-index:100;pointer-events:none;opacity:0}
.hit-flash.fire{animation:hitPulse .3s ease-out forwards}
@keyframes hitPulse{0%{opacity:1}100%{opacity:0}}
.edge-glow{position:fixed;inset:0;z-index:99;pointer-events:none;opacity:0}
.edge-glow.fire{animation:edgeFade .45s ease-out forwards}
@keyframes edgeFade{0%{opacity:1}100%{opacity:0}}

/* ═══ 时间线横幅通知 ═══ */
.banner-layer{position:absolute;inset:0;pointer-events:none;z-index:10;overflow:hidden}
.banner{
  position:absolute;left:130px;right:0;
  display:flex;align-items:center;gap:8px;
  padding:0 14px;height:100%;
  opacity:0;pointer-events:none;
}
.banner.show{animation:bannerFly .5s cubic-bezier(.22,1,.36,1) forwards}
.banner.hide{animation:bannerFade .3s ease-in forwards}
@keyframes bannerFly{
  0%{opacity:0;transform:translateX(-40px)}
  100%{opacity:1;transform:translateX(0)}
}
@keyframes bannerFade{
  0%{opacity:1}100%{opacity:0}
}
.banner-icon{font-size:1.1rem;flex-shrink:0}
.banner-text{font-size:.78rem;font-weight:700;white-space:nowrap}
.banner-sub{font-size:.55rem;opacity:.65;margin-left:4px;white-space:nowrap}

/* 浮动气泡（重大事件专用） */
.bubble-layer{position:absolute;left:130px;right:0;top:0;bottom:0;pointer-events:none;z-index:15;overflow:hidden}
.bubble{
  position:absolute;
  display:flex;align-items:center;gap:6px;
  padding:5px 12px 5px 8px;border-radius:20px;
  font-size:.75rem;font-weight:700;white-space:nowrap;
  border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(10px);
  opacity:0;
}
.bubble.pop{animation:bubblePop .6s cubic-bezier(.175,.885,.32,1.275) forwards}
.bubble.fade{animation:bubbleFade .3s ease-in forwards}
@keyframes bubblePop{
  0%{opacity:0;transform:translateY(8px) scale(.85)}
  60%{opacity:1;transform:translateY(-3px) scale(1.04)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes bubbleFade{
  0%{opacity:1}100%{opacity:0;transform:translateY(-6px)}
}

/* ═══ 选歌抽屉 ═══ */
.song-drawer{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.75);backdrop-filter:blur(20px);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s}
.song-drawer.open{opacity:1;pointer-events:auto}
.song-box{
  width:400px;max-height:70vh;overflow-y:auto;
  background:rgba(10,10,24,.98);border:1px solid rgba(255,255,255,.1);
  border-radius:16px;padding:20px;
  transform:translateY(20px);transition:transform .2s}
.song-drawer.open .song-box{transform:translateY(0)}
.song-box-title{font-size:.9rem;font-weight:700;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.song-close{cursor:pointer;font-size:1rem;color:var(--dim);padding:4px 8px;border-radius:6px;
  border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);transition:.1s}
.song-close:hover{color:#fff;border-color:rgba(255,255,255,.2)}
.song-item{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;
  cursor:pointer;border:1px solid transparent;transition:all .12s;margin-bottom:4px}
.song-item:hover{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.08)}
.song-item.active{background:rgba(255,110,199,.08);border-color:rgba(255,110,199,.25)}
.song-art{width:40px;height:40px;border-radius:8px;
  background:linear-gradient(135deg,#ff3b30,#bf5af2);
  display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.song-info .song-name{font-size:.78rem;font-weight:700}
.song-info .song-meta{font-size:.58rem;color:var(--dim);margin-top:2px}
.song-play-btn{margin-left:auto;padding:4px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.05);font-size:.62rem;font-weight:600;cursor:pointer;color:rgba(255,255,255,.5)}
.song-item.active .song-play-btn{background:rgba(255,110,199,.12);border-color:#ff6ec7;color:#ff6ec7}

/* ═══ HUD 顶栏 ═══ */
.hud{
  display:flex;align-items:stretch;
  background:rgba(5,5,14,.95);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);flex-shrink:0;z-index:20;height:74px;
}
.hud-info{width:186px;display:flex;flex-direction:column;justify-content:center;
  padding:0 10px 0 12px;border-right:1px solid var(--border);flex-shrink:0;gap:4px}
.hud-song-row{display:flex;align-items:center;gap:6px}
.hud-logo{width:24px;height:24px;border-radius:6px;flex-shrink:0;
  background:linear-gradient(135deg,#ff3b30,#bf5af2);
  display:flex;align-items:center;justify-content:center;font-size:.72rem;
  box-shadow:0 0 10px rgba(255,59,48,.4)}
.hud-song-name{font-size:.76rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.song-btn{margin-left:auto;padding:2px 7px;border-radius:6px;font-size:.52rem;font-weight:600;
  border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);
  color:rgba(255,255,255,.4);cursor:pointer;transition:.1s;flex-shrink:0}
.song-btn:hover{color:#fff;border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.08)}
.hud-meta{display:flex;gap:5px}
.hud-chip{padding:1px 6px;border-radius:7px;font-size:.58rem;font-weight:600;
  border:1px solid rgba(255,255,255,.1)}
.hud-chip-b{background:rgba(255,59,48,.08);border-color:rgba(255,59,48,.2);color:#ff3b30}
.hud-chip-k{background:rgba(10,132,255,.08);border-color:rgba(10,132,255,.2);color:#0a84ff}
.hud-chip-g{background:rgba(255,110,199,.08);border-color:rgba(255,110,199,.2);color:#ff6ec7}

.hud-center{flex:1;display:flex;align-items:center;justify-content:center;gap:14px;padding:0 16px}

/* 8 BEAT + and 拍 */
.beat-panel{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0}
.beat-title{font-size:.48rem;color:var(--dim);text-transform:uppercase;letter-spacing:1px;
  display:flex;align-items:center;gap:6px}
.bar-num{color:#ff6ec7;font-weight:700;font-size:.6rem}
.bgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.bx{width:34px;height:34px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:.82rem;font-weight:800;background:rgba(255,255,255,.025);
  border:2px solid rgba(255,255,255,.06);color:rgba(255,255,255,.12);transition:all .06s}
.bx.on{color:#fff;transform:scale(1.12)}
.bx.kick.on{background:rgba(255,59,48,.35);border-color:#ff3b30;box-shadow:0 0 14px rgba(255,59,48,.6)}
.bx.snare.on{background:rgba(255,159,10,.3);border-color:#ff9f0a;box-shadow:0 0 10px rgba(255,159,10,.5)}
.bx.hihat.on{background:rgba(255,214,10,.2);border-color:#ffd60a;box-shadow:0 0 8px rgba(255,214,10,.4)}
.bx.bar1.on{background:rgba(255,110,199,.3);border-color:#ff6ec7;box-shadow:0 0 14px rgba(255,110,199,.6)}
/* and 拍细分行 */
.and-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;margin-top:2px}
.ax{height:12px;border-radius:3px;display:grid;grid-template-columns:repeat(4,1fr);gap:1px}
.ax-sub{border-radius:2px;background:rgba(255,255,255,.08);transition:background .06s;
  font-size:.38rem;color:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;
  overflow:hidden;user-select:none;line-height:1}
.ax-sub.on1{background:#ff3b30;color:#fff;box-shadow:0 0 4px #ff3b30aa}
.ax-sub.one{background:#ff9f0a;color:#fff;box-shadow:0 0 4px #ff9f0aaa}
.ax-sub.onaand{background:#30d158;color:#fff;box-shadow:0 0 4px #30d158aa}
.ax-sub.ona{background:#bf5af2;color:#fff;box-shadow:0 0 4px #bf5af2aa}
.beat-mode-btn{font-size:.46rem;cursor:pointer;color:var(--dim);padding:1px 5px;border-radius:4px;
  border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.03);transition:.1s;margin-left:4px}
.beat-mode-btn:hover{color:#fff;border-color:rgba(255,255,255,.15)}
.beat-mode-btn.active{color:#ff6ec7;border-color:#ff6ec7;background:rgba(255,110,199,.1)}

/* 教学提示（大字居中） */
.cue-panel{
  flex:1;max-width:360px;padding:7px 14px;border-radius:10px;
  background:rgba(0,0,0,.4);border:1.5px solid rgba(255,255,255,.06);
  display:flex;align-items:center;gap:10px;transition:all .15s;min-width:0}
.cue-icon{font-size:1.5rem;flex-shrink:0}
.cue-text{font-size:.95rem;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cue-sub{font-size:.58rem;color:rgba(255,255,255,.4);margin-top:1px;font-weight:400}

/* 舞种卡 */
.dance-panel{width:155px;flex-shrink:0;padding:6px 10px;border-radius:8px;
  background:rgba(255,110,199,.06);border:1px solid rgba(255,110,199,.15);
  display:flex;flex-direction:column;justify-content:center;gap:2px}
.dance-style{font-size:.5rem;color:#ff6ec7;font-weight:700;text-transform:uppercase;letter-spacing:.8px}
.dance-move-name{font-size:.72rem;font-weight:700;line-height:1.2}
.dance-move-tip{font-size:.52rem;color:rgba(255,255,255,.45);line-height:1.3}

/* ═══ HIT 指示器条 ═══ */
.hit-bar{height:4px;display:flex;flex-shrink:0;background:rgba(0,0,0,.6)}
.hit-seg{flex:1;opacity:0}
.hit-seg.active{animation:hitSegPulse .35s ease-out forwards}
@keyframes hitSegPulse{0%{opacity:1}60%{opacity:.7}100%{opacity:0}}

/* ═══ Stem 混音控制条 ═══ */
.mixer{display:flex;align-items:center;gap:3px;padding:3px 8px;
  border-bottom:1px solid var(--border);flex-shrink:0;background:rgba(5,5,14,.8)}
.mx-btn{
  padding:2px 8px;border-radius:5px;font-size:.6rem;font-weight:600;cursor:pointer;
  border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);
  color:rgba(255,255,255,.45);transition:all .1s;display:flex;align-items:center;gap:3px}
.mx-btn.on{color:#fff}
.mx-btn .dot{width:6px;height:6px;border-radius:50%}
.mx-btn.muted{opacity:.3;text-decoration:line-through}
.mx-btn.solo{border-color:#ffd60a;color:#ffd60a;background:rgba(255,214,10,.1)}
.mx-label{font-size:.5rem;color:var(--dim);font-weight:600}

/* ═══ 多轨 DAW ═══ */
.daw-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.daw{flex:1;overflow-y:auto;overflow-x:hidden;background:#020208;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.06) transparent;position:relative}
.daw::-webkit-scrollbar{width:3px}
.daw::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px}

/* Stem 分组标题 */
.stem-hdr{
  display:flex;align-items:center;gap:8px;padding:3px 10px;
  background:rgba(255,255,255,.02);border-bottom:1px solid rgba(255,255,255,.04);
  position:sticky;top:0;z-index:5}
.stem-hdr-icon{font-size:.78rem}
.stem-hdr-name{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px}

/* 轨道行 */
.tr{display:flex;align-items:stretch;height:40px;border-bottom:1px solid rgba(255,255,255,.03);
  transition:background .08s;position:relative;overflow:hidden}
.tr:hover{background:rgba(255,255,255,.015)}
.tr.flash{background:rgba(255,255,255,.05)}
.tr.hit-glow{animation:trackHit .35s ease-out}
@keyframes trackHit{0%{background:rgba(255,255,255,.1)}100%{background:transparent}}

/* ★ 轨道标签 — 加宽加大，确保可读 */
.tr-label{width:130px;flex-shrink:0;display:flex;align-items:center;gap:6px;
  padding:0 8px 0 10px;border-right:1px solid rgba(255,255,255,.05);background:rgba(5,5,14,.6);
  z-index:3}
.tr-icon{font-size:.88rem;width:18px;text-align:center;flex-shrink:0}
.tr-name{font-size:.7rem;font-weight:700;line-height:1.2;white-space:nowrap}
.tr-hz{font-size:.48rem;color:rgba(255,255,255,.32);font-family:'SF Mono',monospace}

.tr-cv{flex:1;position:relative;overflow:hidden}
.tr-cv canvas{width:100%;height:100%;display:block}

/* 气泡叠加层（每行独立） */
.tr-overlay{position:absolute;left:130px;right:0;top:0;bottom:0;pointer-events:none;z-index:8;overflow:hidden}
.tr-bubble{
  position:absolute;top:50%;transform:translateY(-50%);
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 10px 3px 7px;border-radius:14px;
  font-size:.68rem;font-weight:700;white-space:nowrap;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(5,5,14,.85);backdrop-filter:blur(8px);
  opacity:0;pointer-events:none;left:8px;
}
.tr-bubble.pop{animation:trBubblePop .5s cubic-bezier(.175,.885,.32,1.275) forwards}
.tr-bubble.dismiss{animation:trBubbleDismiss .4s ease-in forwards}
@keyframes trBubblePop{
  0%{opacity:0;transform:translateY(calc(-50% + 6px)) scale(.85)}
  65%{opacity:1;transform:translateY(calc(-50% - 2px)) scale(1.03)}
  100%{opacity:1;transform:translateY(-50%) scale(1)}
}
@keyframes trBubbleDismiss{
  0%{opacity:1;transform:translateY(-50%)}
  100%{opacity:0;transform:translateY(calc(-50% - 8px))}
}

/* 大横幅（段落切换） */
.segment-banner{
  position:fixed;top:80px;left:50%;transform:translateX(-50%);
  padding:10px 30px;border-radius:12px;
  font-size:1.1rem;font-weight:800;
  border:1.5px solid rgba(255,255,255,.15);
  background:rgba(5,5,14,.92);backdrop-filter:blur(20px);
  z-index:50;pointer-events:none;
  opacity:0;white-space:nowrap;
}
.segment-banner.show{animation:segBannerShow .5s ease-out forwards}
.segment-banner.hide{animation:segBannerHide .4s ease-in forwards}
@keyframes segBannerShow{
  0%{opacity:0;transform:translateX(-50%) translateY(-12px) scale(.9)}
  100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
}
@keyframes segBannerHide{
  0%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
  100%{opacity:0;transform:translateX(-50%) translateY(-8px) scale(.96)}
}

/* ═══ 波形进度 ═══ */
.wf-row{height:48px;background:#020208;border-top:1px solid var(--border);position:relative;flex-shrink:0}
#wf-cv{width:100%;height:100%;display:block;cursor:pointer}
.ph{position:absolute;top:0;bottom:0;width:2px;left:0;background:rgba(255,255,255,.9);
  box-shadow:0 0 8px #fff;pointer-events:none;z-index:5}
.trow{position:absolute;bottom:3px;left:0;right:0;display:flex;justify-content:space-between;
  padding:0 8px;pointer-events:none}
.tlbl{font-size:.54rem;font-family:monospace;color:rgba(255,255,255,.2)}

/* ═══ 事件右侧栏 ═══ */
.main{flex:1;display:flex;overflow:hidden}
.daw-col{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.right-col{width:200px;flex-shrink:0;display:flex;flex-direction:column;
  border-left:1px solid var(--border);background:rgba(3,3,10,.6);overflow:hidden}
.right-sec-title{font-size:.46rem;color:var(--dim);text-transform:uppercase;
  letter-spacing:.7px;padding:6px 8px 3px;border-bottom:1px solid var(--border)}
.ev-list{flex:1;overflow-y:auto;padding:4px 6px;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.06) transparent}
.ev-list::-webkit-scrollbar{width:2px}
.ev-item{display:flex;align-items:center;gap:4px;padding:3px 5px;border-radius:5px;
  margin-bottom:1px;opacity:.25;transition:all .15s;border:1px solid transparent;cursor:default}
.ev-item.passed{opacity:.4}
.ev-item.active{opacity:1;background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.08)}
.ev-t{font-size:.5rem;font-family:monospace;color:var(--dim);width:26px;flex-shrink:0}
.ev-i{font-size:.68rem;width:13px;text-align:center}
.ev-tx{font-size:.58rem;flex:1;line-height:1.2}
.ev-dot{width:4px;height:4px;border-radius:50%;flex-shrink:0}

/* ═══ 底部控制栏 ═══ */
.ctrl{height:42px;background:rgba(3,3,10,.95);border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 10px;flex-shrink:0}
.cc{display:flex;align-items:center;gap:5px}
.cr{display:flex;align-items:center;gap:5px}
.pbtn{width:34px;height:34px;border-radius:50%;border:none;
  background:linear-gradient(135deg,#ff3b30,#bf5af2);color:#fff;
  font-size:.78rem;cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 14px rgba(255,59,48,.35);transition:all .12s}
.pbtn:hover{transform:scale(1.08)}.pbtn:active{transform:scale(.93)}
.sk{width:24px;height:24px;border-radius:50%;border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.03);color:rgba(255,255,255,.3);
  font-size:.58rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.1s}
.sk:hover{background:rgba(255,255,255,.08);color:#fff}
.spds{display:flex;gap:2px}
.spd{padding:2px 6px;border-radius:4px;border:1px solid rgba(255,255,255,.06);
  background:rgba(255,255,255,.02);color:rgba(255,255,255,.22);font-size:.55rem;font-weight:600;cursor:pointer}
.spd.on{background:rgba(10,132,255,.12);border-color:#0a84ff;color:#0a84ff}
.vol-w{display:flex;align-items:center;gap:3px;font-size:.55rem;color:var(--dim)}
.vol{-webkit-appearance:none;width:52px;height:2px;border-radius:1px;background:rgba(255,255,255,.08);cursor:pointer;outline:none}
.vol::-webkit-slider-thumb{-webkit-appearance:none;width:8px;height:8px;border-radius:50%;background:#fff}
.ctxt{font-size:.6rem;font-family:monospace;color:rgba(255,255,255,.28);width:32px;text-align:center}

.glow{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 35% 35% at 18% 50%,rgba(255,45,85,.02),transparent),
    radial-gradient(ellipse 25% 25% at 82% 22%,rgba(10,132,255,.02),transparent)}
</style>
</head>
<body>
<div class="glow"></div>
<div class="hit-flash" id="hitFlash"></div>
<div class="edge-glow" id="edgeGlow"></div>
<div class="segment-banner" id="segBanner"></div>

<!-- 音频（初始默认 watercolor，换歌后由 JS 更新）-->
<audio id="aud" src="songs_audio/watercolor.mp3" preload="auto" crossorigin="anonymous"></audio>
<audio id="aud-drums" src="songs_audio/stems6/drums.mp3" preload="auto" crossorigin="anonymous"></audio>
<audio id="aud-bass" src="songs_audio/stems6/bass.mp3" preload="auto" crossorigin="anonymous"></audio>
<audio id="aud-guitar" src="songs_audio/stems6/guitar.mp3" preload="auto" crossorigin="anonymous"></audio>
<audio id="aud-piano" src="songs_audio/stems6/piano.mp3" preload="auto" crossorigin="anonymous"></audio>
<audio id="aud-vocals" src="songs_audio/stems6/vocals.mp3" preload="auto" crossorigin="anonymous"></audio>
<audio id="aud-other" src="songs_audio/stems6/other.mp3" preload="auto" crossorigin="anonymous"></audio>

<!-- 选歌抽屉 -->
<div class="song-drawer" id="songDrawer" onclick="closeSongDrawer(event)">
  <div class="song-box">
    <div class="song-box-title">
      🎵 选择曲目
      <span class="song-close" onclick="closeSongDrawer()">✕ 关闭</span>
    </div>
    <div id="songList"></div>
  </div>
</div>

<!-- HUD 顶栏 -->
<div class="hud">
  <div class="hud-info">
    <div class="hud-song-row">
      <div class="hud-logo">🕺</div>
      <span class="hud-song-name" id="cs">街舞教学</span>
      <span class="song-btn" onclick="openSongDrawer()">换歌 ▾</span>

<script>
// ══════════════════════════════════════════════════════════════
// Audio
// ══════════════════════════════════════════════════════════════
const AUD = document.getElementById('aud');
const STEM_AUDS = {
  drums:  document.getElementById('aud-drums'),
  bass:   document.getElementById('aud-bass'),
  guitar: document.getElementById('aud-guitar'),
  piano:  document.getElementById('aud-piano'),
  vocals: document.getElementById('aud-vocals'),
  other:  document.getElementById('aud-other'),
};
const stemMuted = {drums:false,bass:false,guitar:false,piano:false,vocals:false,other:false};
let soloActive=null;
let actx,stemAnalysers={},stemSrcs={};
const FFT=4096;
let _ready=false;
const DPR=devicePixelRatio||1;

function initAudio(){
  if(_ready)return;
  try{
    actx=new(window.AudioContext||window.webkitAudioContext)();
    AUD.volume=0;AUD.muted=true;
    ['drums','bass','guitar','piano','vocals','other'].forEach(n=>{
      const a=actx.createAnalyser();
      a.fftSize=FFT;a.smoothingTimeConstant=0.72;a.minDecibels=-95;a.maxDecibels=-5;
      const s=actx.createMediaElementSource(STEM_AUDS[n]);
      s.connect(a);a.connect(actx.destination);
      stemAnalysers[n]=a;stemSrcs[n]=s;
    });
    _ready=true;
  }catch(e){console.warn('AudioCtx:',e)}
}

// ══════════════════════════════════════════════════════════════
// 数据
// ══════════════════════════════════════════════════════════════
let BEATS=[],BAR_STARTS=[],EVENTS=[],TRACKS_CFG=[],STEMS={};
let BPM=129.2,TOTAL=213,MSTART=0.05;
let GENRE_INFO=null,DANCE_MOVES=[];
let ALL_SONGS=[];
let CUR_SONG_IDX=0;

const STEM_COLORS={drums:'#ff3b30',bass:'#0a84ff',vocals:'#30d158',other:'#ff6ec7',guitar:'#ff6b35',piano:'#bf5af2'};
const STEM_ICONS={drums:'🥁',bass:'🎸',vocals:'🎤',other:'💫',guitar:'🎸',piano:'🎹'};
const STEM_NAMES={drums:'DRUMS 鼓组',bass:'BASS 贝斯',vocals:'VOCALS 人声',other:'OTHER 其他',guitar:'GUITAR 吉他',piano:'PIANO 钢琴'};

// ══════════════════════════════════════════════════════════════
// 加载 JSON
// ══════════════════════════════════════════════════════════════
async function loadSongList(){
  try{
    const d=await(await fetch('beats/index.json')).json();
    ALL_SONGS=d.songs||[];
    buildSongList();
  }catch(e){ALL_SONGS=[{file:'watercolor.json',song:'Watercolor',artist:'Katuchat'}];}
}

async function loadSong(idx){
  CUR_SONG_IDX=idx;
  const meta=ALL_SONGS[idx];
  if(!meta)return;
  try{
    const d=await(await fetch('beats/'+meta.file)).json();
    BPM=d.bpm||129.2;TOTAL=d.duration||213;MSTART=d.music_start||0.05;
    BEATS=d.beats||[];BAR_STARTS=d.bar_starts||[];
    EVENTS=(d.events||[]).filter(e=>e.is_cue!==false).map((e,i)=>({...e,idx:i,el:null}));
    TRACKS_CFG=d.tracks_config||[];STEMS=d.stems||{};
    GENRE_INFO=d.genre||null;

    document.getElementById('cb').textContent=BPM+' BPM';
    document.getElementById('ck').textContent=d.key||'—';
    const artist=d.artist||meta.artist||'';
    const song=d.song||meta.song||'';
    document.getElementById('cs').textContent=`${artist} · ${song}`;
    document.getElementById('tt').textContent=fmt(TOTAL);

    // 更新曲风 chip
    if(GENRE_INFO){
      document.getElementById('cgenre').textContent=GENRE_INFO.short||GENRE_INFO.name||'—';
    }

    // 更新音频 src
    if(d.audio_files){
      AUD.src=d.audio_files.main||'';
      Object.keys(STEM_AUDS).forEach(k=>{
        if(d.audio_files[k])STEM_AUDS[k].src=d.audio_files[k];
      });
      Object.values(STEM_AUDS).forEach(a=>a.load());
    }

    buildDAW();buildLog();drawStaticWF();
    buildDanceMoves();
    updateSongListActive();
  }catch(e){console.warn('loadSong:',e);}
}

async function loadJSON(){
  await loadSongList();
  await loadSong(0);
}

// 选歌 UI
// ══════════════════════════════════════════════════════════════
function buildSongList(){
  const el=document.getElementById('songList');
  el.innerHTML='';
  ALL_SONGS.forEach((s,i)=>{
    const item=document.createElement('div');
    item.className='song-item'+(i===CUR_SONG_IDX?' active':'');
    item.id='si-'+i;
    item.innerHTML=`
      <div class="song-art">${s.icon||'🎵'}</div>
      <div class="song-info">
        <div class="song-name">${s.song||s.file}</div>
        <div class="song-meta">${s.artist||''} · ${s.bpm?s.bpm+' BPM':''} ${s.genre_short?'· '+s.genre_short:''}</div>
      </div>
      <span class="song-play-btn" onclick="selectSong(${i})">${i===CUR_SONG_IDX?'▶ 播放中':'选择'}</span>`;
    el.appendChild(item);

}

function updateSongListActive(){
  document.querySelectorAll('.song-item').forEach((el,i)=>{
    el.classList.toggle('active',i===CUR_SONG_IDX);
    const btn=el.querySelector('.song-play-btn');
    if(btn)btn.textContent=i===CUR_SONG_IDX?'▶ 播放中':'选择';
  });
}

function selectSong(i){
  pa();
  loadSong(i).then(()=>{closeSongDrawer();});
}

function openSongDrawer(){document.getElementById('songDrawer').classList.add('open');}
function closeSongDrawer(e){
  if(e&&e.target!==document.getElementById('songDrawer'))return;
  document.getElementById('songDrawer').classList.remove('open');
}

// ══════════════════════════════════════════════════════════════
// 舞步建议 (Lo-Fi / Chillhop 特化)
// ══════════════════════════════════════════════════════════════
const GENRE_MOVES={
  'lofi':[
    {move:'慵懒 Bounce',tip:'随 kick 做轻松上下律动，不要太用力'},
    {move:'Groove Step',tip:'重心左右移动，跟 bass 的节奏呼吸'},
    {move:'头部 Nod',tip:'Lo-Fi 标志动作：头轻轻点拍，像在听歌发呆'},
    {move:'Hand Wave',tip:'手臂慢 wave，配合 piano/synth 旋律走向'},
    {move:'Chill Rock',tip:'身体前后轻摇，感受低频温暖'},
  ],
  'hiphop':[
    {move:'Bounce 弹跳',tip:'跟 kick 做身体弹跳，snare 打到时停顿'},
    {move:'Running Man',tip:'4 拍一个循环，踩稳每个 kick'},
    {move:'Two Step',tip:'左右踏步，kick 踩实'},
    {move:'Body Rock',tip:'身体整体律动，重心跟随节拍'},
    {move:'Pop & Lock',tip:'snare 来了时做 pop 定格'},
  ],
  'default':[
    {move:'自由律动',tip:'跟随节拍感受音乐'},
    {move:'踏步移位',tip:'踩稳 kick，感受地板的力量'},
    {move:'手臂律动',tip:'配合旋律做流动手臂动作'},
  ]
};

function buildDanceMoves(){
  DANCE_MOVES=[];
  const genreKey=GENRE_INFO?.type||'default';
  const moves=GENRE_MOVES[genreKey]||GENRE_MOVES.default;

  const kickH=STEMS.kick?.hits||[];
  const bassH=STEMS.bass?.hits||[];
  const vocalH=STEMS.vocals?.hits||[];

  BAR_STARTS.forEach((t,i)=>{
    const end=BAR_STARTS[i+1]||TOTAL;
    const kicks=kickH.filter(h=>h>=t&&h<end).length;
    const bass=bassH.filter(h=>h>=t&&h<end).length;
    const voc=vocalH.filter(h=>h>=t&&h<end).length;

    // 根据段落特征选最合适的动作
    let moveIdx;
    if(voc>=3) moveIdx=3%moves.length;       // 人声多 → 手部动作
    else if(kicks>=6) moveIdx=0;             // 密集 kick → 律动
    else if(bass>=4) moveIdx=1%moves.length; // Bass 重 → 重心
    else moveIdx=i%moves.length;             // 轮转

    DANCE_MOVES.push({time:t,end,move:moves[moveIdx].move,tip:moves[moveIdx].tip,barIdx:i});
  });
}

// ══════════════════════════════════════════════════════════════
// 轨道气泡 & 大横幅
// ══════════════════════════════════════════════════════════════
// 记录每个事件上次触发时间
const evShownAt={};
let segBannerTimer=null;

function showTrackBubble(trackName, icon, text, color){
  const row=document.getElementById('tr-'+trackName);
  if(!row)return;
  let overlay=row.querySelector('.tr-overlay');
  if(!overlay){
    overlay=document.createElement('div');

  }

// ══════════════════════════════════════════════════════════════
// DAW
// ══════════════════════════════════════════════════════════════
let trackRows=[];

function buildDAW(){
  const daw=document.getElementById('daw');
  daw.innerHTML='';trackRows=[];

  const grouped={};
  TRACKS_CFG.forEach(tc=>{if(!grouped[tc.stem])grouped[tc.stem]=[];grouped[tc.stem].push(tc);});

  ['drums','bass','guitar','piano','vocals','other'].forEach(stemName=>{
    const tracks=grouped[stemName];
    if(!tracks||!tracks.length)return;
    const hdr=document.createElement('div');
    hdr.className='stem-hdr';
    hdr.style.borderLeft=`3px solid ${STEM_COLORS[stemName]}`;
    hdr.innerHTML=`<span class="stem-hdr-icon">${STEM_ICONS[stemName]}</span>
      <span class="stem-hdr-name" style="color:${STEM_COLORS[stemName]}">${STEM_NAMES[stemName]}</span>`;
    daw.appendChild(hdr);

    tracks.forEach(tc=>{
      const subData=STEMS[tc.name]||(STEMS[stemName]||{}).sub_bands?.[tc.name]||{};
      const row=document.createElement('div');
      row.className='tr';row.id='tr-'+tc.name;
      const label=document.createElement('div');
      label.className='tr-label';
      label.innerHTML=`<span class="tr-icon">${tc.icon}</span>
        <div><div class="tr-name" style="color:${tc.color}">${tc.label}</div>
        <div class="tr-hz">${tc.freq||'AI全频'}</div></div>`;
      const cvWrap=document.createElement('div');
      cvWrap.className='tr-cv';
      const cv=document.createElement('canvas');
      cvWrap.appendChild(cv);
      row.appendChild(label);row.appendChild(cvWrap);
      daw.appendChild(row);
      trackRows.push({cv,wrap:cvWrap,row,tc,stemName,subData,w:0,h:0,flashTimer:0});
    });
  });
  resizeTracks();
}

function resizeTracks(){
  trackRows.forEach(t=>{
    const w=t.wrap.offsetWidth,h=t.wrap.offsetHeight;
    t.cv.width=w*DPR;t.cv.height=h*DPR;
    t.cv.style.width=w+'px';t.cv.style.height=h+'px';
    t.w=w;t.h=h;
  });
}

// ── 绘制轨道 ──
function drawTracks(){
  const ct=getTime(),dur=TOTAL;
  trackRows.forEach(t=>{
    const ctx=t.cv.getContext('2d');
    const W=t.w*DPR,H=t.h*DPR;
    if(!W||!H)return;
    ctx.clearRect(0,0,W,H);
    const col=t.tc.color;
    const hits=t.subData.hits||[];
    const curve=t.subData.energy_curve||[];
    const isMuted=stemMuted[t.stemName]||(soloActive&&soloActive!==t.stemName);
    const alpha=isMuted?0.1:1;

    if(curve.length>0){
      ctx.save();ctx.globalAlpha=alpha;
      ctx.beginPath();ctx.moveTo(0,H);
      for(let i=0;i<curve.length;i++){
        const x=(i/curve.length)*W;
        ctx.lineTo(x,H-curve[i]*H*0.85);
      }
      ctx.lineTo(W,H);ctx.closePath();
      const g=ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0,col+'28');g.addColorStop(1,col+'05');
      ctx.fillStyle=g;ctx.fill();
      ctx.beginPath();
      for(let i=0;i<curve.length;i++){
        const x=(i/curve.length)*W;
        i===0?ctx.moveTo(x,H-curve[i]*H*.85):ctx.lineTo(x,H-curve[i]*H*.85);
      }
      ctx.strokeStyle=col+'44';ctx.lineWidth=1;ctx.stroke();
      ctx.restore();
    }

    ctx.save();ctx.globalAlpha=alpha;
    let hasActiveHit=false;
    hits.forEach(ht=>{
      const x=(ht/dur)*W;
      const isCur=Math.abs(ht-ct)<0.12;
      ctx.strokeStyle=isCur?col:col+'44';
      ctx.lineWidth=isCur?3:0.8;
      if(isCur){ctx.shadowColor=col;ctx.shadowBlur=8;hasActiveHit=true;}
      ctx.beginPath();ctx.moveTo(x,H*.05);ctx.lineTo(x,H*.95);ctx.stroke();
      ctx.shadowBlur=0;
      if(isCur){
        ctx.fillStyle=col;
        ctx.beginPath();ctx.arc(x,H/2,3.5,0,Math.PI*2);ctx.fill();
      }
    });
    ctx.restore();

    // 播放头
    const phX=(ct/dur)*W;
    ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(phX,0);ctx.lineTo(phX,H);ctx.stroke();

    // 实时能量条
    if(_ready&&stemAnalysers[t.stemName]){
      const a=stemAnalysers[t.stemName];
      const fd=new Uint8Array(a.frequencyBinCount);
      a.getByteFrequencyData(fd);
      const SR=actx.sampleRate,binHz=SR/FFT,bins=a.frequencyBinCount;
      let lo=0,hi=bins-1;
      if(t.tc.freq&&t.tc.freq.includes('-')){
        lo=Math.max(0,Math.round(parseInt(t.tc.freq)/binHz));
        hi=Math.min(bins-1,Math.round(parseInt(t.tc.freq.split('-')[1])/binHz));
      }
      let sum=0,cnt=0;
      for(let b=lo;b<=hi;b++){sum+=fd[b];cnt++;}
      const e=cnt>0?sum/(cnt*255):0;
      const bW=6*DPR,bH=e*H*.88,bx=W-bW-2;
      ctx.globalAlpha=isMuted?.06:1;
      ctx.fillStyle=col+'99';
      ctx.fillRect(bx,H-bH,bW,bH);
      ctx.globalAlpha=1;
      if(e>0.4&&!isMuted)t.flashTimer=4;
    }

    if(hasActiveHit&&!isMuted){
      t.flashTimer=5;
      triggerHitVFX(t.tc.name,col);
    }
    if(t.flashTimer>0){t.row.classList.add('flash');t.flashTimer--;}
    else t.row.classList.remove('flash');
  });
}

// ══════════════════════════════════════════════════════════════
// HIT VFX
// ══════════════════════════════════════════════════════════════
let lastFlashT=0;

function triggerHitVFX(name,color){
  // HIT 指示条
  const seg=document.getElementById('hs-'+name);
  if(seg){
    seg.classList.remove('active');
    void seg.offsetWidth;
    seg.classList.add('active');
  }
  const ct=getTime();
  if(ct-lastFlashT<0.12)return;
  const kickHit=isHitting('kick',ct);
  const snareHit=isHitting('snare',ct);
  if(kickHit&&snareHit){
    fireFlash('#ff3b30',0.25);lastFlashT=ct;
  }else if(kickHit){
    fireEdge('#ff3b30');
  }else if(snareHit){
    fireEdge('#ff9f0a');
  }
}

function isHitting(n,ct){
  return (STEMS[n]?.hits||[]).some(t=>Math.abs(t-ct)<0.12);
}

function fireFlash(color,intensity){
  const el=document.getElementById('hitFlash');
  const hex=Math.round(intensity*80).toString(16).padStart(2,'0');
  el.style.background=`radial-gradient(circle at center,${color}${hex},transparent 70%)`;
  el.classList.remove('fire');void el.offsetWidth;el.classList.add('fire');
}
function fireEdge(color){
  const el=document.getElementById('edgeGlow');
  el.style.boxShadow=`inset 0 0 60px 10px ${color}33,inset 0 0 120px 20px ${color}15`;
  el.classList.remove('fire');void el.offsetWidth;el.classList.add('fire');
}

// ══════════════════════════════════════════════════════════════
// 静态波形
// ══════════════════════════════════════════════════════════════
const wfCv=document.getElementById('wf-cv');
let WW,WH;
function drawStaticWF(){
  if(!WW)return;
  const ctx=wfCv.getContext('2d'),W=WW*DPR,H=WH*DPR;
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#020208';ctx.fillRect(0,0,W,H);
  TRACKS_CFG.forEach(tc=>{
    const hits=(STEMS[tc.name]||{}).hits||[];
    ctx.strokeStyle=tc.color+'33';ctx.lineWidth=.6;
    hits.forEach(t=>{const x=(t/TOTAL)*W;ctx.beginPath();ctx.moveTo(x,H*.1);ctx.lineTo(x,H*.9);ctx.stroke();});
  });
  ctx.strokeStyle='rgba(255,110,199,.15)';ctx.lineWidth=.8;ctx.setLineDash([2,4]);
  BAR_STARTS.forEach(t=>{const x=(t/TOTAL)*W;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();});
  ctx.setLineDash([]);
  EVENTS.forEach(e=>{
    if(!e.is_cue)return;
    const x=(e.time/TOTAL)*W,c=e.color||'#fff';
    ctx.fillStyle=c;ctx.shadowColor=c;ctx.shadowBlur=3;
    ctx.beginPath();ctx.moveTo(x,2);ctx.lineTo(x+3,H/2);ctx.lineTo(x,H-2);ctx.lineTo(x-3,H/2);
    ctx.closePath();ctx.fill();ctx.shadowBlur=0;
  });
}

// ══════════════════════════════════════════════════════════════
// 事件日志 + 轨道气泡触发
// ══════════════════════════════════════════════════════════════
function buildLog(){
  const l=document.getElementById('evl');l.innerHTML='';
  EVENTS.forEach((e,i)=>{
    const el=document.createElement('div');
    el.className='ev-item';el.id='ei'+i;
    el.innerHTML=`<span class="ev-t">${e.time.toFixed(1)}s</span><span class="ev-i">${e.icon||'🎵'}</span><span class="ev-tx">${e.label||e.desc||''}</span><div class="ev-dot" style="background:${e.color||'#888'}"></div>`;
    l.appendChild(el);e.el=el;
  });
}

let lastEv=-1;
function updateCue(){
  const ct=getTime();
  let best=null,bd=9999;
  EVENTS.forEach(e=>{const d=ct-e.time;if(d>=0&&d<4&&d<bd){bd=d;best=e;}});
  const cue=document.getElementById('cue');
  if(best){
    cue.style.background=best.color+'1a';cue.style.borderColor=best.color+'55';cue.style.color=best.color;
    document.getElementById('ci').textContent=best.icon||'🎵';
    document.getElementById('ct').textContent=best.label||best.desc||'';
    document.getElementById('csub').textContent=best.desc||'';
    if(best.idx!==lastEv){
      lastEv=best.idx;
      document.querySelectorAll('.ev-item').forEach(el=>{
        el.classList.remove('active');
        if(parseFloat(el.querySelector('.ev-t').textContent)<ct)el.classList.add('passed');
      });
      best.el?.classList.add('active');
      best.el?.scrollIntoView({behavior:'smooth',block:'nearest'});

      // ★ 触发轨道气泡/大横幅
      const k=`${best.idx}`;
      if(!evShownAt[k]){
        evShownAt[k]=ct;
        triggerEventVisual(best);
      }
    }
  }else if(_playing){
    cue.style.background='rgba(0,0,0,.4)';
    cue.style.borderColor='rgba(255,255,255,.06)';
    cue.style.color='rgba(255,255,255,.22)';
    document.getElementById('ci').textContent='🎯';
    document.getElementById('ct').textContent=ct<MSTART?'等待音乐...':'感受节拍';
    document.getElementById('csub').textContent='';
  }
}

// 根据事件类型触发不同视觉反馈
function triggerEventVisual(ev){
  const type=ev.type||'';
  // 段落事件 → 大横幅
  if(type==='bar1'||type==='peak'){
    showSegmentBanner(ev.icon||'🔁',ev.label||ev.desc||'',ev.color||'#fff');
    return;
  }
  // 乐器进入 → 对应轨道气泡
  const trackMap={
    kick:'kick',snare:'snare',cymbals:'cymbals',toms:'toms',
    bass_in:'bass',vocal:'vocals',guitar:'guitar',piano:'piano',bass:'bass'
  };
  const trackName=trackMap[type]||type;
  showTrackBubble(trackName,ev.icon||'✨',ev.label||ev.desc||'',ev.color||'#fff');
}

// ══════════════════════════════════════════════════════════════
// 8拍 + and拍
// ══════════════════════════════════════════════════════════════
let curBeat=-1,curBar=-1;
let andMode=false; // and拍开关
let curSub=-1;     // 当前子拍索引(0=1 1=e 2=& 3=a)
let curSubBeat=-1; // 当前属于第几个主拍

function toggleAndMode(){
  andMode=!andMode;
  const btn=document.getElementById('andModeBtn');
  const grid=document.getElementById('andGrid');
  btn.classList.toggle('active',andMode);
  grid.style.display=andMode?'grid':'none';
  if(!andMode){
    // 清空所有 ax子单元
    for(let b=0;b<8;b++)for(let s=0;s<4;s++){
      document.getElementById(`ax${b}-${s}`)?.classList.remove('on1','one','onaand','ona');
    }
  }
}

function updateBeat(){
  const ct=getTime();
  if(!BEATS.length||ct<MSTART){
    if(curBeat>=0){document.getElementById('bx'+curBeat)?.classList.remove('on','kick','snare','hihat','bar1');curBeat=-1;}
    document.getElementById('bnum').textContent='—';return;
  }
  let lo=0,hi=BEATS.length-1;
  while(lo<=hi){const m=(lo+hi)>>1;BEATS[m]<=ct?lo=m+1:hi=m-1;}
  const bi=hi;if(bi<0)return;
  const nb=bi%8,nbar=Math.floor(bi/8);
  if(nb!==curBeat){
    if(curBeat>=0)document.getElementById('bx'+curBeat)?.classList.remove('on','kick','snare','hihat','bar1');
    curBeat=nb;
    const el=document.getElementById('bx'+curBeat);if(!el)return;
    el.classList.add('on');
    const bt=BEATS[bi];
    if(nb===0)el.classList.add('bar1');
    else if(isHitting('kick',bt))el.classList.add('kick');
    else if(isHitting('snare',bt))el.classList.add('snare');
  }
  if(nbar!==curBar){
    curBar=nbar;
    document.getElementById('bnum').textContent=curBar+1;
  }

  // and拍细分
  if(andMode&&BEATS.length>1){
    // 用当前拍到下一拍的实际间距（更精确，支持非匀速 BPM）
    const nextBeat=BEATS[Math.min(bi+1,BEATS.length-1)];
    const subDur=(nextBeat-BEATS[bi])/4; // 每主拍 → 4 子拍 (1-e-&-a)
    const elapsed=ct-BEATS[bi];
    const ns=Math.max(0,Math.min(3,Math.floor(elapsed/subDur)));
    if(ns!==curSub||nb!==curSubBeat){
      // 清除上一个高亮
      if(curSubBeat>=0&&curSubBeat<8&&curSub>=0){
        const cls=['on1','one','onaand','ona'][curSub];
        document.getElementById(`ax${curSubBeat}-${curSub}`)?.classList.remove(cls);
      }
      curSub=ns;curSubBeat=nb;
      const cls=['on1','one','onaand','ona'][ns];
      document.getElementById(`ax${nb}-${ns}`)?.classList.add(cls);
    }
  }
}

// ══════════════════════════════════════════════════════════════
// 舞步更新
// ══════════════════════════════════════════════════════════════
function updateDance(){
  const ct=getTime();
  let cur=null;
  for(let i=DANCE_MOVES.length-1;i>=0;i--){
    if(ct>=DANCE_MOVES[i].time&&ct<DANCE_MOVES[i].end){cur=DANCE_MOVES[i];break;}
  }
  if(cur&&_playing){
    const genreLabel=GENRE_INFO?.short||GENRE_INFO?.name||'跳舞建议';
    document.getElementById('danceStyle').textContent=`💃 ${genreLabel}`;
    document.getElementById('danceMoveName').textContent=cur.move;
    document.getElementById('danceMoveTip').textContent=cur.tip;
  }
}

// ══════════════════════════════════════════════════════════════
// 播放头
// ══════════════════════════════════════════════════════════════
function getTime(){return STEM_AUDS.drums.currentTime||0;}
function updateHead(){
  const ct=getTime(),dur=TOTAL;
  document.getElementById('ph').style.left=(dur>0?ct/dur*100:0)+'%';
  const f=fmt(ct);
  document.getElementById('tc').textContent=f;
  document.getElementById('ctxt').textContent=f;
}

// ══════════════════════════════════════════════════════════════
// 主循环
// ══════════════════════════════════════════════════════════════
function loop(){
  drawTracks();updateHead();updateBeat();updateCue();updateDance();
  requestAnimationFrame(loop);
}

// ══════════════════════════════════════════════════════════════
// 控制
// ══════════════════════════════════════════════════════════════
let _playing=false;
function tp(){_playing?pa():pl();}
function pl(){
  initAudio();
  if(actx?.state==='suspended')actx.resume();
  Object.values(STEM_AUDS).forEach(a=>a.play().catch(()=>{}));
  _playing=true;document.getElementById('pb').textContent='⏸';
}
function pa(){
  Object.values(STEM_AUDS).forEach(a=>a.pause());
  _playing=false;document.getElementById('pb').textContent='▶';
}
function syncTime(t){Object.values(STEM_AUDS).forEach(a=>{a.currentTime=t;});}

STEM_AUDS.drums.addEventListener('ended',()=>{_playing=false;document.getElementById('pb').textContent='▶';});
function skipB(n){
  const bd=BEATS.length>1?(BEATS[1]-BEATS[0]):(60/BPM);
  syncTime(Math.max(0,Math.min(TOTAL,getTime()+n*bd)));
}
function seekClick(e,el){
  const r=el.getBoundingClientRect();
  syncTime(((e.clientX-r.left)/r.width)*TOTAL);
}
function ss(v,btn){
  Object.values(STEM_AUDS).forEach(a=>a.playbackRate=v);
  document.querySelectorAll('.spd').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
}
function toggleStem(btn){
  const n=btn.dataset.stem;stemMuted[n]=!stemMuted[n];
  STEM_AUDS[n].muted=stemMuted[n];
  btn.classList.toggle('muted',stemMuted[n]);btn.classList.toggle('on',!stemMuted[n]);
}
function soloStem(btn){
  const n=btn.dataset.solo;
  if(soloActive===n){
    soloActive=null;
    Object.keys(STEM_AUDS).forEach(k=>{STEM_AUDS[k].muted=stemMuted[k];});
    document.querySelectorAll('[data-solo]').forEach(b=>b.classList.remove('solo'));
  }else{
    soloActive=n;
    Object.keys(STEM_AUDS).forEach(k=>{STEM_AUDS[k].muted=(k!==n);});
    document.querySelectorAll('[data-solo]').forEach(b=>b.classList.toggle('solo',b.dataset.solo===n));
  }
}
function setVol(v){Object.values(STEM_AUDS).forEach(a=>a.volume=v);}
function fmt(s){if(!isFinite(s))return'0:00';return Math.floor(s/60)+':'+(Math.floor(s%60)+'').padStart(2,'0');}

STEM_AUDS.drums.addEventListener('loadedmetadata',()=>{
  TOTAL=STEM_AUDS.drums.duration;
  document.getElementById('tt').textContent=fmt(TOTAL);
});

// ══════════════════════════════════════════════════════════════
// 尺寸
// ══════════════════════════════════════════════════════════════
function resize(){
  WW=wfCv.offsetWidth;WH=wfCv.offsetHeight;
  wfCv.width=WW*DPR;wfCv.height=WH*DPR;
  wfCv.style.width=WW+'px';wfCv.style.height=WH+'px';
  resizeTracks();drawStaticWF();
}
window.addEventListener('resize',resize);
window.addEventListener('load',async()=>{resize();await loadJSON();loop();});
</script>
